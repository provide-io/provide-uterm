[project]
name = "provide-uterm-workspace"
version = "0.5.0"
requires-python = ">=3.11"
dependencies = [
    "provide-uterm[emulator,ssh]>=0.5.0",
    "provide-uterm-annotation>=0.5.0",
    "provide-uterm-server[all]>=0.5.0",
    "provide-uterm-platform[all]>=0.5.0",
    "provide-telemetry>=0.6.0",
]

[dependency-groups]
dev = [
    "asyncssh>=2.23.0",
    "bandit>=1.9.4",
    "codespell>=2.4.2",
    "detect-secrets>=1.5.0",
    "fastapi>=0.141.1",
    "httpx>=0.27",
    "hypothesis>=6.165.2",
    "memray>=1.20.0; sys_platform != 'win32'",
    "mutmut>=3.7.0",
    "Pillow>=12.3.0",
    "mypy>=2.3.0",
    "pip-audit>=2.10.1",
    "pip-licenses>=5.5.5",
    "pre-commit>=4.6.0",
    "pydantic>=2.0",
    "pyjwt>=2.12.1",
    "pyte>=0.8.2",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-playwright>=0.7.2",
    "pytest-randomly>=3.15.0",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.8",
    "reuse>=6.2.0",
    "ruff>=0.16.2",
    "ty>=0.0.39",
    "uv>=0.11.16",
    "uvicorn>=0.47.0",
    "vulture>=2.16",
    "websockets>=16.0",
    # The Cloudflare package declares this in its own dev EXTRA, but CI syncs
    # the workspace-root dev GROUP, which does not install member extras — so
    # the CF lifecycle scenario suite (part of the default root testpaths)
    # never had it and failed on missing package metadata.
    # 1.11+ matters: workers-py 1.6.x accepted any rich >=13 while importing a
    # re-export rich deleted in 14.3.4, so it could not start its CLI. Newer
    # versions import from rich.console and support 3.11 again, so no rich pin
    # is needed. Its pywrangler also requires wrangler >=4.109, which is why
    # that npm tool is a pinned devDependency rather than whatever npx cached.
    "workers-py>=1.16.4",
    "pyyaml>=6.0",
    "xenon>=0.9.3",
    "mcp>=2.0.0",
    "pytest-textual-snapshot>=1.0.0",
    "respx>=0.23.1",
    "pytest-pyodide>=0.59.2",
]

[tool.uv]
# Constrain a TRANSITIVE dependency without declaring it as one of ours.
# caio 0.12.x installs its own `tests/` as a TOP-LEVEL package into
# site-packages (verified: caio-0.12.2.dist-info/RECORD lists tests/…), which
# shadows this repo's own `tests` package. Under pytest that turns
# `from ..helpers import ...` in packages/provide-uterm/tests/bridge into
# `ModuleNotFoundError: No module named 'tests.helpers'` — the suite collects
# against caio's tests package instead of its own. 0.12.2 is the latest
# release, so there is nothing newer to move to; 0.9.25 was in the lock before
# and is unaffected. Reached via py-key-value-aio -> aiofile -> caio.
# Drop this once caio stops shipping tests/ at the top level.
constraint-dependencies = ["caio<0.12"]

[tool.uv.workspace]
members = ["packages/provide-uterm", "packages/provide-uterm-annotation", "packages/provide-uterm-cloudflare", "packages/provide-uterm-platform", "packages/provide-uterm-server", "packages/provide-uterm-client"]
[tool.uv.sources]
provide-uterm = { workspace = true }
provide-uterm-annotation = { workspace = true }
provide-uterm-cloudflare = { workspace = true }
provide-uterm-platform = { workspace = true }
provide-uterm-server = { workspace = true }
provide-uterm-client = { workspace = true }

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "packages/provide-uterm-cloudflare/python_modules",
]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "C4", "SIM", "TCH", "PTH",
    "DTZ", "ICN", "ISC", "PERF", "PIE", "RET", "RSE", "TID", "S", "ARG", "RUF",
]
ignore = [
    "E501",  # line-too-long
    "S101",  # use-of-assert
    "S104",  # hardcoded-bind-all-interfaces
    "S108",  # hardcoded-temp-file
    "S110",  # try-except-pass
    "S112",  # try-except-continue
    "S311",  # suspicious-non-cryptographic-random
    "S603",  # subprocess-without-shell
    "S607",  # start-process-with-partial-path
    "S604",  # call-with-shell-equals-true
    "F811",  # redefined-while-unused
    "N806",  # non-lowercase-variable-in-function
    "N814",  # camelcase-imported-as-constant
    "B017",  # assert-raises-exception
    "SIM105", # suppressible-exception
    "SIM117", # multiple-with-statements
    "ARG001", # unused-function-argument
    "ARG002", # unused-method-argument — protocol interfaces
    "PTH108", # os-unlink — stylistic
    "SIM108", # ternary-operator — stylistic
    "PERF401", # manual-list-comprehension — perf suggestion — nested with patch() is clearer in tests
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "RUF022"]
"tests_mutation/**/*.py" = ["E402", "B905", "S101", "S105", "S106", "S110", "ARG", "TCH", "RUF003", "RUF012", "RUF015", "RUF043", "RUF059"]
"packages/**/tests/**/*.py" = ["E402", "B905", "S101", "S105", "S106", "S110", "S603", "S607", "ARG", "TCH", "RUF003", "RUF012", "RUF015", "RUF043", "RUF059"]
# The repo-level suites (conformance, scripts, ansi) are tests too, and trip
# the same rules for the same reasons: fixtures assert, tokens are literals,
# and a test's imports are used at runtime.
"tests/**/*.py" = ["E402", "B905", "S101", "S105", "S106", "S110", "S603", "S607", "ARG", "TCH", "RUF003", "RUF012", "RUF015", "RUF043", "RUF059"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
follow_imports = "normal"
ignore_missing_imports = false
namespace_packages = true
explicit_package_bases = true
mypy_path = ["packages/provide-uterm/src", "packages/provide-uterm-annotation/src", "packages/provide-uterm-server/src", "packages/provide-uterm-platform/src", "packages/provide-uterm-client/src", "packages/provide-uterm-cloudflare/src"]

[[tool.mypy.overrides]]
module = ["provide.telemetry", "provide.telemetry.*", "provide.uterm.deckmux", "provide.uterm.deckmux.*", "structlog", "structlog.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# CF-runtime-only imports. The Cloudflare Python Workers SDK ships py.typed
# but uses PEP 695 `type` statements, which mypy cannot parse under
# python_version = "3.11"; pyodide's presence in the venv varies with how the
# environment was last resolved. Both are guarded behind try/except at the
# import sites (cf_types.py, entry/fallback_stubs.py, auth/jwt.py,
# do/_webhook_crypto.py), so skip following them rather than letting the
# verdict depend on the installed environment.
module = ["workers", "pyodide", "pyodide.*"]
follow_imports = "skip"
ignore_missing_imports = true


[[tool.mypy.overrides]]
# ty 0.0.19 has a cross-file resolution bug: it can't see methods added to HijackClient
# and SessionRegistry from call sites in other modules. Ignores are unused from mypy's
# perspective — suppress the warn_unused_ignores noise.
module = [
    "provide.uterm.server.routes.api",
]
warn_unused_ignores = false

[tool.ty.environment]
python-version = "3.11"
extra-paths = []

[tool.ty.rules]

[tool.codespell]
# `skip` exempts generated / vendored / build-output trees — nobody writes prose
# there, and their contents are not ours to spell-correct. Two entries worth
# calling out beyond the vendored bundles:
#   packages/provide-uterm-ts/testdata — differential golden corpora and their
#     gen_*.py producers. They deliberately embed accented words (JSON-escaped,
#     so codespell reads the un-accented prefix as a misspelling) and truncated
#     input fixtures used to exercise partial-line handling. Excusing those
#     tokens repo-wide via ignore-words-list would also excuse genuine typos in
#     prose; the corpus itself has no prose to protect.
#   conformance/fuzz — generated fuzz corpora (same reasoning).
# Build outputs (dist/build/reports/coverage/StrykerOutput, the CF ui/static and
# python_modules trees) are gitignored, so they never reach CI, but skipping
# them keeps a whole-tree local run clean.
skip = ".git,*.pyc,__pycache__,.venv,node_modules,uv.lock,package-lock.json,*.mmd,./packages/provide-uterm/src/provide/uterm/frontend/assets/*.js,packages/provide-uterm/src/provide/uterm/frontend/assets/*.js,./packages/provide-uterm-server/src/provide/uterm/server/frontend/assets/*.js,packages/provide-uterm-server/src/provide/uterm/server/frontend/assets/*.js,./packages/provide-uterm-cloudflare/python_modules/provide/uterm/frontend/assets/*.js,packages/provide-uterm-cloudflare/python_modules/provide/uterm/frontend/assets/*.js,packages/provide-uterm-cloudflare/python_modules/structlog/*,./packages/provide-uterm-cloudflare/src/provide/uterm/cloudflare/ui/static/*,packages/provide-uterm-cloudflare/src/provide/uterm/cloudflare/ui/static/*,./packages/provide-uterm-ts/testdata/*,packages/provide-uterm-ts/testdata/*,./conformance/fuzz/*,conformance/fuzz/*,mutants,dist,build,reports,coverage,StrykerOutput,python_modules"
ignore-words-list = "ore,opps,wont,strat,nd,rade,ans,unparseable,cna,intoto,te,shiftin,shttp,defint,onws,alo,ahi,blo,bhi,fo,afterall,wit,dependant"

[tool.bandit]
exclude_dirs = [
    "packages/provide-uterm/tests",
    "packages/provide-uterm-cloudflare/python_modules",
    "packages/provide-uterm-cloudflare/node_modules",
]

[tool.vulture]
min_confidence = 80
paths = ["packages/provide-uterm/src", "packages/provide-uterm/tests"]

[tool.pytest.ini_options]
consider_namespace_packages = true
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
addopts = "--import-mode=importlib -m 'not docker'"
filterwarnings = [
    "ignore:remove second argument of ws_handler:DeprecationWarning",
    "ignore:websockets.server.WebSocketServerProtocol is deprecated:DeprecationWarning",
    "ignore:websockets.legacy is deprecated:DeprecationWarning",
]
testpaths = [
    "packages/provide-uterm/tests",
    "packages/provide-uterm-cloudflare/tests",
]
norecursedirs = [
    ".git",
    ".venv",
    "node_modules",
    "mutants",
    ".hypothesis",
    "packages/provide-uterm-cloudflare/python_modules",
]
markers = [
    "unit: fast unit tests",
    "integration: tests requiring multiple components",
    "playwright: browser-based UI tests",
    "mutant: mutation-testing focused tests",
    "memray: memory profiling tests",
    "slow: slow tests (>10s)",
    "slowtest: legacy alias for slow tests",
    "e2e: end-to-end tests against a live server",
    "real_cf: tests requiring a real Cloudflare deployment",
    "go_interop: tests requiring a built Go uterm binary",
    "docker: tests requiring a running Docker daemon",
    "requires_root: tests that must run as root/sudo",
    "requires_pam: tests requiring PAM library availability",
    "requires_pam_auth: tests performing actual PAM authentication",
    "limit_memory: tests with memory usage constraints",
    "dependency: tests with ordering dependencies",
    "respx: tests using respx for HTTP mocking",
    "timeout: tests with custom timeout constraints",
]

[tool.xenon]
max_absolute = "D"
max_modules = "D"
max_average = "A"

[tool.mutmut]
source_paths = [
    "src/provide/uterm/pty/connector.py",
    "src/provide/uterm/control_channel.py",
    "src/provide/uterm/control_channel_builders.py",
    "src/provide/uterm/control_channel_patterns.py",
    "src/provide/uterm/auth.py",
    "src/provide/uterm/detection/detector.py",
    "src/provide/uterm/detection/detector_compile.py",
    "src/provide/uterm/detection/engine.py",
    # detection/flow.py — FlowEngine.advance tail-most prompt selection
    #   (login-load-bearing; a hand-rolled max() once slipped the 100% coverage
    #   gate, so it is mutation-enforced). Bound by test_flow.py, wired into
    #   pytest_add_cli_args_test_selection below.
    "src/provide/uterm/detection/flow.py",
    "src/provide/uterm/io.py",
    # Pure latin-1 WS byte helpers — small, already unit-tested.
    "src/provide/uterm/ws_bytes.py",
    # Pure telnet/ANSI byte filters (IAC + escape consume) — unit-tested.
    "src/provide/uterm/filters.py",
    "src/provide/uterm/recording.py",
    # Bridge protocol negotiation — boundary-heavy, security-relevant.
    # Covered by tests/test_protocol_negotiation.py.
    "src/provide/uterm/bridge/contracts.py",
    # Server-package paths. These MUST be addressed through the workspace-root
    # ``src/`` symlink tree (``src/provide/uterm/server/...``), NOT the real
    # ``packages/provide-uterm-server/src/...`` path. mutmut derives a mutant's
    # name from ``str(path).replace(os.sep, ".")`` after stripping a leading
    # ``src.`` prefix (see ``get_mutant_name`` in mutmut/__main__.py). The
    # trampoline that records test→mutant coverage keys on the imported
    # module's ``__module__`` (``provide.uterm.server.bridge.hub.limiter``).
    # A ``packages/...`` path yields the name
    # ``packages.provide-uterm-server.src.provide.uterm.server...`` which never
    # matches ``__module__`` — so EVERY server mutant reported ``no_tests``.
    # The ``src/provide/uterm/server`` symlink (-> the server package's source)
    # makes the derived name equal ``provide.uterm.server...`` and binding
    # works. The matching test files are in ``pytest_add_cli_args_test_selection`` below.
    #
    # HijackLease.expire boundary + lease arithmetic.
    "src/provide/uterm/server/bridge/models.py",
    # Tunnel token hashing — constant-time compare, security-critical.
    "src/provide/uterm/tunnel/token_hash.py",
    # HTTP intercept header denylist + gating policy.
    "src/provide/uterm/tunnel/intercept.py",
    # Server security-relevant request handling. config_schema.py + app/factory.py
    # (below) have bound suites (test_config.py / test_app_coverage.py) and stay
    # enforced. routes/, webhooks.py, and manager/{process,config}.py were enumerated
    # here, but a 2026-06-01 audit — measuring each with its covering tests wired —
    # found NONE can reach a stable killed==100, so each is DEFERRED (commented) with
    # its specific obstacle. A --changed-only run on a deferred file is then correctly
    # skipped (not a false pass). Re-add each once its obstacle is resolved.
    #
    # routes/ — ENFORCED at killed==100, reclosed 2026-08-10 (d2004938). It first
    #   reached 100 on 2026-06-02, then regressed 2026-07-23 when 9bc4dd0c
    #   de-decorated the session handlers: mutmut skips decorated functions, so
    #   de-decorating put ~2600 mutants live in one commit, behind tests whose line
    #   coverage never moved off 100. Closing it took a family of
    #   test_route*_mutation_killing.py suites (note the odd one out,
    #   test_route_defs_*, which does not share the test_routes_ prefix), all wired
    #   into the pytest selection below — without that mutmut runs none of them in
    #   the mutants tree. Keep new handlers covered there: the decorator no longer
    #   hides them. Full history, per-file numbers, and the async-hang caveat the
    #   de-decoration revived: docs/mutmut-survivors-triage.md Wave 9.
    "src/provide/uterm/server/routes/",
    #
    # webhooks.py — RE-ENABLED at killed==100 (2026-06-02). The deferral was a REAL
    #   obstacle: with the 8 test_webhooks_part*.py suites wired it measured 21% because
    #   307/406 mutants SEGFAULT — those suites call the REAL socket.getaddrinfo at
    #   registration time, so a mutant perturbing the resolver/delivery args drives the C
    #   resolver (or real httpx + real sleeps) in a mutmut-forked child, crashing it. Fix:
    #   a dedicated FULLY NETWORK-MOCKED kill suite (test_webhooks_mutation_killing.py,
    #   wired into pytest selection) whose autouse getaddrinfo MagicMock + patched httpx/sleep
    #   keep all egress out of the forked child (segfault 307 -> 0). 400 killed + 6
    #   documented equivalents excused via mutation_equivalents.toml. The 7 part suites
    #   stay the normal-pytest coverage suite (real DNS is safe without forking), UNWIRED.
    "src/provide/uterm/server/webhooks.py",
    # registry.py — RE-ENABLED at killed==100 (2026-06-02). The prior deferral (async
    #   SSE/__init__/background-task mutants hang/segfault non-deterministically; ~53%
    #   with the existing test_registry.py suites) was a REAL obstacle: those suites run
    #   the real SSE generators/timers AND depend on connector-registry state the mutants
    #   tree lacks (test_invalid_input_mode_raises aborts the stats phase because 'shell'
    #   isn't registered there). Fix: a dedicated SELF-CONTAINED fully-mocked kill suite
    #   (test_registry_mutation_killing.py, wired into pytest selection) that patches
    #   HostedSessionRuntime / registered_types / egress / asyncio.sleep and drives the
    #   EventBus queue with mocks, consuming the SSE generator with a per-step
    #   asyncio.wait_for bound — so no external state or real async streaming reaches a
    #   forked worker (timeout/segfault -> 0). 385 killed + 30 documented equivalents
    #   (default-args, cast no-ops, model_dump-mode no-ops, dead initials, getattr-always-
    #   set, always-present pop) excused via mutation_equivalents.toml. The fragile
    #   existing test_registry.py/test_runtime.py suites stay UNWIRED.
    "src/provide/uterm/server/registry.py",
    # config_schema.py — RE-ENABLED at killed==100 (2026-06-02). The prior "baseline
    # aborts / @model_validator trips the trampoline" deferral was WRONG: a measured
    # run produces a clean 34-mutant baseline with ZERO no_tests. mutmut SKIPS every
    # decorated function by design (@model_validator/@field_validator/@classmethod —
    # see _skip_node_and_children in mutmut/file_mutation.py), and class-body field
    # defaults aren't inside a function, so the file's only mutable surface is its two
    # UNDECORATED module-level helpers: _clean_path and the _require_secure_url SSRF
    # guard. All 34 mutants are bound + killed by test_models_mutation_killing.py
    # (wired into pytest selection) EXCEPT one documented equivalent
    # (_require_secure_url__mutmut_14, the unreachable-fallback string) excused via
    # mutation_equivalents.toml. The decorated Pydantic validators stay line/branch +
    # unit tested via test_config.py (mutmut cannot reach them in any file).
    "src/provide/uterm/server/config_schema.py",
    "src/provide/uterm/server/app/factory.py",
    # manager/process.py + config.py — NOT mutation targets: both have ZERO mutable
    #   surface (measured 2026-06-02 via mutmut.file_mutation.mutate_file_contents → 0
    #   mutants each). process.py is a pure RE-EXPORT SHIM (`from process_impl import
    #   AgentProcessManager, ...` + __all__); config.py is a Pydantic BaseModel whose
    #   class-body field defaults mutmut skips (the same decorated/field-default skip as
    #   config_schema.py). So `total:0` is correct — there is nothing to mutate — and the
    #   earlier "process.py drives subprocesses the trampoline can't instrument" comment
    #   was a MISDIAGNOSIS. Intentionally NOT listed (a 0-mutant entry fails `total>0`).
    #   The REAL process-management logic + mutation value lives in manager/process_impl.py
    #   (686 mutants, in-process AgentProcessManager) — RE-ENABLED at killed==100 below.
    #
    # process_impl.py — RE-ENABLED at killed==100 (2026-06-03). The "reaper-unstable"
    #   deferral was the SAME test_process.py child-reaping crash as lease.py: that suite's
    #   one real subprocess.Popen test leaks children into mutmut's os.wait() reaper. Fix:
    #   (1) it is NOT wired here; (2) a manager-dir conftest.py autouse fixture blanket-mocks
    #   subprocess.Popen / os.killpg / os.getpgid ONLY during mutation runs (keyed on
    #   MUTANT_UNDER_TEST), so a guard-defeat mutant in spawn_agent/_stop_process_tree can
    #   never spawn a real child. With that, the run is fully stable (0 timeout/0 not_checked).
    #   662/662 killed + 24 documented equivalents (mutation_equivalents.toml): 12 trampoline-
    #   masked default-args, 4 suppress(OSError, ProcessLookupError|TimeoutError) subclass
    #   no-ops, 4 getattr-config-field-always-set, 2 `or 'default'`-masked .get defaults,
    #   1 int(None or 0)==0 getattr, 1 `% 360` sign-flip. The 14 mocked manager suites
    #   (test_process_mutation_killing{,_2..5}.py + test_process_*/_coverage_*) are wired in
    #   pytest selection below; test_process.py stays UNWIRED (real Popen).
    #
    # process_impl_spawn.py — the low-level spawn/stop group (spawn_agent /
    #   _spawn_process / _spawn_platform_kwargs / _build_preexec_rlimit_fn /
    #   _stop_process_tree) split out of process_impl.py to keep both files <500
    #   LOC. Same mutation contract (killed==100) and same kill-suites; the class
    #   methods in process_impl.py are thin wrappers forwarding here. The 4
    #   _stop_process_tree documented equivalents are re-homed under the
    #   process_impl_spawn.x__stop_process_tree__mutmut_* module-function names in
    #   mutation_equivalents.toml.
    "src/provide/uterm/manager/process_impl.py",
    "src/provide/uterm/manager/process_impl_spawn.py",
    # Refactor #16 service classes — state-machine + dispatch logic split
    # out of the former TermHub mixin pile. High mutation value; tests for
    # each service live under tests/bridge/hub/test_<name>.py.
    "src/provide/uterm/server/bridge/hub/registry.py",
    "src/provide/uterm/server/bridge/hub/limiter.py",
    # lease.py — RE-ENABLED at killed==100 (489/489, 0 survived, 0 no_tests). The
    # dedicated suites (test_lease.py + the ownership/atomic suites + the five
    # test_lease_kill_*.py behaviour-pinning suites, ~188 tests) are wired into
    # pytest selection below; the sole equivalent-class mutant (the _LeaseHubCallbacks
    # .metric Protocol-stub default) was removed via `= ...`. The CI mutmut
    # KeyError that previously mass-reported not_checked here was traced to the
    # subprocess-spawning test_process.py leaking worker children into mutmut's
    # fork-loop os.wait() — that suite is now removed from pytest selection (above).
    "src/provide/uterm/server/bridge/hub/lease.py",
    "src/provide/uterm/server/bridge/hub/router.py",
    # connection.py — ConnectionManager (register/deregister worker + browser,
    # disconnect, cleanup). Kill-suites wired in pytest selection below (the dedicated
    # test_connections_* suites + test_connection_kill_*.py behaviour-pinning
    # suites). Enforced at killed==100 now that the mutmut child-reaping crash is
    # fixed (test_process.py removed from pytest selection).
    "src/provide/uterm/server/bridge/hub/connection.py",
    # connection_hijack.py — module-level bodies of ConnectionManager's
    # hijack-clearing lifecycle (disconnect_worker / _event_bus_close /
    # force_release_hijack), split out to keep connection.py < 500 LOC. Driven
    # by the same test_connection_kill_hijack_clearing.py / _ratelimit_force.py
    # suites (which call the ConnectionManager wrappers by name). Enforced at
    # killed==100.
    "src/provide/uterm/server/bridge/hub/connection_hijack.py",
    "src/provide/uterm/server/bridge/hub/presence.py",
    "src/provide/uterm/server/bridge/hub/store.py",
    "src/provide/uterm/server/bridge/hub/polling_service.py",
    # Pydantic frame schemas — single source of truth for wire format.
    "src/provide/uterm/bridge/schemas.py",
    # Cross-language role/lease policy (spec/behavior.json).
    "src/provide/uterm/bridge/policy.py",
    # HijackCoordinator (moved to core in #15) — lease state machine.
