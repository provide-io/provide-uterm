[project]
name = "provide-terminal-workspace"
version = "0.4.0"
description = "Workspace root for the provide-terminal emulator, server, platform, client, and cloudflare packages"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
authors = [
    { name = "provide.io", email = "code@provide.io" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Terminals",
    "Topic :: Terminals :: Terminal Emulators/X Terminals",
    "Topic :: System :: Shells",
]
dependencies = [
    "provide-terminal[emulator,ssh]",
    "provide-terminal-server[all]",
    "provide-terminal-platform[all]",
    "provide-telemetry>=0.3",
]

[project.urls]
Homepage = "https://github.com/provide-io/provide-terminal"
Repository = "https://github.com/provide-io/provide-terminal"
Issues = "https://github.com/provide-io/provide-terminal/issues"

[dependency-groups]
dev = [
    "asyncssh>=2.22.0",
    "bandit>=1.9",
    "codespell>=2.4.1",
    "detect-secrets>=1.5.0",
    "fastapi>=0.110",
    "httpx>=0.27",
    "hypothesis>=6.151.9",
    "memray>=1.0; sys_platform != 'win32'",
    "mutmut>=3.3.1",
    "Pillow>=10.0",
    "mypy>=1.19",
    "pip-audit>=2.7.0",
    "pip-licenses>=5.5.0",
    "pre-commit>=4.0",
    "pydantic>=2.0",
    "pyjwt>=2.9",
    "pyte>=0.8.2",
    "pytest>=9.0",
    "pytest-asyncio>=1.3",
    "pytest-cov>=7.0",
    "pytest-playwright>=0.7.2",
    "pytest-randomly>=3.15.0",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.8",
    "reuse>=6.2.0",
    "ruff>=0.15",
    "ty>=0.0.17",
    "uv>=0.10.7",
    "uvicorn>=0.24",
    "vulture>=2.14",
    "websockets>=16.0",
    "pyyaml>=6.0",
    "xenon>=0.9.3",
    "fastmcp>=2.0",
    "pytest-textual-snapshot>=1.0.0",
]

[tool.uv.workspace]
members = ["packages/provide-terminal", "packages/provide-terminal-cloudflare", "packages/provide-terminal-platform", "packages/provide-terminal-server", "packages/provide-terminal-client"]

[tool.uv.sources]
provide-terminal = { workspace = true }
provide-terminal-cloudflare = { workspace = true }
provide-terminal-platform = { workspace = true }
provide-terminal-server = { workspace = true }
provide-terminal-client = { workspace = true }

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "packages/provide-terminal-cloudflare/python_modules",
]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "C4", "SIM", "TCH", "PTH",
    "DTZ", "ICN", "ISC", "PERF", "PIE", "RET", "RSE", "TID", "S", "ARG", "RUF",
]
ignore = ["E501", "S104", "S112", "S311"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "RUF022"]
"tests_mutation/**/*.py" = ["E402", "B905", "S101", "S105", "S106", "S110", "ARG", "TCH", "RUF003", "RUF012", "RUF015", "RUF043", "RUF059"]
"packages/**/tests/**/*.py" = ["E402", "B905", "S101", "S105", "S106", "S110", "S603", "S607", "ARG", "TCH", "RUF003", "RUF012", "RUF015", "RUF043", "RUF059"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
follow_imports = "normal"
ignore_missing_imports = false
namespace_packages = true
explicit_package_bases = true
mypy_path = ["packages/provide-terminal/src", "packages/provide-terminal-server/src", "packages/provide-terminal-platform/src", "packages/provide-terminal-client/src"]

[[tool.mypy.overrides]]
module = ["provide.telemetry", "provide.telemetry.*", "provide.terminal.deckmux", "provide.terminal.deckmux.*", "structlog", "structlog.*"]
ignore_missing_imports = true


[[tool.mypy.overrides]]
# ty 0.0.19 has a cross-file resolution bug: it can't see methods added to HijackClient
# and SessionRegistry from call sites in other modules. Ignores are unused from mypy's
# perspective — suppress the warn_unused_ignores noise.
module = [
    "provide.terminal.mcp.server",
    "provide.terminal.server.routes.api",
]
warn_unused_ignores = false

[tool.ty.environment]
python-version = "3.11"
extra-paths = []

[tool.ty.rules]
invalid-argument-type = "ignore"
unused-type-ignore-comment = "ignore"

[tool.codespell]
skip = ".git,*.pyc,__pycache__,.venv,node_modules,uv.lock,*.mmd,packages/provide-terminal/src/provide/terminal/frontend/assets/*.js,packages/provide-terminal-cloudflare/python_modules/provide/terminal/frontend/assets/*.js,packages/provide-terminal-cloudflare/python_modules/structlog/*,mutants"
ignore-words-list = "ore,opps,wont,strat,nd,rade,ans"

[tool.bandit]
exclude_dirs = [
    "packages/provide-terminal/tests",
    "packages/provide-terminal-cloudflare/python_modules",
    "packages/provide-terminal-cloudflare/node_modules",
]

[tool.vulture]
min_confidence = 80
paths = ["packages/provide-terminal/src", "packages/provide-terminal/tests"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
addopts = "--import-mode=importlib -m 'not docker'"
testpaths = [
    "packages/provide-terminal/tests",
    "packages/provide-terminal-cloudflare/tests",
]
norecursedirs = [
    ".git",
    ".venv",
    "node_modules",
    "mutants",
    "packages/provide-terminal-cloudflare/python_modules",
]
markers = [
    "playwright: browser-based UI tests",
    "mutant: mutation-testing focused tests",
    "memray: memory profiling tests",
    "slow: slow tests (>10s)",
    "e2e: end-to-end tests against a live pywrangler dev server",
    "real_cf: tests requiring a real Cloudflare deployment",
    "docker: tests requiring a running Docker daemon",
]

[tool.xenon]
max_absolute = "C"
max_modules = "B"
max_average = "A"

[tool.mutmut]
paths_to_mutate = ["src/provide/terminal/pty/connector.py"]
tests_dir = [
    "packages/provide-terminal/tests/shell/test_shell_render.py",
    "packages/provide-terminal/tests/deckmux/test_presence.py",
    "packages/provide-terminal/tests/deckmux/test_hub_mixin.py",
    "packages/provide-terminal/tests/deckmux/test_transfer.py",
    "packages/provide-terminal/tests/deckmux/test_protocol.py",
    "packages/provide-terminal/tests/deckmux/test_names.py",
    "packages/provide-terminal/tests/deckmux/test_edge.py",
    "packages/provide-terminal-platform/tests/pty/test_validate.py",
    "packages/provide-terminal-platform/tests/pty/test_uid_map.py",
    "packages/provide-terminal-platform/tests/pty/test_capture.py",
    "packages/provide-terminal-platform/tests/pty/test_capture_connector.py",
    "packages/provide-terminal-platform/tests/pty/test_pam_listener.py",
    "packages/provide-terminal-platform/tests/pty/test_pam.py",
    "packages/provide-terminal-platform/tests/pty/test_connector.py",
    "packages/provide-terminal-platform/tests/pty/test_connector_io.py",
    "packages/provide-terminal-platform/tests/pty/test_connector_stop.py",
    "packages/provide-terminal-platform/tests/pty/test_connector_child.py",
]
also_copy = [
    "src",
    "packages/provide-terminal/src",
    "packages/provide-terminal/tests",
    "packages/provide-terminal-platform/src",
    "packages/provide-terminal-platform/tests/pty",
    "conftest.py",
]
pytest_add_cli_args = [
    "--timeout=30",
    "-p", "no:randomly",
    "-p", "no:hypothesis",
    "--ignore=packages/provide-terminal-platform/tests/pty/test_ld_preload_capture.py",
    "--ignore=packages/provide-terminal-platform/tests/pty/e2e/",
]
debug = true
