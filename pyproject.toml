    "packages/provide-uterm/tests/test_control_channel_patterns_kill.py",
    "packages/provide-uterm/tests/test_auth.py",
    "packages/provide-uterm/tests/test_auth_mutmut.py",
    # auth.py — full-perimeter-gate survivor (the authorized_keys utf-8 read);
