[project]
name = "provide-uterm-workspace"
version = "0.4.0"
requires-python = ">=3.11"
dependencies = [
    "provide-uterm[emulator,ssh]>=0.4.0",
    "provide-uterm-annotation>=0.4.0",
    "provide-uterm-server[all]>=0.4.0",
    "provide-uterm-platform[all]>=0.4.0",
    "provide-telemetry>=0.4.4",
]

[dependency-groups]
dev = [
    "asyncssh>=2.23.0",
    "bandit>=1.9.4",
    "codespell>=2.4.2",
    "detect-secrets>=1.5.0",
    "fastapi>=0.136.1",
    "httpx>=0.27",
    "hypothesis>=6.152.9",
    "memray>=1.19.3; sys_platform != 'win32'",
    "mutmut>=3.5.0",
    "Pillow>=12.2.0",
    "mypy>=2.1.0",
    "pip-audit>=2.7.0",
    "pip-licenses>=5.5.5",
    "pre-commit>=4.6.0",
    "pydantic>=2.0",
    "pyjwt>=2.12.1",
    "pyte>=0.8.2",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3",
    "pytest-cov>=7.1.0",
    "pytest-playwright>=0.7.2",
    "pytest-randomly>=3.15.0",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.8",
    "reuse>=6.2.0",
    "ruff>=0.15.13",
    "ty>=0.0.39",
    "uv>=0.11.16",
    "uvicorn>=0.47.0",
    "vulture>=2.16",
    "websockets>=16.0",
    "pyyaml>=6.0",
    "xenon>=0.9.3",
    "fastmcp>=3.3.1",
    "pytest-textual-snapshot>=1.0.0",
    "respx>=0.23.1",
]

[tool.uv.workspace]
members = ["packages/provide-uterm", "packages/provide-uterm-annotation", "packages/provide-uterm-cloudflare", "packages/provide-uterm-platform", "packages/provide-uterm-server", "packages/provide-uterm-client"]
[tool.uv.sources]
provide-uterm = { workspace = true }
provide-uterm-annotation = { workspace = true }
provide-uterm-cloudflare = { workspace = true }
provide-uterm-platform = { workspace = true }
provide-uterm-server = { workspace = true }
provide-uterm-client = { workspace = true }

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "packages/provide-uterm-cloudflare/python_modules",
]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "C4", "SIM", "TCH", "PTH",
    "DTZ", "ICN", "ISC", "PERF", "PIE", "RET", "RSE", "TID", "S", "ARG", "RUF",
]
ignore = [
    "E501",  # line-too-long
    "S101",  # use-of-assert
    "S104",  # hardcoded-bind-all-interfaces
    "S108",  # hardcoded-temp-file
    "S110",  # try-except-pass
    "S112",  # try-except-continue
    "S311",  # suspicious-non-cryptographic-random
    "S603",  # subprocess-without-shell
    "S607",  # start-process-with-partial-path
    "S604",  # call-with-shell-equals-true
    "F811",  # redefined-while-unused
    "N806",  # non-lowercase-variable-in-function
    "N814",  # camelcase-imported-as-constant
    "B017",  # assert-raises-exception
    "SIM105", # suppressible-exception
    "SIM117", # multiple-with-statements
    "ARG001", # unused-function-argument
    "ARG002", # unused-method-argument — protocol interfaces
    "PTH108", # os-unlink — stylistic
    "SIM108", # ternary-operator — stylistic
    "PERF401", # manual-list-comprehension — perf suggestion — nested with patch() is clearer in tests
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "RUF022"]
"tests_mutation/**/*.py" = ["E402", "B905", "S101", "S105", "S106", "S110", "ARG", "TCH", "RUF003", "RUF012", "RUF015", "RUF043", "RUF059"]
"packages/**/tests/**/*.py" = ["E402", "B905", "S101", "S105", "S106", "S110", "S603", "S607", "ARG", "TCH", "RUF003", "RUF012", "RUF015", "RUF043", "RUF059"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
follow_imports = "normal"
ignore_missing_imports = false
namespace_packages = true
explicit_package_bases = true
mypy_path = ["packages/provide-uterm/src", "packages/provide-uterm-annotation/src", "packages/provide-uterm-server/src", "packages/provide-uterm-platform/src", "packages/provide-uterm-client/src", "packages/provide-uterm-cloudflare/src"]

[[tool.mypy.overrides]]
module = ["provide.telemetry", "provide.telemetry.*", "provide.uterm.deckmux", "provide.uterm.deckmux.*", "structlog", "structlog.*"]
ignore_missing_imports = true


[[tool.mypy.overrides]]
# ty 0.0.19 has a cross-file resolution bug: it can't see methods added to HijackClient
# and SessionRegistry from call sites in other modules. Ignores are unused from mypy's
# perspective — suppress the warn_unused_ignores noise.
module = [
    "provide.uterm.server.routes.api",
]
warn_unused_ignores = false

[tool.ty.environment]
python-version = "3.11"
extra-paths = []

[tool.ty.rules]
# `invalid-argument-type` stays globally ignored because, with it enabled, ty
# surfaces 50 firings spread across 16 files in 3 packages (provide-uterm-server
# ~44, mostly gateway/_ssh_handler.py + gateway/_gateway.py; plus platform and
# cloudflare). They are genuine type debt — protocol mismatches and third-party
# stub gaps (PyJWT Options, CF Workers Response, asyncssh) — most already
# carrying `# type: ignore[arg-type]` for mypy. ty cannot scope a rule to a
# path/module the way mypy overrides can, and the fixes live in package source
# owned by other lanes (A3 platform, A4 server, A1 cloudflare), so they can't be
# made from the infra lane. Tracked as cross-lane follow-ups (see A6 plan).
# Re-narrow this to per-package mypy-style overrides once that debt is paid down.
invalid-argument-type = "ignore"
# `unused-type-ignore-comment` is global noise from the cross-package
# `# type: ignore` debt above: many ignores are needed by mypy but read as
# unused by ty, and vice-versa. Keep global until the two checkers converge.
unused-type-ignore-comment = "ignore"

[tool.codespell]
skip = ".git,*.pyc,__pycache__,.venv,node_modules,uv.lock,package-lock.json,*.mmd,./packages/provide-uterm/src/provide/uterm/frontend/assets/*.js,packages/provide-uterm/src/provide/uterm/frontend/assets/*.js,./packages/provide-uterm-server/src/provide/uterm/server/frontend/assets/*.js,packages/provide-uterm-server/src/provide/uterm/server/frontend/assets/*.js,./packages/provide-uterm-cloudflare/python_modules/provide/uterm/frontend/assets/*.js,packages/provide-uterm-cloudflare/python_modules/provide/uterm/frontend/assets/*.js,packages/provide-uterm-cloudflare/python_modules/structlog/*,mutants"
ignore-words-list = "ore,opps,wont,strat,nd,rade,ans,unparseable,cna,intoto,te"

[tool.bandit]
exclude_dirs = [
    "packages/provide-uterm/tests",
    "packages/provide-uterm-cloudflare/python_modules",
    "packages/provide-uterm-cloudflare/node_modules",
]

[tool.vulture]
min_confidence = 80
paths = ["packages/provide-uterm/src", "packages/provide-uterm/tests"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
addopts = "--import-mode=importlib -m 'not docker'"
filterwarnings = [
    "ignore:remove second argument of ws_handler:DeprecationWarning",
    "ignore:websockets.server.WebSocketServerProtocol is deprecated:DeprecationWarning",
    "ignore:websockets.legacy is deprecated:DeprecationWarning",
]
testpaths = [
    "packages/provide-uterm/tests",
    "packages/provide-uterm-cloudflare/tests",
]
norecursedirs = [
    ".git",
    ".venv",
    "node_modules",
    "mutants",
    ".hypothesis",
    "packages/provide-uterm-cloudflare/python_modules",
]
markers = [
    "unit: fast unit tests",
    "integration: tests requiring multiple components",
    "playwright: browser-based UI tests",
    "mutant: mutation-testing focused tests",
    "memray: memory profiling tests",
    "slow: slow tests (>10s)",
    "slowtest: legacy alias for slow tests",
    "e2e: end-to-end tests against a live server",
    "real_cf: tests requiring a real Cloudflare deployment",
    "docker: tests requiring a running Docker daemon",
    "requires_root: tests that must run as root/sudo",
    "requires_pam: tests requiring PAM library availability",
    "requires_pam_auth: tests performing actual PAM authentication",
    "limit_memory: tests with memory usage constraints",
    "dependency: tests with ordering dependencies",
    "respx: tests using respx for HTTP mocking",
    "timeout: tests with custom timeout constraints",
]

[tool.xenon]
max_absolute = "D"
max_modules = "D"
max_average = "A"

[tool.mutmut]
paths_to_mutate = [
    "src/provide/uterm/pty/connector.py",
    "src/provide/uterm/control_channel.py",
    "src/provide/uterm/control_channel_builders.py",
    "src/provide/uterm/control_channel_patterns.py",
    "src/provide/uterm/auth.py",
    "src/provide/uterm/detection/detector.py",
    "src/provide/uterm/detection/engine.py",
    "src/provide/uterm/io.py",
    "src/provide/uterm/recording.py",
    # Bridge protocol negotiation — boundary-heavy, security-relevant.
    # Covered by tests/test_protocol_negotiation.py.
    "src/provide/uterm/bridge/contracts.py",
    # Server-package paths. These MUST be addressed through the workspace-root
    # ``src/`` symlink tree (``src/provide/uterm/server/...``), NOT the real
    # ``packages/provide-uterm-server/src/...`` path. mutmut derives a mutant's
    # name from ``str(path).replace(os.sep, ".")`` after stripping a leading
    # ``src.`` prefix (see ``get_mutant_name`` in mutmut/__main__.py). The
    # trampoline that records test→mutant coverage keys on the imported
    # module's ``__module__`` (``provide.uterm.server.bridge.hub.limiter``).
    # A ``packages/...`` path yields the name
    # ``packages.provide-uterm-server.src.provide.uterm.server...`` which never
    # matches ``__module__`` — so EVERY server mutant reported ``no_tests``.
    # The ``src/provide/uterm/server`` symlink (-> the server package's source)
    # makes the derived name equal ``provide.uterm.server...`` and binding
    # works. The matching test files are in ``tests_dir`` below.
    #
    # HijackLease.expire boundary + lease arithmetic.
    "src/provide/uterm/server/bridge/models.py",
    # Tunnel token hashing — constant-time compare, security-critical.
    "src/provide/uterm/tunnel/token_hash.py",
    # HTTP intercept header denylist + gating policy.
    "src/provide/uterm/tunnel/intercept.py",
    # Server routes/webhooks/registry — security-relevant request handling.
    # Gate runs with --changed-only in CI so this only fires when those files
    # change; safe to keep enumerated even before dedicated mutmut suites exist.
    "src/provide/uterm/server/routes/",
    "src/provide/uterm/server/webhooks.py",
    "src/provide/uterm/server/registry.py",
    "src/provide/uterm/server/config_schema.py",
    "src/provide/uterm/server/app/factory.py",
    "src/provide/uterm/manager/process.py",
    "src/provide/uterm/manager/config.py",
    # Refactor #16 service classes — state-machine + dispatch logic split
    # out of the former TermHub mixin pile. High mutation value; tests for
    # each service live under tests/bridge/hub/test_<name>.py.
    "src/provide/uterm/server/bridge/hub/registry.py",
    "src/provide/uterm/server/bridge/hub/limiter.py",
    "src/provide/uterm/server/bridge/hub/lease.py",
    "src/provide/uterm/server/bridge/hub/router.py",
    "src/provide/uterm/server/bridge/hub/connection.py",
    "src/provide/uterm/server/bridge/hub/presence.py",
    "src/provide/uterm/server/bridge/hub/store.py",
    "src/provide/uterm/server/bridge/hub/polling_service.py",
    # Pydantic frame schemas — single source of truth for wire format.
    "src/provide/uterm/bridge/schemas.py",
    # HijackCoordinator (moved to core in #15) — lease state machine.
    "src/provide/uterm/bridge/coordinator.py",
    # DeckMux presence service — split out of DeckMuxMixin in #6 follow-up.
    "src/provide/uterm/deckmux/_service.py",
]
tests_dir = [
    "packages/provide-uterm/tests/shell/test_shell_render.py",
    "packages/provide-uterm/tests/deckmux/test_presence.py",
    "packages/provide-uterm/tests/deckmux/test_hub_mixin.py",
    "packages/provide-uterm/tests/deckmux/test_transfer.py",
    "packages/provide-uterm/tests/deckmux/test_protocol.py",
    "packages/provide-uterm/tests/deckmux/test_names.py",
    "packages/provide-uterm/tests/deckmux/test_edge.py",
    "packages/provide-uterm/tests/deckmux/test_service_mutants.py",
    "packages/provide-uterm-platform/tests/pty/test_validate.py",
    "packages/provide-uterm-platform/tests/pty/test_uid_map.py",
    "packages/provide-uterm-platform/tests/pty/test_capture.py",
    "packages/provide-uterm-platform/tests/pty/test_capture_connector.py",
    "packages/provide-uterm-platform/tests/pty/test_pam_listener.py",
    "packages/provide-uterm-platform/tests/pty/test_pam.py",
    "packages/provide-uterm-platform/tests/pty/test_connector.py",
    "packages/provide-uterm-platform/tests/pty/test_connector_io.py",
    "packages/provide-uterm-platform/tests/pty/test_connector_stop.py",
    "packages/provide-uterm-platform/tests/pty/test_connector_child.py",
    "packages/provide-uterm/tests/terminal/test_control_channel_codec.py",
    "packages/provide-uterm/tests/terminal/test_control_channel_coverage.py",
    "packages/provide-uterm/tests/terminal/test_control_channel_mutmut.py",
    "packages/provide-uterm/tests/test_control_channel_builders.py",
    "packages/provide-uterm/tests/test_control_channel_ordering.py",
    "packages/provide-uterm/tests/test_control_channel_patterns.py",
    "packages/provide-uterm/tests/test_auth.py",
    "packages/provide-uterm/tests/test_auth_mutmut.py",
    "packages/provide-uterm/tests/test_auth_parsers.py",
    "packages/provide-uterm/tests/test_auth_authorized_keys.py",
    "packages/provide-uterm/tests/test_auth_resolver.py",
    "packages/provide-uterm/tests/detection/test_detector.py",
    "packages/provide-uterm/tests/detection/test_detector_compile_mutmut.py",
    "packages/provide-uterm/tests/detection/test_detector_detect_mutmut.py",
    "packages/provide-uterm/tests/detection/test_detector_diagnostics_mutmut.py",
    "packages/provide-uterm/tests/detection/test_detector_survivors.py",
    "packages/provide-uterm/tests/detection/test_detector_survivors_2.py",
    "packages/provide-uterm/tests/detection/test_engine.py",
    "packages/provide-uterm/tests/detection/test_engine_mutmut.py",
    "packages/provide-uterm/tests/detection/test_extractor.py",
    "packages/provide-uterm/tests/detection/test_extractor_validate.py",
    "packages/provide-uterm/tests/detection/test_integration.py",
    "packages/provide-uterm/tests/detection/test_loader.py",
    "packages/provide-uterm/tests/detection/test_models.py",
    "packages/provide-uterm/tests/detection/test_rules.py",
    "packages/provide-uterm/tests/detection/test_saver.py",
    "packages/provide-uterm/tests/detection/test_buffer.py",
    "packages/provide-uterm/tests/test_io.py",
    "packages/provide-uterm/tests/test_io_mutations.py",
    "packages/provide-uterm/tests/test_io_mutations_2.py",
    "packages/provide-uterm/tests/test_io_mutations_3.py",
    "packages/provide-uterm/tests/test_io_mutmut.py",
    "packages/provide-uterm/tests/test_high_roi_mutmut.py",
    "packages/provide-uterm/tests/terminal/test_io.py",
    # Covers bridge/contracts.py negotiate_protocol_version + worker_hello emitter.
    "packages/provide-uterm/tests/test_protocol_negotiation.py",
    # Covers recording.py RecordingStore implementations (In-memory / Null /
    # LocalFile). Without these the gate finds recording.py mutants but binds
    # zero tests and reports them all as ``no_tests``.
    "packages/provide-uterm/tests/terminal/test_recording_stores.py",
    "packages/provide-uterm/tests/terminal/test_recording_local.py",
    # Server-package coverage — matches the server-package paths_to_mutate
    # entries above. Without these the gate finds the mutants but binds
    # to zero tests and reports them all as ``no_tests``.
    "packages/provide-uterm-server/tests/bridge/test_hijack_lease.py",
    "packages/provide-uterm-server/tests/tunnel/test_token_hash.py",
    "packages/provide-uterm-server/tests/tunnel/test_token_hash_hypothesis.py",
    "packages/provide-uterm-server/tests/tunnel/test_intercept_gate.py",
    "packages/provide-uterm-server/tests/server/test_config.py",
    "packages/provide-uterm-server/tests/server/test_app_coverage.py",
    "packages/provide-uterm-platform/tests/manager/manager/test_process.py",
    # RateLimiter (hub/limiter.py) LRU eviction — without this the
    # --changed-only gate finds limiter.py mutants but binds zero tests and
    # reports them all as ``no_tests`` (2026-05-28 remediation, lane A4).
    "packages/provide-uterm-server/tests/bridge/hub/test_limiter.py",
]
also_copy = [
    "src",
    "packages/provide-uterm/src",
    "packages/provide-uterm/tests",
    "packages/provide-uterm-platform/src",
    "packages/provide-uterm-platform/tests/pty",
    # Server-package source + tests for the bridge/tunnel mutants added
    # to paths_to_mutate. ``mutants/`` needs both copied alongside so the
    # mutated source resolves and the test discovery finds the suites.
    "packages/provide-uterm-server/src",
    "packages/provide-uterm-server/tests/bridge",
    "packages/provide-uterm-server/tests/tunnel",
    "packages/provide-uterm-server/tests/server",
    # The server test package's shared conftest (and its split parts) must be
    # copied so the autouse auth fixtures load. Without them the TestClient
    # sends no X-Principal/X-Role header in ``header`` auth mode, so
    # ``test_config.py::test_loaded_max_sessions_is_enforced_by_app`` returns
    # 401 instead of 409 and fails. mutmut's stats phase runs with ``-x``, so
    # that one failure aborts coverage binding *before* it reaches the
    # alphabetically-later suites (``tests/bridge/hub/test_limiter.py`` etc.),
    # leaving every later server mutant reporting ``no_tests``. These file
    # entries must come *after* the directory entries above so the parent
    # ``mutants/.../tests/`` dir already exists when mutmut copies them.
    # NOTE: deliberately *not* copying ``tests/__init__.py`` — leaving the
    # server ``tests`` dir as a non-package lets importlib import-mode key its
    # conftest by file path instead of the ``tests.conftest`` dotted name,
    # which would otherwise collide with the core package's identically-named
    # ``tests.conftest``.
    "packages/provide-uterm-server/tests/conftest.py",
    "packages/provide-uterm-server/tests/conftest_part1.py",
    "packages/provide-uterm-server/tests/conftest_part2.py",
    "packages/provide-uterm-platform/tests/manager",
    "docker",
    "conftest.py",
]
pytest_add_cli_args = [
    "--timeout=30",
    # The mutants/ tree copies two ``tests`` packages (core +
    # provide-uterm-server), both exposing a ``tests.conftest`` dotted name.
    # pytest's default prepend import-mode registers the first under that name
    # and then rejects the second ("Plugin already registered under a
    # different name"). importlib import-mode keys modules by file path
    # instead, so both conftests load side by side. Required for the server
    # test package's autoauth fixtures to be present.
    "--import-mode=importlib",
    "-p", "no:randomly",
    "-p", "no:hypothesis",
    "--ignore=packages/provide-uterm-platform/tests/pty/test_ld_preload_capture.py",
    "--ignore=packages/provide-uterm-platform/tests/pty/e2e/",
]
debug = true
