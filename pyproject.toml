    "packages/provide-uterm/tests/test_auth_kill.py",
    "packages/provide-uterm/tests/test_auth_parsers.py",
    "packages/provide-uterm/tests/test_auth_authorized_keys.py",
    "packages/provide-uterm/tests/test_auth_resolver.py",
    "packages/provide-uterm/tests/detection/test_detector.py",
    "packages/provide-uterm/tests/detection/test_detector_part1.py",
    "packages/provide-uterm/tests/detection/test_detector_compile_mutmut.py",
    "packages/provide-uterm/tests/detection/test_detector_detect_mutmut.py",
    "packages/provide-uterm/tests/detection/test_detector_diagnostics_mutmut.py",
    "packages/provide-uterm/tests/detection/test_detector_survivors.py",
    "packages/provide-uterm/tests/detection/test_detector_survivors_diagnostics.py",
    "packages/provide-uterm/tests/detection/test_detector_survivors_logging.py",
    "packages/provide-uterm/tests/detection/test_detector_survivors_2.py",
    "packages/provide-uterm/tests/detection/test_engine.py",
    "packages/provide-uterm/tests/detection/test_engine_mutmut.py",
    # engine.py — full-perimeter-gate survivors: the two process_screen
    # logger.warning blocks + prompt_id/save_screen + debug_state get_recent.
    "packages/provide-uterm/tests/detection/test_engine_kill.py",
    "packages/provide-uterm/tests/detection/test_extractor.py",
    "packages/provide-uterm/tests/detection/test_extractor_validate.py",
    "packages/provide-uterm/tests/detection/test_integration.py",
    "packages/provide-uterm/tests/detection/test_loader.py",
    "packages/provide-uterm/tests/detection/test_models.py",
    "packages/provide-uterm/tests/detection/test_rules.py",
    "packages/provide-uterm/tests/detection/test_saver.py",
    "packages/provide-uterm/tests/detection/test_buffer.py",
    "packages/provide-uterm/tests/detection/test_flow.py",
    "packages/provide-uterm/tests/detection/test_flow_cache_mutmut.py",
    "packages/provide-uterm/tests/test_io.py",
    "packages/provide-uterm/tests/test_io_mutations.py",
    "packages/provide-uterm/tests/test_io_mutations_2.py",
    "packages/provide-uterm/tests/test_io_mutations_3.py",
    "packages/provide-uterm/tests/test_io_mutmut.py",
    "packages/provide-uterm/tests/test_high_roi_mutmut.py",
    "packages/provide-uterm/tests/terminal/test_io.py",
    "packages/provide-uterm/tests/terminal/test_ws_bytes.py",
    "packages/provide-uterm/tests/terminal/test_filters.py",

    # Covers bridge/contracts.py negotiate_protocol_version + worker_hello emitter.
    "packages/provide-uterm/tests/test_protocol_negotiation.py",
    # Covers recording.py RecordingStore implementations (In-memory / Null /
    # LocalFile). Without these the gate finds recording.py mutants but binds
    # zero tests and reports them all as ``no_tests``.
    "packages/provide-uterm/tests/terminal/test_recording_stores.py",
    "packages/provide-uterm/tests/terminal/test_recording_local.py",
    # recording.py kill-suite: the store suites exercise behaviour but can't pin
    # the security-bearing syscall args (dir/file modes, O_NOFOLLOW, S_ISREG,
    # utf-8 encoding) that chmod/fchmod otherwise mask; this wraps them to assert.
    "packages/provide-uterm/tests/terminal/test_recording_kill.py",
    # Covers redaction.py (make_redactor / redact_text / redact_structure).
    "packages/provide-uterm/tests/test_redaction.py",
    "packages/provide-uterm/tests/test_redaction_structure.py",
    # Server-package coverage — matches the server-package source_paths
    # entries above. Without these the gate finds the mutants but binds
    # to zero tests and reports them all as ``no_tests``.
    "packages/provide-uterm-server/tests/bridge/test_hijack_lease.py",
    "packages/provide-uterm-server/tests/tunnel/test_token_hash.py",
    "packages/provide-uterm-server/tests/tunnel/test_token_hash_hypothesis.py",
    "packages/provide-uterm-server/tests/tunnel/test_intercept_gate.py",
    # intercept.py kill-suite: test_intercept_gate.py exercises the decision flow
    # but never asserts the two logger.warning contents nor the cancel_all
    # not-done guard / await_decision timeout wiring; this binds those mutants.
    "packages/provide-uterm-server/tests/tunnel/test_intercept_kill.py",
    # SessionRegistry (server/registry.py) dedicated mutmut suite — PRESERVED but
    # commented out in lockstep with registry.py's deferral from source_paths
    # above (2026-06-01). Wiring these takes registry.py from ~14% (no bound
    # tests) to ~53% (219/415 killed); test_registry.py + test_runtime.py are the
    # dedicated suite, and the SSE/coverage suites cover watch_session_events /
    # stream_session_events / recording_meta / restart / analyze (otherwise
    # no_tests). Kept inactive so they don't add collection/fragility cost to the
    # other perimeter targets. Re-enable together with registry.py once the async
    # mutation-determinism work (SSE-heartbeat / __init__ / background-task
    # timeout+segfault mutants) lands.
    # registry.py self-contained mocked kill-suite (mutants-tree-safe: mocks
    # HostedSessionRuntime / registered_types / egress / asyncio.sleep / EventBus
    # so no external registry state or real async streaming reaches a forked worker).
    "packages/provide-uterm-server/tests/server/test_registry_mutation_killing.py",
    # routes/ self-contained mocked kill-suite (mutmut skips the @router.* handlers;
    # this binds the undecorated helpers + create_*_router bodies via router-endpoint
    # extraction with mocked Request — no TestClient/full-app lifespan).
    "packages/provide-uterm-server/tests/server/test_routes_mutation_killing.py",
    # RouteDefs-era *_capability_handlers factories. 9bc4dd0c moved the handlers
    # out of @router.* decorators, which made them mutable for the first time
    # (mutmut skips decorated functions); the suite above covers the decorated-era
    # surface and is at the 777-line cap, so the handler kills live here.
    "packages/provide-uterm-server/tests/server/test_routes_capability_mutation_killing.py",
    # routes/tunnels.py, split three ways for the 777-line cap. Its handlers mint
    # and revoke the bearer tokens for a shared terminal, so most of what these
    # pin is security-relevant: credential scrubbing before persistence/audit,
    # digest-only token storage, the TTL clamp, and the ownership rules.
    "packages/provide-uterm-server/tests/server/test_routes_tunnels_connect_mutation_killing.py",
    "packages/provide-uterm-server/tests/server/test_routes_tunnels_create_mutation_killing.py",
    "packages/provide-uterm-server/tests/server/test_routes_tunnels_tokens_mutation_killing.py",
    # routes/pam_events.py. The PAM relay derives its session id from the tty,
    # so _tty_slug is identity-critical (a collision adopts another login's
    # observer session), and the role check resolves admin through the service
    # while matching any other role against the principal's own claims.
    "packages/provide-uterm-server/tests/server/test_routes_pam_events_mutation_killing.py",
    # routes/sessions.py handler BODIES. The table-driven suite above kills the
    # shared skeleton (authorize -> 403 -> 404 -> forward the id) but has no
    # purchase on the bodies, which is where the query filters, the owner
    # enforcement, the tunnel-token revocation on delete and the
    # recording-download containment check live. Split three ways for the
    # 777-line cap.
    "packages/provide-uterm-server/tests/server/test_routes_sessions_list_mutation_killing.py",
    "packages/provide-uterm-server/tests/server/test_routes_sessions_crud_mutation_killing.py",
    "packages/provide-uterm-server/tests/server/test_routes_sessions_reads_mutation_killing.py",
    # Argument forwarding and absent-key defaults: the families that survive a
    # behavioural test because the OUTCOME is unchanged (a nulled session id
    # still resolves through an AsyncMock).
    "packages/provide-uterm-server/tests/server/test_routes_sessions_argforward_mutation_killing.py",
    # The last three routes/ files. route_defs.py is the shared binder every
    # RouteDef family passes through, so its 422 path-grammar check and 403
