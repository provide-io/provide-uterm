[project]
name = "provide-terminal-workspace"
version = "0.4.0"
requires-python = ">=3.11"
dependencies = [
    "provide-terminal[emulator,ssh]",
    "provide-terminal-server[all]",
    "provide-terminal-platform[all]",
    "provide-telemetry>=0.3",
]

[tool.setuptools.package-data]
"provide.terminal" = [
    "py.typed",
    "frontend/*",
    "frontend/app/*.js",
    "frontend/app/views/*.js",
    "frontend/app/widgets/*.js",
    "frontend/.vite/*",
    "frontend/assets/*",
]

[dependency-groups]
dev = [
    "asyncssh>=2.22.0",
    "bandit>=1.9",
    "codespell>=2.4.1",
    "detect-secrets>=1.5.0",
    "fastapi>=0.110",
    "httpx>=0.27",
    "hypothesis>=6.151.9",
    "memray>=1.0; sys_platform != 'win32'",
    "mutmut>=3.3.1",
    "mypy>=1.19",
    "pip-audit>=2.7.0",
    "pip-licenses>=5.5.0",
    "pre-commit>=4.0",
    "pydantic>=2.0",
    "pyjwt>=2.9",
    "pyte>=0.8.2",
    "pytest>=9.0",
    "pytest-asyncio>=1.3",
    "pytest-cov>=7.0",
    "pytest-playwright>=0.7.2",
    "pytest-randomly>=3.15.0",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.8",
    "reuse>=6.2.0",
    "ruff>=0.15",
    "ty>=0.0.17",
    "uv>=0.10.7",
    "uvicorn>=0.24",
    "vulture>=2.14",
    "websockets>=16.0",
    "pyyaml>=6.0",
    "xenon>=0.9.3",
    "fastmcp>=2.0",
    "pytest-textual-snapshot>=1.0.0",
]

[tool.uv.workspace]
members = ["packages/provide-terminal", "packages/provide-terminal-cloudflare", "packages/provide-terminal-pty", "packages/provide-terminal-manager", "packages/provide-terminal-transports", "packages/provide-terminal-tunnel", "packages/provide-terminal-gateway", "packages/provide-terminal-ai", "packages/provide-terminal-client"]

[tool.uv.sources]
provide-terminal = { workspace = true }
provide-terminal-cloudflare = { workspace = true }
provide-terminal-pty = { workspace = true }
provide-terminal-manager = { workspace = true }
provide-terminal-transports = { workspace = true }
provide-terminal-tunnel = { workspace = true }
provide-terminal-gateway = { workspace = true }
provide-terminal-ai = { workspace = true }
provide-terminal-client = { workspace = true }

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "packages/provide-terminal-cloudflare/python_modules",
]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "N",
    "UP",
    "B",
    "C4",
    "SIM",
    "TCH",
    "PTH",
    "DTZ",
    "ICN",
    "ISC",
    "PERF",
    "PIE",
    "RET",
    "RSE",
    "TID",
    "S",
    "ARG",
    "RUF",
]
ignore = ["E501", "S104", "S112", "S311"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "RUF022"]
"tests/**/*.py" = ["E402", "B905", "S101", "S105", "S106", "S110", "S603", "S607", "ARG", "TCH", "RUF003", "RUF012", "RUF015", "RUF043", "RUF059"]
"tests_mutation/**/*.py" = ["E402", "B905", "S101", "S105", "S106", "S110", "ARG", "TCH", "RUF003", "RUF012", "RUF015", "RUF043", "RUF059"]
"packages/**/tests/**/*.py" = ["E402", "B905", "S101", "S105", "S106", "S110", "ARG", "TCH", "RUF003", "RUF012", "RUF015", "RUF043", "RUF059"]

[tool.coverage.run]
source = ["provide.terminal"]
omit = ["tests/*"]
branch = true

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = false

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
follow_imports = "normal"
ignore_missing_imports = false
namespace_packages = true
explicit_package_bases = true
mypy_path = ["packages/provide-terminal/src", "packages/provide-terminal-server/src", "packages/provide-terminal-platform/src", "packages/provide-terminal-client/src"]

[[tool.mypy.overrides]]
module = ["provide.telemetry", "provide.telemetry.*", "structlog", "structlog.*"]
ignore_missing_imports = true


[[tool.mypy.overrides]]
# ty 0.0.19 has a cross-file resolution bug: it can't see methods added to HijackClient
# and SessionRegistry from call sites in other modules. Ignores are unused from mypy's
# perspective — suppress the warn_unused_ignores noise.
module = [
    "provide.terminal.mcp.server",
    "provide.terminal.server.routes.api",
]
warn_unused_ignores = false

[tool.ty.environment]
python-version = "3.11"
extra-paths = []

[tool.ty.rules]
# FastAPI/Starlette add_middleware(CORSMiddleware, ...) is the documented
# pattern; ty incorrectly rejects it due to incomplete starlette stubs.
invalid-argument-type = "ignore"
# asyncio.create_task(Awaitable[T]) requires a type: ignore[arg-type] for mypy;
# ty does not see the same error and reports the suppression as unused.
unused-type-ignore-comment = "ignore"

[tool.codespell]
skip = ".git,*.pyc,__pycache__,.venv,node_modules,uv.lock,*.mmd,packages/provide-terminal/src/provide/terminal/frontend/assets/*.js,packages/provide-terminal-cloudflare/python_modules/provide/terminal/frontend/assets/*.js,packages/provide-terminal-cloudflare/python_modules/structlog/*,mutants"
ignore-words-list = "ore,opps,wont,strat,nd,rade,ans"

[tool.bandit]
exclude_dirs = [
    "tests",
    "packages/provide-terminal-cloudflare/python_modules",
    "packages/provide-terminal-cloudflare/node_modules",
]

[tool.vulture]
min_confidence = 80
paths = ["packages/provide-terminal/src", "packages/provide-terminal/tests"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
addopts = "--import-mode=importlib -m 'not docker'"
testpaths = [
    "packages/provide-terminal/tests",
    "packages/provide-terminal-cloudflare/tests",
]
norecursedirs = [
    ".git",
    ".venv",
    "node_modules",
    "mutants",
    "packages/provide-terminal-cloudflare/python_modules",
]
markers = [
    "playwright: browser-based UI tests",
    "mutant: mutation-testing focused tests",
    "memray: memory profiling tests",
    "slow: slow tests (>10s)",
    "e2e: end-to-end tests against a live pywrangler dev server",
    "real_cf: tests requiring a real Cloudflare deployment",
]

[tool.xenon]
max_absolute = "C"
max_modules = "B"
max_average = "A"

[tool.mutmut]
paths_to_mutate = ["src/provide/shell/terminal/_connector.py", "src/provide/terminal/server/connectors/__init__.py", "src/provide/terminal/server/connectors/registry.py", "src/provide/terminal/hijack/hub/event_bus.py"]
tests_dir = [
    "packages/provide-terminal/tests/shell/test_shell_render.py",
    "packages/provide-terminal/tests/deckmux/test_presence.py",
    "packages/provide-terminal/tests/deckmux/test_hub_mixin.py",
    "packages/provide-terminal/tests/deckmux/test_transfer.py",
    "packages/provide-terminal/tests/deckmux/test_protocol.py",
    "packages/provide-terminal/tests/deckmux/test_names.py",
    "packages/provide-terminal/tests/deckmux/test_edge.py",
    "packages/provide-terminal-pty/tests/test_validate.py",
    "packages/provide-terminal-pty/tests/test_uid_map.py",
    "packages/provide-terminal-pty/tests/test_capture.py",
    "packages/provide-terminal-pty/tests/test_capture_connector.py",
    "packages/provide-terminal-pty/tests/test_pam_listener.py",
    "packages/provide-terminal-pty/tests/test_pam.py",
    "packages/provide-terminal-pty/tests/test_connector.py",
]
also_copy = [
    "src",
    "packages/provide-terminal/src",
    "packages/provide-terminal/tests",
    "packages/provide-terminal-pty/src",
    "packages/provide-terminal-pty/tests",
    "conftest.py",
]

[tool.uv.workspace]
members = [
    ".",
    "packages/provide-terminal-cloudflare",
]

[tool.uv.sources]
provide-telemetry = { path = "/Users/tim/code/gh/provide-io/provide-telemetry", editable = true }
provide-terminal = { workspace = true }
provide-terminal-cloudflare = { workspace = true }
