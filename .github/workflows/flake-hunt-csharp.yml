name: "🎲 C# Flake Hunt"

# Diagnostic only, dispatch only. Repeats the thing that failed on a Windows
# runner and reports a failure rate for the unfixed and the fixed code side by
# side. A ~4%-per-run flake is invisible to a single CI run in either direction.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "cover (coverlet + serialized batch 2) or test (one test alone)"
        required: false
        default: "cover"
      iterations:
        description: "Runs per shard, per arm"
        required: false
        default: "45"
      filter:
        description: "xUnit --filter expression (mode=test only)"
        required: false
        default: "FullyQualifiedName~Sequential_Members_Share_One_Total_Response_Budget"
      base_sha:
        description: "Commit the baseline arm restores its test files from"
        required: true

permissions:
  contents: read

# Script policy: the loop lives in ci/csharp_flake_hunt.sh, never inline here.
jobs:
  hunt:
    runs-on: windows-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        arm: [baseline, fixed]
        # Shards multiply the sample without lengthening the wall clock. The
        # index is not used by the script -- the runs are independent samples
        # of the same thing, and their counts add up.
        shard: [1, 2, 3]
    defaults:
      run:
        # Git Bash, so the script runs unchanged from what a developer runs.
        shell: bash
    steps:
      # Full history: the baseline arm checks its test files out of base_sha.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      # The C# port targets .NET 10.
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        with:
          dotnet-version: "10.0.x"
      # Windows images do not ship GNU make, which mode=cover drives.
      - name: Install make
        shell: powershell
        run: choco install make --yes --no-progress
      # Repeat the run `iterations` times and print the failure counts.
      - name: Measure failure rate
        env:
          ARM: ${{ matrix.arm }}
          MODE: ${{ inputs.mode }}
          BASE_SHA: ${{ inputs.base_sha }}
          ITERATIONS: ${{ inputs.iterations }}
          FILTER: ${{ inputs.filter }}
        run: bash ci/csharp_flake_hunt.sh
