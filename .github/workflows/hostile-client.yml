name: "🛡️ Hostile Client Resilience"

on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * 1"
  push:
    branches:
      - main
      - "rc/**"
    paths:
      - "scripts/hostile_profile.py"
      - "ci/hostile_probe.sh"
      - "packages/provide-uterm-server/**"
      - ".github/workflows/hostile-client.yml"
  pull_request:
    branches:
      - main
      - "rc/**"
    paths:
      - "scripts/hostile_profile.py"
      - "ci/hostile_probe.sh"
      - "packages/provide-uterm-server/**"
      - ".github/workflows/hostile-client.yml"

permissions:
  contents: read

concurrency:
  # Cancel superseded PR runs; never cancel anything else.
  #
  # The group is per-branch for a pull_request, so a new push to a PR
  # supersedes the run still going for the previous commit -- only the latest
  # commit on a PR carries any signal.
  #
  # For every other event the group is keyed on the RUN ID, which is unique, so
  # the block is deliberately inert there. That is not laziness: with a shared
  # group, GitHub cancels the previously PENDING run whenever a third arrives,
  # even with cancel-in-progress false. Three commits landing on main in quick
  # succession would leave the middle one with no run at all, and the next
  # failure would need a local bisect to attribute. Queue length is worth less
  # than knowing which commit broke it.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  hostile-probes:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        server_impl: [python, go, csharp]
    env:
      SERVER_IMPL: ${{ matrix.server_impl }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d  # v10.0.0

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: ".nvmrc"

      # Version comes from go.mod, as it does in all five setup-go steps in
      # ci.yml. This step was the one holdout with a literal "1.22" while
      # go.mod asked for 1.26.6, and the skew was invisible for as long as it
      # was harmless: setup-go v5 left GOTOOLCHAIN unset, so Go quietly
      # downloaded the toolchain go.mod wanted and the pin never bound. v6
      # sets GOTOOLCHAIN=local to make the pinned version authoritative, which
      # turned the stale literal into "go.mod requires go >= 1.26.6 (running
      # go 1.22.12)" and killed the server at startup. Reading the version from
      # go.mod removes the second place to remember.
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "packages/provide-uterm-go/go.mod"

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "8.0.x"

      - name: Install dependencies
        run: |
          npm ci
          npm run build:frontend
          uv sync --frozen --group dev

      # Launch the server in the background on the suite's configured bind
      - name: Start server
        run: ci/hostile_probe.sh start

      # Poll /api/health until the server is up (or fail with the log)
      - name: Wait for health
        run: ci/hostile_probe.sh wait-health

      # Connection-burst flood probe
      - name: Burst probe
        run: ci/hostile_probe.sh burst

      # Worker socket: the privileged side of the bridge, previously unprobed.
      # An unauthenticated registration there is a worse bypass than the browser
      # one — a worker feeds terminal output to every viewer and drives session
      # state — and every port refuses it by a different mechanism, so only an
      # executed probe says whether they all still do.
      - name: Worker-socket auth probe
        run: ci/hostile_probe.sh worker

      # Oversized-frame payload probe
      - name: Oversized-frame probe
        run: ci/hostile_probe.sh oversized

      # Slow-header (slowloris) probe
      - name: Slowloris probe
        run: ci/hostile_probe.sh slowloris

      # Availability under attack: legit authenticated sessions must stay served
      # while the unauthenticated flood is refused (DoS-starvation resistance)
      - name: Availability probe
        run: ci/hostile_probe.sh availability

      - name: Upload server log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: hostile-client-server-log
          path: /tmp/uterm-hostile.log

      # Kill the background server (logic lives in the ci/ script, not inline YAML)
      - name: Stop server
        if: always()
        run: ci/hostile_probe.sh stop
