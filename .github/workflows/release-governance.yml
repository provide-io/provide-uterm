name: "🛡️ Release Governance"

on:
  push:
    branches:
      - main
      - "rc/**"
  pull_request:
    branches:
      - main
      - "rc/**"

concurrency:
  # Cancel superseded PR runs; never cancel anything else.
  #
  # The group is per-branch for a pull_request, so a new push to a PR
  # supersedes the run still going for the previous commit -- only the latest
  # commit on a PR carries any signal.
  #
  # For every other event the group is keyed on the RUN ID, which is unique, so
  # the block is deliberately inert there. That is not laziness: with a shared
  # group, GitHub cancels the previously PENDING run whenever a third arrives,
  # even with cancel-in-progress false. Three commits landing on main in quick
  # succession would leave the middle one with no run at all, and the next
  # failure would need a local bisect to attribute. Queue length is worth less
  # than knowing which commit broke it.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  governance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      id-token: write   # required for Sigstore keyless signing
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"

      - name: Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1

      - name: Setup Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      - name: Sync dependencies
        run: uv sync --frozen --group dev

      - name: Run release governance checks
        run: ./scripts/release_governance_check.sh artifacts/release-governance

      - name: Upload governance artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: release-governance
          path: artifacts/release-governance
