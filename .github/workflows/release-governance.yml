name: "🛡️ Release Governance"

on:
  push:
    branches:
      - main
      - "rc/**"
  pull_request:
    branches:
      - main
      - "rc/**"

jobs:
  governance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      id-token: write   # required for Sigstore keyless signing
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.11"

      - name: Setup uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0

      - name: Setup Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      - name: Sync dependencies
        run: uv sync --frozen --group dev

      - name: Install governance tools
        run: uv pip install pip-audit cyclonedx-bom

      - name: Run release governance checks
        run: ./scripts/release_governance_check.sh artifacts/release-governance

      - name: Upload governance artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: release-governance
          path: artifacts/release-governance
