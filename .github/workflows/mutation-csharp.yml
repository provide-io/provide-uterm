name: Mutation Testing C#

on:
  push:
    paths:
      - 'packages/provide-uterm-csharp/**'
      - '.github/workflows/mutation-csharp.yml'
  pull_request:
    paths:
      - 'packages/provide-uterm-csharp/**'
      - '.github/workflows/mutation-csharp.yml'

jobs:
  mutation-testing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore tools
        working-directory: packages/provide-uterm-csharp
        run: dotnet tool restore

      - name: Run Stryker
        working-directory: packages/provide-uterm-csharp
        run: dotnet stryker
