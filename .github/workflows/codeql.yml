# CodeQL static analysis for the Python source tree + the bundled TypeScript
# frontend. Catches SAST patterns that bandit / ruff / mypy / ty miss —
# tainted-input flows, hard-to-spot SQL injection, prototype-pollution-style
# JS issues, dangerous deserialization paths.
#
# Closes docs/security-considerations.md §2 (deep-SAST scanner) and shows
# findings in the repo's Security tab as a permanent record.

name: "🔬 CodeQL"

on:
  push:
    branches:
      - main
      - "rc/**"
  pull_request:
    branches:
      - main
      - "rc/**"
  schedule:
    # Weekly run so newly-released CodeQL rule packs catch issues against
    # an unchanged tree. Wednesday 16:00 UTC = mid-week, mid-day for most
    # contributors.
    - cron: "0 16 * * 3"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Cancel superseded PR runs; never cancel anything else.
  #
  # The group is per-branch for a pull_request, so a new push to a PR
  # supersedes the run still going for the previous commit -- only the latest
  # commit on a PR carries any signal.
  #
  # For every other event the group is keyed on the RUN ID, which is unique, so
  # the block is deliberately inert there. That is not laziness: with a shared
  # group, GitHub cancels the previously PENDING run whenever a third arrives,
  # even with cancel-in-progress false. Three commits landing on main in quick
  # succession would leave the middle one with no run at all, and the next
  # failure would need a local bisect to attribute. Queue length is worth less
  # than knowing which commit broke it.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # Required for writing findings to the Security tab.
      security-events: write
      # Required for private repos so CodeQL can read the file content.
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python
            build-mode: none
          - language: javascript-typescript
            build-mode: none

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938  # v4.37.9
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # Use the security-and-quality query suite for broader coverage
          # than the default "code-scanning" pack. Includes maintainability
          # checks alongside security ones.
          queries: security-and-quality

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938  # v4.37.9
        with:
          category: "/language:${{ matrix.language }}"
