name: "🧬 Mutation Gate (full perimeter)"

# Why this exists, separate from ci.yml's `mutation-gate` job:
# ci.yml runs mutmut with --changed-only (PR/push diff), which only re-mutates the
# perimeter files a change touches. Perimeter files left untouched accumulate latent
# survivors that --changed-only never re-checks (detection/engine.py + auth.py drifted
# to 39 un-killed mutants, found only by a manual full run on 2026-06-05). This
# workflow mutates the ENTIRE [tool.mutmut].paths_to_mutate perimeter on a schedule.
#
# It does NOT run one mutmut invocation over the whole perimeter: a single ~6k-mutant
# run trips mutmut's fork-loop child-reaping crash on a 2-worker runner and mass-reports
# "not checked" (observed dying at ~1540/6227). Instead it FANS OUT one matrix job per
# perimeter file (each <=~700 mutants — the stable batch size the --changed-only gate
# already runs cleanly). The file list comes from ci/mutation_full_matrix.py (reads
# pyproject), so there is no duplicated perimeter list to drift (the generator's
# _CI_EXCLUDE set, currently empty, can drop any file mutmut can't run here). Files
# with no mutable surface (Pydantic models, shims, constant tables) pass via the
# gate's --paths "no mutable surface" path. pty/connector.py's real-fork tests are
# skipped during mutation by the pty conftest (test_connector_mutation_mocked.py
# carries its coverage fork-free), so it runs here without leaking children.
#
# Script policy: run: blocks stay <= 3 lines (each is a single command), so no extra
# ci/ wrapper is needed beyond the matrix generator.
#
# Cost note: each matrix job re-runs npm ci + build:frontend + uv sync. A future
# optimization is to build the frontend once and share it as an artifact.

on:
  workflow_dispatch:
  schedule:
    # Weekly, Sundays 06:00 UTC. Change to "0 6 * * *" for nightly if desired.
    - cron: "0 6 * * 0"

permissions:
  contents: read

jobs:
  # Emit the perimeter file list (pyproject [tool.mutmut].paths_to_mutate) as JSON
  # so the gate job can fan out one stable per-file run via the matrix.
  perimeter-matrix:
    runs-on: ubuntu-latest
    outputs:
      paths: ${{ steps.gen.outputs.paths }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
      # tomllib needs Python >= 3.11.
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.11"
      # Read the perimeter from pyproject and expose it as a matrix input.
      - id: gen
        run: echo "paths=$(python3 ci/mutation_full_matrix.py)" >> "$GITHUB_OUTPUT"

  mutation-gate-full:
    needs: perimeter-matrix
    runs-on: ubuntu-latest
    # Per-file: setup (~5 min) + one perimeter file (<=~700 mutants, ~10-20 min).
    timeout-minutes: 90
    strategy:
      # Run every chunk so ALL drift is reported in one pass, not just the first failure.
      fail-fast: false
      # Cap concurrent runners to keep weekly CI cost bounded.
      max-parallel: 8
      matrix:
        path: ${{ fromJson(needs.perimeter-matrix.outputs.paths) }}
    steps:
      # Full history so mutmut/git operations have the complete tree.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          fetch-depth: 0
      # uv drives the gate (uv run) and the workspace install.
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
      # Pin the gate's interpreter to match scripts/run_mutation_gate.py default.
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.11"
      # Frontend assets: mutmut's stats run executes the full tests_dir, which includes
      # full-app integration tests that abort without built assets (mirrors ci.yml).
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version-file: ".nvmrc"
      - run: npm ci
      - run: npm run build:frontend
      # Install the workspace + dev tooling (mutmut, pytest, ...).
      - run: uv sync --frozen --group dev
      # Mutate just this one perimeter file. --retries 0 = a single parallel pass (a
      # survivor is reported without the slow single-worker retry).
      - name: "Mutation gate: ${{ matrix.path }}"
        run: uv run python scripts/run_mutation_gate.py --python-version 3.11 --retries 0 --min-mutation-score 100 --paths "${{ matrix.path }}"
