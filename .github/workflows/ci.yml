name: "🧪 CI"

on:
  push:
    branches:
      - main
      - "rc/**"
  pull_request:
    branches:
      - main
      - "rc/**"
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * *"

permissions:
  contents: read

jobs:
  docs-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.11"
      - run: uv sync --frozen --group dev
      - run: uv run python scripts/check_docs_accuracy.py

  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    timeout-minutes: 60
    permissions:
      contents: read
      # Read-only, for the perimeter-status note below: it reads the last
      # mutation-full run's conclusion. It writes no issues and no runs.
      actions: read
    env:
      # Hypothesis settings profile (see hypothesis_profiles.py). Every CI run
      # uses `ci` (250 examples, ~+1.7s over the previous default of 100); the
      # nightly cron goes to `deep` (1000 examples, ~+11s) so the slow search
      # happens off the PR critical path and its finds land in main's corpus.
      HYPOTHESIS_PROFILE: ${{ github.event_name == 'schedule' && 'deep' || 'ci' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      # Echo the last full-perimeter mutation result into this run's summary
      # when it is RED, and print nothing when it is green. The weekly cron sat
      # red for nine weeks unread because a scheduled run has no audience; this
      # gives it one. Advisory only — it cannot fail this job. One matrix cell,
      # so the note appears once rather than four times.
      - if: matrix.python-version == '3.13'
        name: Full-perimeter mutation status (advisory)
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash ci/report_perimeter_status.sh
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: ".nvmrc"
      - run: npm ci
      - run: npm run build:frontend
      - run: uv sync --frozen --group dev
      - run: uv run playwright install chromium
      # Restore the Hypothesis example database — the corpus of counterexamples
      # found by earlier runs. Without it every run starts from empty, so a
      # falsifying example is found once and then forgotten. Pinned to
      # <repo>/.hypothesis/examples by hypothesis_profiles.py so both pytest
      # invocations below share one corpus. Cross-branch poisoning is prevented
      # by GitHub's own cache scoping (a branch reads its own scope plus the
      # default branch, and can only write its own) plus the ref_name in the
      # key; a corpus that goes bad is purged with `gh cache delete <key>`.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        id: hypothesis-corpus
        with:
          path: .hypothesis/examples
          key: hypothesis-quality-${{ runner.os }}-py${{ matrix.python-version }}-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            hypothesis-quality-${{ runner.os }}-py${{ matrix.python-version }}-${{ github.ref_name }}-
            hypothesis-quality-${{ runner.os }}-py${{ matrix.python-version }}-${{ github.event.repository.default_branch }}-
      # Static quality gate — single source of truth shared with local dev:
      # run `ci/quality_checks.sh` before pushing to catch these without CI.
      # Covers max-LOC, SPDX headers, codegen-frames drift, event literals,
      # ruff (format + lint), strict mypy plus informational mypy-soft/ty,
      # bandit, xenon, vulture, pip-audit, licenses, the performance smoke,
      # the CF vendor tree, and package artifacts. Runs every check and reports
      # all failures (no fail-fast masking of later checks).
      # GOLDENS_REGEN_DIR: where the goldens check writes a rejected corpus, so
      # the upload step below can keep it. See .ci/check_goldens.sh.
      - run: bash ci/quality_checks.sh
        env:
          GOLDENS_REGEN_DIR: ${{ runner.temp }}/goldens-regen
      # A stale-golden failure is only actionable if you can see what the
      # generator produced, and the runner's filesystem goes away with the job.
      # if-no-files-found: ignore — most quality failures are not golden drift,
      # so the directory usually does not exist.
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: goldens-regenerated-py${{ matrix.python-version }}
          path: ${{ runner.temp }}/goldens-regen
          if-no-files-found: ignore
      # Core-package pytest gate, including the playwright browser suites (the
      # example-page and V8-coverage suites are now reliable and gated here too).
      - run: uv run python scripts/run_pytest_gate.py -q
      # Core unit coverage gate: the gate above runs under the root config (no
      # --cov). Re-run the core unit tests FROM the package dir (uv --directory)
      # so pytest uses packages/provide-uterm/pyproject.toml's
      # --cov-fail-under=100 gate; its --cov=src/provide/uterm path only resolves
      # with the package as CWD.
      - run: uv run --directory packages/provide-uterm pytest -q tests
      # Cloudflare worker / Durable Object test suite.
      # The native lifecycle adapter is run once below because it performs a
      # real Node 22 pywrangler/workerd bundle; don't repeat it for every
      # Python-version matrix cell.
      - run: uv sync --frozen --package provide-uterm-cloudflare --extra dev
      - run: >-
          uv run --frozen --package provide-uterm-cloudflare --extra dev
          pytest -q packages/provide-uterm-cloudflare/tests
          --ignore=packages/provide-uterm-cloudflare/tests/test_session_lifecycle_security_scenarios.py
      - if: matrix.python-version == '3.13'
        run: uv run python scripts/run_session_lifecycle_security_scenarios.py --backend cloudflare
      # Save the corpus, INCLUDING when the job failed — this is the step that
      # makes a red build reproducible. The all-in-one actions/cache declares
      # `post-if: success()`, which would discard exactly the run that found a
      # counterexample; restore+save with `if: always()` persists it, so
      # re-running the job replays that example first and fails the same way
      # instead of going green on a luckier search.
      - if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: .hypothesis/examples
          key: ${{ steps.hypothesis-corpus.outputs.cache-primary-key }}

  # C# port quality gate. Single source of truth:
  # packages/provide-uterm-csharp/Makefile quality-gate.
  # Ubuntu remains the primary gate; Windows proves the .NET port on Win32
  # (paths, .exe publish names, ConPTY residual skips under CI=true).
  csharp-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        with:
          dotnet-version: "10.0.x"
      # Build, conformance vectors, full test suite, coverlet floor, ship binaries.
      - run: make -C packages/provide-uterm-csharp quality-gate

  csharp-quality-windows:
    runs-on: windows-latest
    # Covers build + conformance + test + cover + the changed-only mutation gate.
    # Same 45 -> 120 raise, and for the same reason, as csharp-mutation-gate
    # below: a support-file change makes the mutation step run the full perimeter,
    # which does not fit in 45 minutes on a Windows runner.
    timeout-minutes: 120
    defaults:
      run:
        # Git Bash so the Makefile (posix shell + make macros) runs unchanged.
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # The mutation gate is changed-only and diffs against the push base.
          fetch-depth: 0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        with:
          dotnet-version: "10.0.x"
      # coverage_gate.py + mutation_gate.py need Python (tomllib).
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.11"
      # Windows images do not ship GNU make by default.
      - name: Install make
        shell: powershell
        run: choco install make --yes --no-progress
      # Same quality-gate as Ubuntu; PYTHON=python for setup-python on Windows.
      # CI=true skips PtyAndUnicode/LiveParity native interop batch (same as Linux).
      - name: C# quality gate (Windows)
        working-directory: packages/provide-uterm-csharp
        env:
          PYTHON: python
          CI: "true"
        run: make quality-gate
      # Mutation perimeter (Policy/DeckMux/Sgr/Filters) — proves the gate scripts
      # on Windows paths + python launcher, not only Ubuntu. Changed-only, same
      # as the Ubuntu csharp-mutation-gate job: a full run tests ~630 mutants and
      # does not finish inside this job's budget on a Windows runner, so it was
      # killed at the limit every time (Stryker exiting 0xC000013A,
      # STATUS_CONTROL_C_EXIT, which the gate correctly reports as a tool
      # failure rather than a mutation result).
      - name: C# mutation gate (Windows, changed-only)
        working-directory: packages/provide-uterm-csharp
        env:
          PYTHON: python
          CI: "true"
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: ci/prepare_stryker_args.sh

  go-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      # Go toolchain pinned by the module's go.mod (go directive).
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6.5.0
        with:
          go-version-file: "packages/provide-uterm-go/go.mod"
          cache-dependency-path: "packages/provide-uterm-go/go.sum"
      # Full Go gate: gofmt check, go vet, golangci-lint, race tests, and the
      # 100% statement-coverage check. Same single source of truth as local
      # runs (packages/provide-uterm-go/Makefile). golangci-lint is invoked
      # via `go run` so the version is pinned without a separate action.
      - run: make -C packages/provide-uterm-go quality-gate GOLANGCI_LINT="go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2"
      # Explicit build of all 3 shipped binaries — quality-gate's race/cover
      # steps build packages implicitly but never surface a broken `cmd/`
      # build on its own; this makes that failure mode visible by name.
      - run: make -C packages/provide-uterm-go build-binaries
      # Known-vulnerability scan against the module's actual dependency graph
      # (not just declared versions) — separate, visible step rather than
      # folded into quality-gate so a vuln finding doesn't read as a lint fail.
      - run: make -C packages/provide-uterm-go vuln
      # The live interop test needs a Python toolchain, so this job (unlike the
      # rest of the Go gate) also installs uv + Python.
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
      # Sync the Python server deps so `uv run uterm server` can boot.
      - run: uv sync --frozen --group dev
      # Live Go↔Python runtime interop proof: starts a real Python `uterm
      # server` and drives it from the Go client over REST + the WS control
      # channel. Kept out of quality-gate because it needs Python (see Makefile).
      - run: make -C packages/provide-uterm-go interop-test
      # Reverse-direction live interop proof: build a real Go `uterm server`
      # binary and drive it from the real Python client library over REST + the
      # WS control channel. This job already has both Go and the synced Python
      # env, so it is the natural home. --no-cov because this single file cannot
      # meet the client package's 100% coverage gate on its own.
      - run: uv run pytest packages/provide-uterm-client/tests/test_go_server_interop.py -m go_interop --no-cov

  # Build each language-server image and curl /healthz (directory-mounted smoke config).
  # Thin script under ci/ — no long inline shell (repo CI script policy).
  docker-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      # Assert compose uses directory mounts of /etc/uterm (not fragile file→file).
      - name: Compose config inventory
        run: |
          set -euo pipefail
          docker compose -f docker/docker-compose.yml config --services | tee /tmp/compose-services.txt
          grep -qx server /tmp/compose-services.txt
          grep -qx server-go /tmp/compose-services.txt
          grep -qx server-csharp /tmp/compose-services.txt
          cfg="$(docker compose -f docker/docker-compose.yml config)"
          echo "$cfg" | grep -q 'target: /etc/uterm'
          echo "$cfg" | grep -q 'etc-uterm'
          ! echo "$cfg" | grep -q 'dev-smoke.toml:/etc/uterm/server.toml'
      - name: Docker language-server smoke (build + /healthz)
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/uterm-docker-smoke
        run: bash ci/docker_language_smoke.sh
      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: docker-language-smoke
          path: ${{ runner.temp }}/uterm-docker-smoke/**
          if-no-files-found: ignore

  annotation-quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --frozen --group dev
      # Run annotation package tests with its own 100% branch coverage gate.
      - run: uv run pytest -q packages/provide-uterm-annotation/tests/

  server-quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    timeout-minutes: 30
    env:
      # See the `quality` job — same profile selection, its own corpus.
      HYPOTHESIS_PROFILE: ${{ github.event_name == 'schedule' && 'deep' || 'ci' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: ".nvmrc"
      # Build frontend assets so test_validate_frontend_assets_succeeds runs (not skipped)
      - run: npm ci
      - run: npm run build:frontend
      - run: uv sync --frozen --group dev
      # Restore this job's Hypothesis corpus. Deliberately a separate key
      # namespace from the `quality` job: the two jobs exercise disjoint test
      # sets on separate runners, so sharing one key would have each overwrite
      # the other's corpus with a half-empty one.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        id: hypothesis-corpus
        with:
          path: .hypothesis/examples
          key: hypothesis-server-${{ runner.os }}-py${{ matrix.python-version }}-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            hypothesis-server-${{ runner.os }}-py${{ matrix.python-version }}-${{ github.ref_name }}-
            hypothesis-server-${{ runner.os }}-py${{ matrix.python-version }}-${{ github.event.repository.default_branch }}-
      # Run server package tests with its own package coverage gate
      - run: uv run pytest -q packages/provide-uterm-server/tests/ --timeout=60 --timeout-method=thread
      # Persist the corpus on failure too — see the `quality` job's save step.
      - if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: .hypothesis/examples
          key: ${{ steps.hypothesis-corpus.outputs.cache-primary-key }}

  client-quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: ".nvmrc"
      # The client's integration tests build a real server app that mounts the
      # (gitignored) frontend assets, so build them first — mirrors server-quality.
      - run: npm ci
      - run: npm run build:frontend
      # Full workspace env: the client's integration tests build a real server
      # app (provide.uterm.server/gateway/annotation), so they need the sibling
      # packages installed — not just the isolated client + extra. Mirrors the
      # other *-quality jobs.
      - run: uv sync --frozen --group dev
      # Run client package tests with its own 100% branch coverage gate.
      # --timeout so a hung test fails fast (naming it) instead of stalling the
      # job to the 20-min cap — mirrors server-quality. The go_interop test needs
      # a built Go binary and runs in the go-quality job instead, so exclude it
      # here (GitHub runners ship a preinstalled Go it would otherwise pick up).
      - run: uv run --directory packages/provide-uterm-client pytest -q tests -m "not go_interop" --timeout=60 --timeout-method=thread


  pty-unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
      # Install the platform package + dev extra from the committed lock (no
      # fresh resolution). Replaces a `uv venv && uv pip install -e` that
      # bypassed uv.lock entirely.
      - run: uv sync --frozen --package provide-uterm-platform --extra dev
      # The capture library is interposed into a session and read by asyncio on
      # the other end, so it is the interpreter's socket and subprocess
      # semantics it meets, not just the C ABI. Those semantics move between
      # versions: 3.12 changed `wait_closed()` to await handler tasks, which
      # turned a working stop into one that blocked until the captured session
      # ended. Pinning this to the minimum version tests the tap against one
      # interpreter and ships it against four.
      - name: Build and self-test native capture library
        run: |
          make -C packages/provide-uterm-platform/native/capture clean test install
      - name: Run native capture LD_PRELOAD integration tests
        run: uv run pytest packages/provide-uterm-platform/tests/pty/test_ld_preload_capture.py packages/provide-uterm-platform/tests/pty/test_capture_frame_atomicity.py -q --no-cov --timeout=30 -o "addopts=--import-mode=importlib"
      - name: Run PTY unit tests (no PAM/root/native)
        run: uv run pytest packages/provide-uterm-platform/tests/pty/ -q --no-cov --timeout=10 --ignore=packages/provide-uterm-platform/tests/pty/e2e --ignore=packages/provide-uterm-platform/tests/pty/test_ld_preload_capture.py --ignore=packages/provide-uterm-platform/tests/pty/test_capture_frame_atomicity.py -o "addopts=--import-mode=importlib"

  npm-quality:
    # Frontend unit tests + typecheck for both npm workspaces. Previously only
    # build + Python gates ran in CI, so vitest regressions in the app/frontend
    # workspaces could ship silently.
    runs-on: ubuntu-latest
    # The TS suite is ~10.6k tests under full coverage instrumentation and now
    # takes just over 10 minutes, so it was dying at its own limit every run —
    # which GitHub reports as "cancelled", not a timeout, and read as though
    # something external was killing it.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: ".nvmrc"
      - run: npm ci
      - run: npm run typecheck:frontend
      - run: npm run typecheck:app
      - run: npm run lint:frontend
      - run: npm run lint:app
      # Both browser workspaces enforce their behavioral coverage floors here;
      # plain `npm test` would not evaluate Vitest's configured thresholds.
      - run: npm run test:coverage --workspace=packages/provide-uterm-frontend
      - run: npm run test:coverage --workspace=packages/provide-uterm-app
      - run: npm run test:browser-consumer
      # The TypeScript runtime port typechecks under tsc 7 and holds itself
      # to 100% line/branch/function coverage, enforced by its vitest config.
      - run: npm run typecheck:ts
      - run: npm run build --workspace=packages/provide-uterm-ts
      - run: npm run smoke:dist --workspace=packages/provide-uterm-ts
      - run: npm run lint:ts
      - run: npm run test:ts:coverage

  manager-quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --frozen --group dev
      # Run platform manager tests with its own 100% branch coverage gate
      - run: uv run pytest -q packages/provide-uterm-platform/tests/manager/

  # pty-docker (PAM + native libs) is not yet enabled — Dockerfile.test for
  # packages/provide-uterm-platform/ needs to be created first.

  windows-process-tree-smoke:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.11"
      - run: uv sync --frozen --group dev
      - run: uv run pytest packages/provide-uterm-platform/tests/manager/manager/test_process.py -q -k kill_agent_terminates_spawned_child_process_tree --no-cov -vv

  mutation-gate:
    runs-on: ubuntu-latest
    # Without this the job inherits GitHub's 6-hour platform cap, and a run that
    # widens to the full perimeter burns all of it before reporting anything —
    # which is exactly what happened when a commit touched root pyproject.toml
    # (a mutation support file) with no perimeter source change, forcing the
    # un-chunked full run the changed-only path exists to avoid. A changed-only
    # run is minutes; anything approaching this budget is the runaway, and
    # failing at 90 minutes says so while the evidence is still readable.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.11"
      # Build frontend assets: mutmut's stats-collection run executes the full
      # tests_dir, which includes full-app integration tests (e.g.
      # test_loaded_max_sessions_is_enforced_by_app -> create_server_app) that
      # raise "missing required frontend assets" without a built frontend. Without
      # this, any perimeter-file change aborts stats collection -> every mutant
      # reports "not checked" -> score 0.00. Mirrors quality/server-quality jobs.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: ".nvmrc"
      - run: npm ci
      - run: npm run build:frontend
      - run: uv sync --frozen --group dev
      # Resolve --changed-only base ref from the trigger event and run the mutation gate.
      - name: Run mutation gate (changed-only)
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: ci/prepare_mutation_args.sh

  # Go-side mutation gate: gremlins over a small, ~100%-covered perimeter
  # (sanitizer/colors/filters/lineeditor). Separate from go-quality because
  # mutation testing is minutes-slow and needs python3 to drive the gate +
  # enforce the equivalent-mutant allowlist. Mirrors the Python mutation-gate's
  # killed==100%-minus-documented-equivalents bar.
  go-mutation-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      # Go toolchain pinned by the module's go.mod (go directive).
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6.5.0
        with:
          go-version-file: "packages/provide-uterm-go/go.mod"
          cache-dependency-path: "packages/provide-uterm-go/go.sum"
      # Python 3.11+ drives the gate (tomllib + json, stdlib only).
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.11"
      # Run gremlins over the perimeter; fails on any unexcused survivor,
      # NOT_COVERED, or TIMED_OUT mutant. gremlins is fetched via `go run`.
      # The gate carries its own 900s budget, deliberately below the 20 minutes
      # above: a slow runner scales every mutant's derived timeout at once, and
      # on 2026-08-03 that took a normally-5-minute run past this limit, where
      # it was killed without reporting which package it was in. The gate now
      # fails first and names it; this timeout is the backstop, not the
      # mechanism. test_go_mutation_gate_budget.py asserts the two stay ordered.
      - run: make -C packages/provide-uterm-go mutation-gate

  # TypeScript mutation gate: StrykerJS over the curated perimeter declared in
  # packages/provide-uterm-ts/stryker.config.mjs (egress/CIDR + webhook-destination
  # guards, hub store, server bootstrap, serverconfig schema/validators/posture,
  # rate-limiter arithmetic). Same killed==100%-minus-documented-equivalents bar as
  # the Python, Go and C# gates.
  #
  # This ran nowhere until 2026-08-09: the package had stryker.config.mjs and a
  # hand-curated mutation_equivalents.toml, but no workflow invoked either, so the
  # port's mutable surface had never been measured in CI. Baseline at wiring:
  # 1477 killed / 14 survived, all 14 carrying a written equivalence reason.
  #
  # Full perimeter every run, like Go and C# — not changed-only. A changed-only
  # split is what let routes/ and hub/lease.py drift unmeasured on the Python side
  # for weeks, because a file nobody touches is never re-checked.
  ts-mutation-gate:
    runs-on: ubuntu-latest
    # Stryker mutates ~1900 mutants through the real vitest suite (the
    # typescript-checker pre-filter is unavailable under tsgo, see the config).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      # Node pinned by .nvmrc, matching every other npm job.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: ".nvmrc"
      # Python 3.11+ drives the gate (tomllib + json, stdlib only), mirroring Go's.
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.11"
      - run: npm ci
      # Runs Stryker, then scores its JSON report against the equivalent-mutant
      # allowlist: any survivor without a written reason fails the job.
      - run: python3 packages/provide-uterm-ts/ci/mutation_gate.py

  # C# mutation gate: Policy + DeckMux + Colors/Sgr perimeter (local make target).
  csharp-mutation-gate:
    runs-on: ubuntu-latest
    # Stryker pays a fixed ~10-20 minute whole-project instrumentation cost per
    # run (C# compiles per-assembly, so a narrow `mutate` glob does not shrink
    # it). At 25 minutes this job died at its own limit every run, which GitHub
    # reports as "cancelled" rather than a timeout. The gate is changed-only now
    # (see ci/prepare_stryker_args.sh), so it usually skips outright; the budget
    # covers the runs that do mutate something.
    #
    # Raised 45 -> 120 on 2026-08-11. 45 covered the narrowed runs but not the
    # FULL perimeter, which ci/stryker_gate.py falls back to whenever a file in
    # its SUPPORT_PATHS changes (mutation_equivalents.toml, stryker-config.json,
    # the gate scripts). Renumbering the allowlist after a source edit shifts its
    # line keys, so that fallback fires on ordinary work, and the first commit to
    # trigger it died here at exactly 45m. A full run measures ~30 minutes of
    # Stryker on an M-series laptop; a runner is slower and Windows slower again.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # changed-only diffs against the push's base commit / the PR base.
          fetch-depth: 0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.11"
      # Build test project once so the gate's per-mutant test filter is fast.
      - run: dotnet build packages/provide-uterm-csharp/tests/Provide.Uterm.Tests/Provide.Uterm.Tests.csproj -c Release
      # Resolve --changed-only base ref from the trigger event, then run the gate.
      - name: Run C# mutation gate (changed-only)
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: packages/provide-uterm-csharp/ci/prepare_stryker_args.sh

  # Layer B: the live interop matrix. Every client language against every
  # server language, over real sockets on ephemeral ports. The offline corpora
  # in the other jobs prove each port *decides* the same things; only this
  # proves they can talk to each other.
  live-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        server_impl: [python, go, csharp]
    env:
      SERVER_IMPL: ${{ matrix.server_impl }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.11"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: ".nvmrc"
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6.5.0
        with:
          go-version-file: "packages/provide-uterm-go/go.mod"
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        with:
          dotnet-version: "10.0.x"
      - run: uv sync --frozen --group dev
      - run: npm ci
      # Every live cell boots a real server, which refuses to start without
      # the built frontend assets. They are gitignored build output, so a job
      # that only installs dependencies errors every cell in the matrix.
      - run: npm run build:frontend
      # The harness's own unit tests: what an expectation means, how two cells
      # are compared, and which drivers exist. A broken harness would agree
      # with itself in every cell.
      - run: uv run pytest -q tests/conformance/live/ -o addopts=--import-mode=importlib
      # The fan-out contract drives the C# adapter with `dotnet test
      # --no-restore`, which needs the project already restored. Nothing else
      # in this job restores it, and an unmatched filter exits 0 — so the
      # adapter silently produced no observations instead of failing loudly.
      - run: dotnet build packages/provide-uterm-csharp/tests/Provide.Uterm.Tests/Provide.Uterm.Tests.csproj
      # Security-sensitive cross-language contracts execute their native
      # adapters here. Keeping these outside the default Python testpaths must
      # not let a missing scenario category or a backend observation drift
      # pass CI unnoticed.
      - run: uv run pytest -q tests/conformance/test_fanout_security_coverage.py -o addopts=--import-mode=importlib
      # Every client against every server. Prints every gap before it runs.
      - run: bash ci/live_matrix.sh

  # Multi-backend Playwright parity: real python/go/csharp servers under
  # UTERM_TEST_MODE=1. Smoke of the heavy suite (hijack + deckmux + resume +
  # color static palettes). Keeps default PT CI fast (in-process python).
  multi-backend-playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        backend: [python, go, csharp]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.11"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: ".nvmrc"
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6.5.0
        if: matrix.backend == 'go'
        with:
          go-version-file: "packages/provide-uterm-go/go.mod"
          cache-dependency-path: "packages/provide-uterm-go/go.sum"
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        if: matrix.backend == 'csharp'
        with:
          dotnet-version: "10.0.x"
      - run: npm ci
      - run: npm run build:frontend
      - run: uv sync --frozen --group dev
      - run: uv run playwright install chromium --with-deps
      # Pre-build C# server so first test does not pay `dotnet run` cold start.
      - name: Prebuild C# server
        if: matrix.backend == 'csharp'
        run: dotnet build packages/provide-uterm-csharp/cmd/Uterm/Uterm.csproj -c Release
      # Split multi-backend into two pytest processes so session-scoped dual-mode
      # servers + WorkerController load cannot starve later handshakes (stderr-pipe
      # freeze + zombie connect retries). Hijack+chaos first (load-bearing).
      - name: Multi-backend Playwright core (${{ matrix.backend }})
        env:
          UTERM_TEST_BACKEND: ${{ matrix.backend }}
          UTERM_TEST_MODE: "1"
          UTERM_MULTI_BACKEND: "1"
        run: >
          uv run pytest
          packages/provide-uterm/tests/playwright/test_hijack.py
          packages/provide-uterm/tests/playwright/test_chaos_browser.py
          packages/provide-uterm/tests/playwright/test_chaos_browser_2.py
          packages/provide-uterm/tests/playwright/test_deckmux_e2e_part1.py
          packages/provide-uterm/tests/playwright/test_deckmux_e2e_part2.py
          packages/provide-uterm/tests/playwright/test_resume.py
          packages/provide-uterm/tests/playwright/test_recovery.py
          -m "playwright and not slow"
          --no-cov -q --tb=line
          -k "not nyan and not plasma and not telnet"
      - name: Multi-backend Playwright extras (${{ matrix.backend }})
        env:
          UTERM_TEST_BACKEND: ${{ matrix.backend }}
          UTERM_TEST_MODE: "1"
          UTERM_MULTI_BACKEND: "1"
        run: >
          uv run pytest
          packages/provide-uterm/tests/playwright/test_color_palette.py
          packages/provide-uterm/tests/playwright/test_multi_backend_parity.py
          packages/provide-uterm/tests/playwright/test_multi_backend_deckmux_resume.py
          packages/provide-uterm/tests/playwright/test_reconnect_spinner.py
          packages/provide-uterm/tests/playwright/test_browser_control_channel.py
          -m "playwright and not slow"
          --no-cov -q --tb=line
          -k "not nyan and not plasma and not telnet"
      # Inspect: dual-mode real /tunnel on all backends. Terminal-proxy: Python-only
      # (explicit product-gap skip on go/csharp). MULTI_BACKEND for inspect tunnel path.
      - name: Inspect + terminal-proxy Playwright
        env:
          UTERM_TEST_BACKEND: ${{ matrix.backend }}
          UTERM_TEST_MODE: "1"
          UTERM_MULTI_BACKEND: "1"
        run: >
          uv run pytest
          packages/provide-uterm/tests/playwright/test_inspect_e2e.py
          packages/provide-uterm/tests/playwright/test_terminal_proxy.py
          -m "playwright and not slow"
          --no-cov -q --tb=line
          --timeout=60

  compliance:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: uvx reuse lint
      - run: uv sync --frozen --group dev
      - run: uv run codespell

  release-readiness:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.11"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: ".nvmrc"
      - run: npm ci
      - run: npm run build:frontend
      - run: uv sync --frozen --group dev
      - run: uv build --package provide-uterm
      - run: uvx --from twine twine check dist/*

  performance-smoke:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.11"
      - run: uv sync --frozen --group dev
      - run: uv run python scripts/run_performance_smoke.py --iterations 300000 --enforce

  memory-regression:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.11"
      - run: uv sync --frozen --group dev
      - name: Run memray stress tests
        run: uv run pytest packages/provide-uterm/tests/memray/ -m memray -v --tb=short --no-cov
      - name: Upload memray artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: memray-output
          path: packages/provide-uterm/memray-output/
          retention-days: 30
