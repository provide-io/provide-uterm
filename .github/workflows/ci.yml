name: "🧪 CI"

on:
  push:
    branches:
      - main
      - "rc/**"
  pull_request:
    branches:
      - main
      - "rc/**"
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * *"

permissions:
  contents: read

jobs:
  docs-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.11"
      - run: uv sync --group dev
      - run: uv run python scripts/check_docs_accuracy.py

  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: "20"
      - run: npm ci
      - run: npm run build:frontend
      - run: uv sync --group dev
      - run: uv run playwright install chromium
      - run: uv run python scripts/check_max_loc.py --max-lines 500 --baseline .ci/max-loc-baseline.json
      - run: uv run python scripts/check_spdx_headers.py
      - run: uv run python scripts/check_event_literals.py
      - run: uv run ruff format --check packages/provide-uterm/src packages/provide-uterm/tests scripts
      - run: uv run ruff check packages/provide-uterm/src packages/provide-uterm/tests scripts
      # Strict mypy on the core package — must stay clean (gate).
      - run: ci/typecheck.sh mypy
      # Informational mypy on the other workspace src/ trees. Logs annotations
      # via ::warning:: but never fails CI until the trees reach 100% clean.
      - name: mypy (soft mode, other packages)
        run: ci/typecheck.sh mypy-soft
      # Informational ty (Astral) across all packages. Known cross-file
      # resolution gaps mean we don't fail CI on its output yet.
      - name: ty (informational)
        run: ci/typecheck.sh ty
      - run: uv run bandit -r packages/provide-uterm/src/ -ll
      - run: uv run xenon --max-absolute D --max-modules D --max-average A packages/provide-uterm/src/
      - run: uv run vulture packages/provide-uterm/src/ packages/provide-uterm/tests/ --ignore-names "since,password,kw,exc_type,tb,interval_s,pubkey_blob,username"
      - run: uv run python -m pip_audit --path .
      - run: uv run python scripts/check_licenses.py
      - run: uv run python scripts/run_pytest_gate.py -q --ignore=packages/provide-uterm/tests/playwright/test_example.py --ignore=packages/provide-uterm/tests/playwright/test_frontend_coverage.py
      - name: Run Hub Performance Benchmark
        run: uv run python scripts/run_performance_smoke.py --iterations 100000 --enforce
      - name: Check CF vendor tree
        run: bash .ci/check_cf_vendor_tree.sh
      - run: uv run pytest -q packages/provide-uterm-cloudflare/tests
      - run: uv run python scripts/verify_package_artifacts.py

  server-quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: "20"
      # Build frontend assets so test_validate_frontend_assets_succeeds runs (not skipped)
      - run: npm ci
      - run: npm run build:frontend
      - run: uv sync --group dev
      # Run server package tests with its own package coverage gate
      - run: uv run pytest -q packages/provide-uterm-server/tests/ --timeout=60 --timeout-method=thread

  pty-unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv venv && uv pip install -e "packages/provide-uterm-platform/[dev]"
      - name: Run PTY unit tests (no PAM/root/native)
        run: uv run pytest packages/provide-uterm-platform/tests/pty/ -q --no-cov --timeout=10 --ignore=packages/provide-uterm-platform/tests/pty/e2e -o "addopts=--import-mode=importlib"

  npm-quality:
    # Frontend unit tests + typecheck for both npm workspaces. Previously only
    # build + Python gates ran in CI, so vitest regressions in the app/frontend
    # workspaces could ship silently.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: "20"
      - run: npm ci
      - run: npm run typecheck:frontend
      - run: npm run typecheck:app
      - run: npm run lint:frontend
      - run: npm run lint:app
      # Both workspaces have their own vitest suite.
      - run: npm test --workspace=packages/provide-uterm-frontend
      - run: npm test --workspace=packages/provide-uterm-app

  manager-quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --group dev
      # Run platform manager tests with its own 100% branch coverage gate
      - run: uv run pytest -q packages/provide-uterm-platform/tests/manager/

  # pty-docker (PAM + native libs) is not yet enabled — Dockerfile.test for
  # packages/provide-uterm-platform/ needs to be created first.

  windows-process-tree-smoke:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.11"
      - run: uv sync --group dev
      - run: uv run pytest packages/provide-uterm-platform/tests/manager/manager/test_process.py -q -k kill_agent_terminates_spawned_child_process_tree --no-cov -vv

  mutation-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.11"
      - run: uv sync --group dev
      # Resolve --changed-only base ref from the trigger event and run the mutation gate.
      - name: Run mutation gate (changed-only)
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: ci/prepare_mutation_args.sh

  compliance:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: uvx reuse lint
      - run: uv sync --group dev
      - run: uv run codespell

  release-readiness:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.11"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: "20"
      - run: npm ci
      - run: npm run build:frontend
      - run: uv sync --group dev
      - run: uv build --package provide-uterm
      - run: uvx --from twine twine check dist/*

  performance-smoke:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.11"
      - run: uv sync --group dev
      - run: uv run python scripts/run_performance_smoke.py --iterations 300000 --enforce

  memory-regression:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.11"
      - run: uv sync --group dev
      - name: Run memray stress tests
        run: uv run pytest packages/provide-uterm/tests/memray/ -m memray -v --tb=short --no-cov
      - name: Upload memray artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: memray-output
          path: packages/provide-uterm/memray-output/
          retention-days: 30
