name: "🧪 CI"

on:
  push:
    branches:
      - main
      - "rc/**"
  pull_request:
    branches:
      - main
      - "rc/**"
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * *"

permissions:
  contents: read

jobs:
  docs-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.11"
      - run: uv sync --frozen --group dev
      - run: uv run python scripts/check_docs_accuracy.py

  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version-file: ".nvmrc"
      - run: npm ci
      - run: npm run build:frontend
      - run: uv sync --frozen --group dev
      - run: uv run playwright install chromium
      # Static quality gate — single source of truth shared with local dev:
      # run `ci/quality_checks.sh` before pushing to catch these without CI.
      # Covers max-LOC, SPDX headers, codegen-frames drift, event literals,
      # ruff (format + lint), strict mypy plus informational mypy-soft/ty,
      # bandit, xenon, vulture, pip-audit, licenses, the performance smoke,
      # the CF vendor tree, and package artifacts. Runs every check and reports
      # all failures (no fail-fast masking of later checks).
      - run: bash ci/quality_checks.sh
      # Core-package pytest gate, including the playwright browser suites (the
      # example-page and V8-coverage suites are now reliable and gated here too).
      - run: uv run python scripts/run_pytest_gate.py -q
      # Core unit coverage gate: the gate above runs under the root config (no
      # --cov). Re-run the core unit tests FROM the package dir (uv --directory)
      # so pytest uses packages/provide-uterm/pyproject.toml's
      # --cov-fail-under=100 gate; its --cov=src/provide/uterm path only resolves
      # with the package as CWD.
      - run: uv run --directory packages/provide-uterm pytest -q tests
      # Cloudflare worker / Durable Object test suite.
      - run: uv run pytest -q packages/provide-uterm-cloudflare/tests

  go-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
      # Go toolchain pinned by the module's go.mod (go directive).
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6.5.0
        with:
          go-version-file: "packages/provide-uterm-go/go.mod"
          cache-dependency-path: "packages/provide-uterm-go/go.sum"
      # Full Go gate: gofmt check, go vet, golangci-lint, race tests, and the
      # 100% statement-coverage check. Same single source of truth as local
      # runs (packages/provide-uterm-go/Makefile). golangci-lint is invoked
      # via `go run` so the version is pinned without a separate action.
      - run: make -C packages/provide-uterm-go quality-gate GOLANGCI_LINT="go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2"
      # Explicit build of all 3 shipped binaries — quality-gate's race/cover
      # steps build packages implicitly but never surface a broken `cmd/`
      # build on its own; this makes that failure mode visible by name.
      - run: make -C packages/provide-uterm-go build-binaries
      # Known-vulnerability scan against the module's actual dependency graph
      # (not just declared versions) — separate, visible step rather than
      # folded into quality-gate so a vuln finding doesn't read as a lint fail.
      - run: make -C packages/provide-uterm-go vuln

  annotation-quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --frozen --group dev
      # Run annotation package tests with its own 100% branch coverage gate.
      - run: uv run pytest -q packages/provide-uterm-annotation/tests/

  server-quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version-file: ".nvmrc"
      # Build frontend assets so test_validate_frontend_assets_succeeds runs (not skipped)
      - run: npm ci
      - run: npm run build:frontend
      - run: uv sync --frozen --group dev
      # Run server package tests with its own package coverage gate
      - run: uv run pytest -q packages/provide-uterm-server/tests/ --timeout=60 --timeout-method=thread

  client-quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version-file: ".nvmrc"
      # The client's integration tests build a real server app that mounts the
      # (gitignored) frontend assets, so build them first — mirrors server-quality.
      - run: npm ci
      - run: npm run build:frontend
      # Full workspace env: the client's integration tests build a real server
      # app (provide.uterm.server/gateway/annotation), so they need the sibling
      # packages installed — not just the isolated client + extra. Mirrors the
      # other *-quality jobs.
      - run: uv sync --frozen --group dev
      # Run client package tests with its own 100% branch coverage gate.
      # --timeout so a hung test fails fast (naming it) instead of stalling the
      # job to the 20-min cap — mirrors server-quality.
      - run: uv run --directory packages/provide-uterm-client pytest -q tests --timeout=60 --timeout-method=thread

  pty-unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
      # Install the platform package + dev extra from the committed lock (no
      # fresh resolution). Replaces a `uv venv && uv pip install -e` that
      # bypassed uv.lock entirely.
      - run: uv sync --frozen --package provide-uterm-platform --extra dev
      - name: Run PTY unit tests (no PAM/root/native)
        run: uv run pytest packages/provide-uterm-platform/tests/pty/ -q --no-cov --timeout=10 --ignore=packages/provide-uterm-platform/tests/pty/e2e -o "addopts=--import-mode=importlib"

  npm-quality:
    # Frontend unit tests + typecheck for both npm workspaces. Previously only
    # build + Python gates ran in CI, so vitest regressions in the app/frontend
    # workspaces could ship silently.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version-file: ".nvmrc"
      - run: npm ci
      - run: npm run typecheck:frontend
      - run: npm run typecheck:app
      - run: npm run lint:frontend
      - run: npm run lint:app
      # Both workspaces have their own vitest suite.
      - run: npm test --workspace=packages/provide-uterm-frontend
      - run: npm test --workspace=packages/provide-uterm-app

  manager-quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --frozen --group dev
      # Run platform manager tests with its own 100% branch coverage gate
      - run: uv run pytest -q packages/provide-uterm-platform/tests/manager/

  # pty-docker (PAM + native libs) is not yet enabled — Dockerfile.test for
  # packages/provide-uterm-platform/ needs to be created first.

  windows-process-tree-smoke:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.11"
      - run: uv sync --frozen --group dev
      - run: uv run pytest packages/provide-uterm-platform/tests/manager/manager/test_process.py -q -k kill_agent_terminates_spawned_child_process_tree --no-cov -vv

  mutation-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.11"
      # Build frontend assets: mutmut's stats-collection run executes the full
      # tests_dir, which includes full-app integration tests (e.g.
      # test_loaded_max_sessions_is_enforced_by_app -> create_server_app) that
      # raise "missing required frontend assets" without a built frontend. Without
      # this, any perimeter-file change aborts stats collection -> every mutant
      # reports "not checked" -> score 0.00. Mirrors quality/server-quality jobs.
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version-file: ".nvmrc"
      - run: npm ci
      - run: npm run build:frontend
      - run: uv sync --frozen --group dev
      # Resolve --changed-only base ref from the trigger event and run the mutation gate.
      - name: Run mutation gate (changed-only)
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: ci/prepare_mutation_args.sh

  compliance:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: uvx reuse lint
      - run: uv sync --frozen --group dev
      - run: uv run codespell

  release-readiness:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.11"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version-file: ".nvmrc"
      - run: npm ci
      - run: npm run build:frontend
      - run: uv sync --frozen --group dev
      - run: uv build --package provide-uterm
      - run: uvx --from twine twine check dist/*

  performance-smoke:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.11"
      - run: uv sync --frozen --group dev
      - run: uv run python scripts/run_performance_smoke.py --iterations 300000 --enforce

  memory-regression:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.11"
      - run: uv sync --frozen --group dev
      - name: Run memray stress tests
        run: uv run pytest packages/provide-uterm/tests/memray/ -m memray -v --tb=short --no-cov
      - name: Upload memray artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: memray-output
          path: packages/provide-uterm/memray-output/
          retention-days: 30
