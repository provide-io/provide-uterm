# Scan the reference server's Docker image for known CVEs before it goes
# anywhere. Trivy reports both OS-level (apt / apk / etc.) and language-level
# (pip resolved deps) findings. Fail the workflow on HIGH/CRITICAL so a
# broken base image can't ship a release.
#
# Closes docs/security-considerations.md §5 ("Container image scanning")
# and §9 ("Build / CI hardening" — image vulnerability gate).

name: "🐋 Container Scan"

on:
  push:
    branches:
      - main
      - "rc/**"
    paths:
      - "docker/**"
      - "packages/provide-uterm/**"
      - "packages/provide-uterm-server/**"
      - "packages/provide-uterm-platform/**"
      - "packages/provide-uterm-go/**"
      - "packages/provide-uterm-csharp/**"
      - "ci/build_*.sh"
      - ".github/workflows/container-scan.yml"
  pull_request:
    branches:
      - main
      - "rc/**"
    paths:
      - "docker/**"
      - "packages/provide-uterm-go/**"
      - "packages/provide-uterm-csharp/**"
      - "ci/build_*.sh"
      - ".github/workflows/container-scan.yml"
  schedule:
    # Weekly run so newly-disclosed CVEs against an unchanged base image
    # are still caught. Wednesday morning PST = mid-week, post-Dependabot.
    - cron: "0 15 * * 3"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write   # upload SARIF to the Security tab

jobs:
  trivy:
    name: Trivy image scan (server)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # Build the server image locally (not pushed) so Trivy can scan it
      - name: Build server image
        run: ci/build_server_image.sh provide-uterm-server:scan

      # SARIF report uploaded to GitHub's Security tab so findings have
      # a permanent home and dismissals persist across runs.
      - name: Trivy scan (SARIF)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: provide-uterm-server:scan
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 0      # don't fail the SARIF stage; fail in the gate below

      - name: Upload SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3  # v4.37.6
        with:
          sarif_file: trivy-results.sarif
          category: trivy-server

      # Gate: this step fails the workflow on HIGH/CRITICAL findings.
      # ignore-unfixed=true so we don't block on CVEs the base image hasn't
      # shipped a fix for yet (those are documented elsewhere and require
      # an image migration, not a code change).
      - name: Trivy gate (fail on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: provide-uterm-server:scan
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1

  trivy-cf:
    name: Trivy image scan (cloudflare)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # Build the Cloudflare Worker image locally (not pushed) so Trivy can scan it
      - name: Build CF image
        run: ci/build_cf_image.sh provide-uterm-cf:scan

      # SARIF report uploaded to GitHub's Security tab under its own category so
      # CF findings don't collide with the server scan's dismissals.
      - name: Trivy scan (SARIF)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: provide-uterm-cf:scan
          format: sarif
          output: trivy-results-cf.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 0      # don't fail the SARIF stage; fail in the gate below

      - name: Upload SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3  # v4.37.6
        with:
          sarif_file: trivy-results-cf.sarif
          category: trivy-cf

      # Gate: fails the workflow on HIGH/CRITICAL findings in the CF image.
      # Same ignore-unfixed rationale as the server scan above.
      - name: Trivy gate (fail on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: provide-uterm-cf:scan
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1

  trivy-go:
    name: Trivy image scan (go server)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Build Go server image
        run: ci/build_go_image.sh provide-uterm-server-go:scan
      - name: Trivy scan (SARIF)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: provide-uterm-server-go:scan
          format: sarif
          output: trivy-results-go.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 0
      - name: Upload SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3  # v4.37.6
        with:
          sarif_file: trivy-results-go.sarif
          category: trivy-go
      - name: Trivy gate (fail on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: provide-uterm-server-go:scan
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1

  trivy-csharp:
    name: Trivy image scan (csharp server)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Build C# server image
        run: ci/build_csharp_image.sh provide-uterm-server-csharp:scan
      - name: Trivy scan (SARIF)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: provide-uterm-server-csharp:scan
          format: sarif
          output: trivy-results-csharp.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 0
      - name: Upload SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3  # v4.37.6
        with:
          sarif_file: trivy-results-csharp.sarif
          category: trivy-csharp
      - name: Trivy gate (fail on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: provide-uterm-server-csharp:scan
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
