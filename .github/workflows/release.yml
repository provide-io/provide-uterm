#
# Publish all workspace packages to TestPyPI (staging) then PyPI (production),
# with Sigstore signing and GitHub Release asset upload.
#
# Dependency order: provide-uterm → provide-uterm-{server,client,platform} → provide-uterm-cloudflare

name: "🚀 Release"

on:
  push:
    tags:
      - "v*"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Build, verify artifacts, and sign without publishing"
        required: false
        default: true
        type: boolean

# Restrict permissions globally; jobs opt-in as needed.
permissions:
  contents: read

concurrency:
  # Deliberately inert, and explicit rather than absent so that "release.yml has
  # no concurrency block" is never mistaken for an oversight worth fixing.
  #
  # A release publishes artefacts. Cancelling one part-way can leave a tag
  # pushed with no wheel, or a wheel uploaded under a version whose governance
  # checks never finished -- a half-published state that is worse than a slow
  # queue. The run-id group guarantees no two release runs ever share a group,
  # so nothing here can be cancelled or de-queued by a later run.
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  # ── Build (all packages in parallel — uses workspace sources) ─────────
  build:
    name: Build ${{ matrix.package }}
    # Guard the whole pipeline: on a `release` event, only proceed for version
    # tags (v*). Every other job needs: build, so a non-version release (e.g. an
    # asset-hosting release like demo-assets) skips build and the entire publish
    # chain skips with it. push (v* tags) and workflow_dispatch are unaffected
    # (the first clause is true, and short-circuits the tag_name lookup).
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        package:
          - provide-uterm
          - provide-uterm-server
          - provide-uterm-client
          - provide-uterm-platform
          - provide-uterm-cloudflare
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d  # v10.0.0

      # Reproducible builds: derive SOURCE_DATE_EPOCH from the commit
      # being built so wheels rebuilt from this SHA on a different host
      # are byte-identical. Required for SLSA L3 provenance to actually
      # mean something — without it, a re-run of the same workflow on
      # the same SHA would produce mismatched bytes.
      - name: Pin SOURCE_DATE_EPOCH from commit timestamp
        run: |
          echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      # Build sdist + wheel for each package
      - name: Build sdist + wheel
        run: uv build --package ${{ matrix.package }}

      # Upload build artifacts for later publish stages
      - name: Upload dists
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dist-${{ matrix.package }}
          path: dist/*

  # ── Stage 1: provide-uterm (core, no workspace deps) ─────────────────
  testpypi-terminal:
    name: TestPyPI · provide-uterm
    needs: build
    if: github.event_name != 'workflow_dispatch' || inputs.dry-run != true
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist-provide-uterm
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  verify-terminal:
    name: Verify TestPyPI · provide-uterm
    needs: testpypi-terminal
    if: github.event_name != 'workflow_dispatch' || inputs.dry-run != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"
      # Read expected version from VERSION file
      - name: Read expected version
        id: ver
        run: echo "version=$(cat packages/provide-uterm/VERSION)" >> "$GITHUB_OUTPUT"
      # Install from TestPyPI with fallback to PyPI for transitive deps
      - name: Install from TestPyPI (with retries)
        run: ci/install_from_testpypi.sh provide-uterm "${{ steps.ver.outputs.version }}"
      # Confirm the installed version matches the expected VERSION
      - name: Verify installed version
        run: ci/verify_installed_version.sh provide-uterm "${{ steps.ver.outputs.version }}"
      - name: Verify imports
        run: python scripts/verify_installed_package.py provide-uterm

  pypi-terminal:
    name: PyPI · provide-uterm
    needs: verify-terminal
    # Belt-and-suspenders on the actual PyPI publish: only version-tag releases.
    if: github.event_name == 'release' && startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist-provide-uterm
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          # Re-running a release must not die on files PyPI already has. Without
          # this, a re-run reaches PyPI, gets "file already exists", fails the job
          # -- and sign-and-release needs all three PyPI jobs, so the Sigstore
          # bundles and SLSA provenance for that version become unreachable. The
          # TestPyPI steps have carried this from the start; the PyPI ones did not,
          # which is what left 0.5.1 published but unsignable.
          #
          # It hides nothing: PyPI refuses to replace an existing file either way,
          # so the only behaviour this changes is fatal -> no-op.
          skip-existing: true

  # ── Stage 2: server, client, platform (depend on provide-uterm) ─────
  testpypi-dependents:
    name: TestPyPI · ${{ matrix.package }}
    needs: [build, verify-terminal]
    if: github.event_name != 'workflow_dispatch' || inputs.dry-run != true
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    strategy:
      fail-fast: true
      matrix:
        package:
          - provide-uterm-server
          - provide-uterm-client
          - provide-uterm-platform
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist-${{ matrix.package }}
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  verify-dependents:
    name: Verify TestPyPI · ${{ matrix.package }}
    needs: testpypi-dependents
    if: github.event_name != 'workflow_dispatch' || inputs.dry-run != true
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        package:
          - provide-uterm-server
          - provide-uterm-client
          - provide-uterm-platform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"
      - name: Read expected version
        id: ver
        run: echo "version=$(cat packages/${{ matrix.package }}/VERSION)" >> "$GITHUB_OUTPUT"
      - name: Install from TestPyPI (with retries)
        run: ci/install_from_testpypi.sh "${{ matrix.package }}" "${{ steps.ver.outputs.version }}"
      - name: Verify installed version
        run: ci/verify_installed_version.sh "${{ matrix.package }}" "${{ steps.ver.outputs.version }}"
      - name: Verify imports and entry points
        run: python scripts/verify_installed_package.py "${{ matrix.package }}"

  pypi-dependents:
    name: PyPI · ${{ matrix.package }}
    needs: [verify-dependents, pypi-terminal]
    if: github.event_name == 'release' && startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    strategy:
      fail-fast: true
      matrix:
        package:
          - provide-uterm-server
          - provide-uterm-client
          - provide-uterm-platform
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist-${{ matrix.package }}
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          # Re-running a release must not die on files PyPI already has. Without
          # this, a re-run reaches PyPI, gets "file already exists", fails the job
          # -- and sign-and-release needs all three PyPI jobs, so the Sigstore
          # bundles and SLSA provenance for that version become unreachable. The
          # TestPyPI steps have carried this from the start; the PyPI ones did not,
          # which is what left 0.5.1 published but unsignable.
          #
          # It hides nothing: PyPI refuses to replace an existing file either way,
          # so the only behaviour this changes is fatal -> no-op.
          skip-existing: true

  # ── Stage 3: provide-uterm-cloudflare (depends on core) ─────────────
  testpypi-cloudflare:
    name: TestPyPI · provide-uterm-cloudflare
    needs: [build, verify-terminal]
    if: github.event_name != 'workflow_dispatch' || inputs.dry-run != true
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist-provide-uterm-cloudflare
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  verify-cloudflare:
    name: Verify TestPyPI · provide-uterm-cloudflare
    needs: testpypi-cloudflare
    if: github.event_name != 'workflow_dispatch' || inputs.dry-run != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"
      # Read expected version
      - name: Read expected version
        id: ver
        run: echo "version=$(cat packages/provide-uterm-cloudflare/VERSION)" >> "$GITHUB_OUTPUT"
      # Install from TestPyPI with fallback to PyPI for transitive deps
      - name: Install from TestPyPI (with retries)
        run: ci/install_from_testpypi.sh provide-uterm-cloudflare "${{ steps.ver.outputs.version }}"
      # Confirm the installed version matches the expected VERSION
      - name: Verify installed version
        run: ci/verify_installed_version.sh provide-uterm-cloudflare "${{ steps.ver.outputs.version }}"
      - name: Verify imports and entry points
        run: python scripts/verify_installed_package.py provide-uterm-cloudflare

  pypi-cloudflare:
    name: PyPI · provide-uterm-cloudflare
    needs: [verify-cloudflare, pypi-terminal]
    if: github.event_name == 'release' && startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist-provide-uterm-cloudflare
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          # Re-running a release must not die on files PyPI already has. Without
          # this, a re-run reaches PyPI, gets "file already exists", fails the job
          # -- and sign-and-release needs all three PyPI jobs, so the Sigstore
          # bundles and SLSA provenance for that version become unreachable. The
          # TestPyPI steps have carried this from the start; the PyPI ones did not,
          # which is what left 0.5.1 published but unsignable.
          #
          # It hides nothing: PyPI refuses to replace an existing file either way,
          # so the only behaviour this changes is fatal -> no-op.
          skip-existing: true

  # ── Sigstore signing + GitHub Release upload ─────────────────────────
  sign-and-release:
    name: Sign & upload to GitHub Release
    needs: [pypi-terminal, pypi-dependents, pypi-cloudflare]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    steps:
      # Download all build artifacts
      - name: Download all dists
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: dist-*
          path: dist/
          merge-multiple: true

      # Sign each artifact with Sigstore
      - name: Sign with Sigstore
        uses: sigstore/gh-action-sigstore-python@790bc6befb9d733738f18d8f895854b453640ec9  # v3.5.0
        with:
          inputs: >-
            dist/*.tar.gz
            dist/*.whl

      # Attach signed artifacts to the GitHub Release
      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release upload "$GITHUB_REF_NAME"
          dist/**
          --repo "$GITHUB_REPOSITORY"

  # ── SLSA Level 3 provenance attestation ──────────────────────────────
  #
  # The Sigstore step above proves "this blob was signed by the GHA OIDC
  # identity for this repo". SLSA provenance goes one level further:
  # cryptographically attests *which workflow file produced the artifact*
  # at *which source SHA*. That closes the gap where an attacker who
  # compromises the build environment could swap an artifact for a
  # similarly-signed but differently-produced binary.
  #
  # The reusable workflow is the canonical SLSA-3 generator.
  hash-artifacts:
    name: Hash artifacts for SLSA
    needs: [pypi-terminal, pypi-dependents, pypi-cloudflare]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      - name: Download all dists
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: dist-*
          path: dist/
          merge-multiple: true

      # Compute the base64-encoded SHA256-hash manifest the SLSA generator
      # expects as its `base64-subjects` input.
      - name: Hash dists
        id: hash
        run: |
          cd dist
          echo "hashes=$(sha256sum *.whl *.tar.gz | base64 -w0)" >> "$GITHUB_OUTPUT"

  provenance:
    name: SLSA Level 3 provenance
    needs: [hash-artifacts]
    if: github.event_name == 'release'
    permissions:
      actions: read
      id-token: write
      contents: write
    # v2.0.0 — reusable workflow refs MUST use a tag (not a SHA) per GitHub
    # rules. SLSA project signs the v2.0.0 tag with their release key.
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.hash-artifacts.outputs.hashes }}
      # Attach the resulting .intoto.jsonl provenance file to the GitHub
      # Release alongside the signed wheels and sdist.
      upload-assets: true
      provenance-name: provide-uterm-workspace.intoto.jsonl

  dry-run:
    name: Dry run release artifacts
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.dry-run == true
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: dist-*
          path: dist/
          merge-multiple: true

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"

      - name: Check release artifacts
        run: |
          python -m pip install twine
          python -m twine check dist/*

      - name: Sign artifacts with Sigstore
        uses: sigstore/gh-action-sigstore-python@790bc6befb9d733738f18d8f895854b453640ec9  # v3.5.0
        with:
          inputs: >-
            dist/*.tar.gz
            dist/*.whl
