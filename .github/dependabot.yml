# Dependabot configuration — weekly, batched.
#
# Every ecosystem lands on Monday morning, and patch/minor bumps are grouped so
# a week's transitive churn arrives as one PR per ecosystem rather than one per
# package. That batching is the whole point: the noise that made this
# unbearable was volume and frequency, not currency. A daily cadence, or an
# ungrouped one, produces a queue nobody reads and stale deps anyway.
#
# Security updates are a separate Dependabot feature with their own internal
# limit (10) and ignore the limits below entirely, so advisory-driven PRs land
# regardless of cadence — keeping the supply-chain gap in
# docs/security-considerations.md §1 closed.
#
# Major bumps are deliberately left out of every group: they arrive as their
# own PRs because they are the ones that need reading.

version: 2
updates:
  # Python: the canonical pyproject.toml at the repo root.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "America/Los_Angeles"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "deps"
      include: "scope"
    # Group all transitive bumps together so the PR queue doesn't explode.
    groups:
      transitive:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"

  # npm: workspace root. Covers the root package.json devDependencies plus the
  # shared package-lock.json, so transitive bumps for the whole npm workspace
  # (frontend + app) and base-tooling deps land here. Per-workspace entries
  # below still target their own package.json direct deps.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "America/Los_Angeles"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "javascript"
    commit-message:
      prefix: "deps"
      include: "scope"
    groups:
      transitive:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"

  # npm: frontend bundle in packages/provide-uterm-app.
  - package-ecosystem: "npm"
    directory: "/packages/provide-uterm-app"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "America/Los_Angeles"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "javascript"
    commit-message:
      prefix: "deps"
      include: "scope"
    groups:
      transitive:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"

  # npm: Cloudflare Worker wrangler config.
  - package-ecosystem: "npm"
    directory: "/packages/provide-uterm-cloudflare"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "America/Los_Angeles"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "javascript"
    commit-message:
      prefix: "deps"
      include: "scope"
    groups:
      transitive:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"

  # GitHub Actions: keeps workflow action versions current. Closes the
  # "GHA workflow pinning" gap in docs/security-considerations.md §9.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "America/Los_Angeles"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "ci"
      include: "scope"
    # Every workflow here pins actions by commit SHA, so an ungrouped run would
    # open one PR per action per week.
    groups:
      actions:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"

  # Docker base-image (digest) bumps for the reference server image
  # (docker/Dockerfile.server) and the Cloudflare Worker image
  # (docker/Dockerfile.cf). Both Dockerfiles live under docker/, so the
  # docker ecosystem scanning this directory picks up every FROM in both —
  # keeping node:* / python:* base tags current as new CVE-fix images ship.
  - package-ecosystem: "docker"
    directories:
      - "/docker"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "America/Los_Angeles"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "docker"
      include: "scope"
    # Patch only, unlike every other group here. These tags track language
    # runtimes, where Dependabot's "minor" is a whole new interpreter: grouping
    # minor swept python:3.11-slim -> python:3.14-slim into a routine batch on
    # the first run. A base-image change that moves the runtime three versions
    # is a decision, not churn, so it arrives on its own.
    groups:
      base-images:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "patch"

  # Go: the client/server implementation in packages/provide-uterm-go. This had
  # no entry at all, which meant Dependabot never scanned go.mod — not for
  # routine bumps and not for advisories either, since security updates only
  # reach ecosystems listed here.
  - package-ecosystem: "gomod"
    directory: "/packages/provide-uterm-go"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "America/Los_Angeles"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "go"
    commit-message:
      prefix: "deps"
      include: "scope"
    groups:
      transitive:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"

  # NuGet: the C# implementation. Same omission as Go — unscanned until now.
  # Note the restore is not pinned: there is no packages.lock.json in any of the
  # five .csproj projects, so a resolved graph is whatever the registry serves
  # at restore time. Dependabot can raise a direct-dependency advisory here, but
  # transitive pinning needs the lock files.
  # There is no .sln at the package root, so the projects are named by glob
  # rather than trusting recursive discovery from a bare directory — an entry
  # that resolves to no project files fails silently, which is the failure this
  # whole entry exists to avoid.
  - package-ecosystem: "nuget"
    directories:
      - "/packages/provide-uterm-csharp/src/*"
      - "/packages/provide-uterm-csharp/tests/*"
      - "/packages/provide-uterm-csharp/cmd/*"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "America/Los_Angeles"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "csharp"
    commit-message:
      prefix: "deps"
      include: "scope"
    groups:
      transitive:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"
