# Dependabot configuration — one PR a week, across every ecosystem.
#
# Every ecosystem below joins the `weekly` multi-ecosystem group, so a week's
# version updates for Python, npm, GitHub Actions, Docker, Go and NuGet arrive
# as a single PR on Monday morning rather than one PR per ecosystem (or, before
# grouping, one per package). The volume, not the currency, was what made the
# queue unreadable: on 2026-09-22 a single config change produced seven PRs in
# a minute, all of which had to be superseded by hand.
#
# What that trades away: majors are no longer split out into PRs of their own,
# and one update that breaks CI turns the whole week's PR red. When that
# happens, push the fix to the Dependabot branch, or add an `ignore` for the
# offending version below (with the reason) and let the rest land.
#
# Version choices that need a decision rather than a batch are held back with
# per-ecosystem `ignore` rules, each with its reason: base-image runtime moves
# (Docker minor/major), vitest majors for the TS port, and a vulnerable grpc.
#
# Security updates are a separate Dependabot feature with their own internal
# limit and schedule, and are not part of the weekly group: advisory-driven
# PRs still land as soon as an advisory is published, keeping the
# supply-chain gap in docs/security-considerations.md §1 closed.

version: 2

multi-ecosystem-groups:
  weekly:
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "America/Los_Angeles"
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps"

updates:
  # Python: the uv workspace at the repo root. The `uv` ecosystem (not `pip`)
  # so updates rewrite uv.lock along with pyproject.toml; the `pip` ecosystem
  # only raised pyproject floors and left the lock to be re-resolved by hand.
  - package-ecosystem: "uv"
    directory: "/"
    multi-ecosystem-group: "weekly"
    patterns: ["*"]
    labels:
      - "python"

  # npm: workspace root. Covers the root package.json devDependencies plus the
  # shared package-lock.json, so every npm workspace member (app, frontend, ts)
  # is covered by this one entry.
  - package-ecosystem: "npm"
    directory: "/"
    multi-ecosystem-group: "weekly"
    patterns: ["*"]
    labels:
      - "javascript"
    # vitest majors are moved by hand, per workspace. packages/provide-uterm-ts
    # stays on vitest 4: under vitest 5, @stryker-mutator/vitest-runner 10.0.0
    # records no per-test coverage ("covered 0"), so ~3100 mutants report as
    # survived without being tested and the TS mutation gate fails. The app and
    # frontend workspaces are already on 5. Drop this once the runner supports 5.
    ignore:
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitest/coverage-v8"
        update-types: ["version-update:semver-major"]

  # No entry for /packages/provide-uterm-app, /packages/provide-uterm-frontend
  # or /packages/provide-uterm-ts: all three are npm workspace members resolved
  # through the single root package-lock.json, so the root entry above already
  # covers their direct dependencies. A second entry does not add coverage, it
  # duplicates it -- the first run opened two PRs for jsdom 29.1.1 -> 30.0.1
  # and two more for @testing-library/jest-dom -> 7.0.1, one from each scan of
  # the same dependency.
  #
  # provide-uterm-cloudflare is not a workspace member and has no lockfile of
  # its own, so it does need the entry below.

  # npm: Cloudflare Worker wrangler config.
  - package-ecosystem: "npm"
    directory: "/packages/provide-uterm-cloudflare"
    multi-ecosystem-group: "weekly"
    patterns: ["*"]
    labels:
      - "javascript"

  # GitHub Actions: keeps workflow action versions current. Closes the
  # "GHA workflow pinning" gap in docs/security-considerations.md §9. Every
  # workflow pins actions by commit SHA, so each bump rewrites a SHA + comment.
  - package-ecosystem: "github-actions"
    directory: "/"
    multi-ecosystem-group: "weekly"
    patterns: ["*"]
    labels:
      - "ci"

  # Docker base-image (digest) bumps for the images under docker/, keeping
  # node:* / python:* base tags current as new CVE-fix images ship.
  - package-ecosystem: "docker"
    directories:
      - "/docker"
    multi-ecosystem-group: "weekly"
    patterns: ["*"]
    labels:
      - "docker"
    # Patch only. These tags track language runtimes, where Dependabot's
    # "minor" is a whole new interpreter: grouping minor swept
    # python:3.11-slim -> python:3.14-slim into a routine batch on the first
    # run. A base-image change that moves the runtime is a decision, not churn,
    # so it is made by hand.
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"

  # Go: the client/server implementation in packages/provide-uterm-go. This had
  # no entry at all once, which meant Dependabot never scanned go.mod — not for
  # routine bumps and not for advisories either, since security updates only
  # reach ecosystems listed here.
  - package-ecosystem: "gomod"
    directory: "/packages/provide-uterm-go"
    multi-ecosystem-group: "weekly"
    patterns: ["*"]
    labels:
      - "go"
    # grpc 1.84.0 is inside CVE-2026-84445 (HIGH, DoS; fixed in 1.83.2 and the
    # 1.85 line). The transitive group proposed it on 2026-09-21 (#114), which
    # would have traded a patched release for a vulnerable one. Drop this once
    # 1.85.0 is out.
    ignore:
      - dependency-name: "google.golang.org/grpc"
        versions: ["1.84.x"]

  # NuGet: the C# implementation. Note the restore is not pinned: there is no
  # packages.lock.json in any of the five .csproj projects, so a resolved graph
  # is whatever the registry serves at restore time. Dependabot can raise a
  # direct-dependency advisory here, but transitive pinning needs the lock files.
  # There is no .sln at the package root, so the projects are named by glob
  # rather than trusting recursive discovery from a bare directory — an entry
  # that resolves to no project files fails silently, which is the failure this
  # whole entry exists to avoid.
  - package-ecosystem: "nuget"
    directories:
      - "/packages/provide-uterm-csharp/src/*"
      - "/packages/provide-uterm-csharp/tests/*"
      - "/packages/provide-uterm-csharp/cmd/*"
    multi-ecosystem-group: "weekly"
    patterns: ["*"]
    labels:
      - "csharp"
