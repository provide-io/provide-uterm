# Dependabot configuration — SECURITY UPDATES ONLY.
#
# Routine version-update PRs are DISABLED via open-pull-requests-limit: 0 on
# every ecosystem: the batched weekly bumps were too noisy. Dependabot SECURITY
# updates are a separate feature with their own internal limit (10) and are
# UNAFFECTED by the 0 limit, so advisory-driven PRs still land — keeping the
# supply-chain gap in docs/security-considerations.md §1 closed without the
# routine churn. Routine bumps are now applied manually (uv lock --upgrade for
# Python; npm / docker as needed).
#
# The per-ecosystem entries are kept (not deleted) so security updates still
# know which directories/registries to scan. Raise a limit above 0 to
# temporarily re-enable scheduled version updates for that ecosystem.

version: 2
updates:
  # Python: the canonical pyproject.toml at the repo root.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "America/Los_Angeles"
    open-pull-requests-limit: 0  # security updates only
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "deps"
      include: "scope"
    # Group all transitive bumps together so the PR queue doesn't explode.
    groups:
      transitive:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"

  # npm: workspace root. Covers the root package.json devDependencies plus the
  # shared package-lock.json, so transitive bumps for the whole npm workspace
  # (frontend + app) and base-tooling deps land here. Per-workspace entries
  # below still target their own package.json direct deps.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "America/Los_Angeles"
    open-pull-requests-limit: 0  # security updates only
    labels:
      - "dependencies"
      - "javascript"
    commit-message:
      prefix: "deps"
      include: "scope"
    groups:
      transitive:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"

  # npm: frontend bundle in packages/provide-uterm-app.
  - package-ecosystem: "npm"
    directory: "/packages/provide-uterm-app"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "America/Los_Angeles"
    open-pull-requests-limit: 0  # security updates only
    labels:
      - "dependencies"
      - "javascript"
    commit-message:
      prefix: "deps"
      include: "scope"
    groups:
      transitive:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"

  # npm: Cloudflare Worker wrangler config.
  - package-ecosystem: "npm"
    directory: "/packages/provide-uterm-cloudflare"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "America/Los_Angeles"
    open-pull-requests-limit: 0  # security updates only
    labels:
      - "dependencies"
      - "javascript"
    commit-message:
      prefix: "deps"
      include: "scope"

  # GitHub Actions: keeps workflow action versions current. Closes the
  # "GHA workflow pinning" gap in docs/security-considerations.md §9.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "America/Los_Angeles"
    open-pull-requests-limit: 0  # security updates only
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "ci"
      include: "scope"

  # Docker base-image (digest) bumps for the reference server image
  # (docker/Dockerfile.server) and the Cloudflare Worker image
  # (docker/Dockerfile.cf). Both Dockerfiles live under docker/, so the
  # docker ecosystem scanning this directory picks up every FROM in both —
  # keeping node:* / python:* base tags current as new CVE-fix images ship.
  - package-ecosystem: "docker"
    directories:
      - "/docker"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "America/Los_Angeles"
    open-pull-requests-limit: 0  # security updates only
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "docker"
      include: "scope"
