scheme=="http" branch). In that case host becomes "" (orig) or "xxxx" (mutant) after \
.lower(); NEITHER is in _LOOPBACK_HOSTS and neither ends with ".localhost", so both \
take the identical final `raise ValueError(... must use https://...)`. The fallback \
value is never observable downstream — behaviorally equivalent."""

