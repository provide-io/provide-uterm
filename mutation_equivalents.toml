reason = """\
NullRecordingStore.get_path always returns None after discarding session_id. \
`_ = session_id` → `_ = None` cannot change the None return."""

[[equivalent]]
mutant = "provide.uterm.recording.xǁInMemoryRecordingStoreǁget_path__mutmut_1"
reason = """\
InMemoryRecordingStore has no local file path; get_path always returns None after \
`_ = session_id`. Replacing that discard with `_ = None` is behaviorally equivalent."""

[[equivalent]]
mutant = "provide.uterm.recording.xǁLocalFileRecordingStoreǁget_entries__mutmut_8"
reason = """\
`skip = 0 if offset is None else max(0, offset)` → `skip = 1 if offset is None ...`. \
When offset is None the body takes the tail branch (`if offset is not None:` is false) \
and never reads `skip`. When offset is not None the ternary uses the else arm \
`max(0, offset)` unchanged. The mutated then-arm is dead — equivalent."""

