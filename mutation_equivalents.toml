# These ids are FRAGILE and are not content-addressed. mutmut numbers mutants
# sequentially within the enclosing function, so an edit anywhere earlier in
# this 1000-mutant factory renumbers everything after it and silently moves an
# excuse onto the wrong mutant. That happened on 2026-08-15: the whole
# recording_download family shifted by three, the old ids went stale, and the
# real ``media_type`` drop resurfaced as a survivor at a new number. The Go, C#
# and TS gates key their allowlists on mutation CONTENT for exactly this
# reason; mutmut's results output exposes no per-mutant content, so the same
# fix does not port over. Read the stale-entry warnings — a stale id next to a
# new survivor in the same function is a renumbering, not a regression, and
# `mutmut show <id>` is the only way to confirm which is which.
#
