#
# Documented equivalent-mutant allowlist for the strict mutation gate.
#
# scripts/run_mutation_gate.py enforces killed==100 (every mutant killed). Some
# mutants are *equivalent* — the mutated code is behaviorally identical to the
# original, so NO test can ever distinguish them (e.g. swapping an operand that
# is never read before it is overwritten, or a codec-name case flip on an ASCII
# string). Such mutants survive forever and would pin an otherwise-perfect file
# below 100%, which is exactly why several perimeter files were deferred.
#
# Each [[equivalent]] entry below is SUBTRACTED from the killed==N denominator,
# so a file whose ONLY residual survivors are documented equivalents can still be
# enforced (every NON-equivalent mutant must still be killed). Rules:
#   - `mutant` MUST be the id exactly as `mutmut results` prints it
#     (e.g. "provide.uterm.server.bridge.hub.lease.x_<method>__mutmut_12").
#   - `reason` MUST justify WHY the mutation is behaviorally equivalent. "I could
#     not write a test" is NOT a reason — that is a missing test, not equivalence.
#   - `survived`/`suspicious` are excusable for a listed mutant; a `no tests`
#     (coverage gap) or `skipped` mutant is NEVER excusable. A `timeout` is
#     excusable ONLY for a listed (proven-equivalent) mutant: such a mutant is
#     unkillable, so mutmut's wall-clock timeout on it (it SIGXCPU's a run past
#     (estimated_test_time + 1) * 15s — a loaded CI runner crosses that for a
#     small-estimate mutant) is the same fact as `survived`, just surfaced by CI
#     timing. A timeout on a NON-listed mutant still fails the gate (it could hide
#     a real kill gap). See EXCUSABLE_STATES in scripts/run_mutation_gate.py.
#   - A stale entry (its mutant was later killed, or renumbered by a source edit)
#     is reported as a WARNING by the gate; it never weakens enforcement, because
#     a renumbered equivalent reappears as a new unexcused survivor.
#
# Add entries as files are re-enabled into [tool.mutmut].source_paths. Keep the
# justification specific enough that a reviewer can confirm the equivalence.

[[equivalent]]
mutant = "provide.uterm.tunnel.token_hash.x_hash_token__mutmut_9"
reason = """\
Codec-name case flip: hashlib.blake2b(plain.encode("utf-8")) -> encode("UTF-8"). \
Python's codec registry lookup is case-insensitive (encodings.normalize_encoding), \
so "utf-8" and "UTF-8" select the identical codec and produce byte-identical output. \
No test can distinguish them — behaviorally equivalent."""

[[equivalent]]
mutant = "provide.uterm.recording.xǁNullRecordingStoreǁget_entries__mutmut_1"
reason = """\
NullRecordingStore discards all writes and get_entries() always returns an empty list. \
The public signature keeps the same limit/offset/event parameters as the real stores \
for RecordingStore compatibility, but those parameters are intentionally ignored. \
Changing the default limit from 200 to 201 cannot change any runtime result."""

