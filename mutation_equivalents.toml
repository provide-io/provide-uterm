# --- webhooks.py (SSRF guard + EventBus delivery) -------------------------
# Re-enabled at killed==100 via a fully network-mocked kill suite
# (test_webhooks_mutation_killing.py): the real socket.getaddrinfo / HTTP client are
# never driven in a mutmut-forked child, which removes the 307/406-mutant
# segfault that deferred this file. Six residual equivalents:
#
# (a) Four trampoline-masked default-arg mutations (the documented auth.py class):
# the generated dispatcher keeps the ORIGINAL `allow_loopback_destinations=False`
# signature, binds it, and forwards it EXPLICITLY to the variant, so the variant's
# mutated `=True` default is dead code no caller reaches. (The real False default IS
# regression-tested — e.g. localhost denied by default / _address_allowed("127.0.0.1")
# is False.)
