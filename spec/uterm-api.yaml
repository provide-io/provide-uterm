# Canonical public API surface for provide-uterm's session + hijack-client
# layer -- the surfaces a Python, Go, or C# integrator actually calls day to
# day. Each language MUST export an equivalent of every `required: true`
# symbol, named per naming_conventions below. Modeled on provide-telemetry's
# spec/telemetry-api.yaml (see that repo for the pattern this was copied
# from).
#
# Symbol fields:
#   name:       for kind: function, a snake_case canonical name (transformed
#               per naming_conventions for Go); for kind: type, the literal
#               PascalCase name used as-is in BOTH languages (Python classes
#               are PascalCase too, so no transform applies).
#   kind:       function | type
#   required:   true  -> missing symbol is a conformance error for every
#                        language covered by this spec (currently python, go)
#               false -> symbol is optional (see note for why)
#   note:       human-readable rationale, especially for required: false
#               entries and any accepted cross-language behavioral/calling
#               convention difference.

spec_version: "1"

naming_conventions:
  python: snake_case
  go: PascalCase
  csharp: PascalCase

api:
  # provide.uterm.transport_session / telnet_session / ws_session (Python)
  # <-> packages/provide-uterm-go/termsession (Go).
  session:
    - name: TransportSession
      kind: type
      required: true
      note: "base session type wrapping any transport + terminal emulator"
    - name: connect
      kind: function
      required: true
      note: >-
        Lifecycle method that opens the underlying transport (Python:
        TransportSession.connect; Go: TransportSession.Connect). The
        connect_telnet/connect_ws module helpers wrap it for the common
        transports.
    - name: connect_telnet
      kind: function
      required: true
    - name: connect_ws
      kind: function
      required: true
    - name: TelnetSession
      kind: type
      required: false
      note: >-
        Python has a distinct TelnetSession subclass; Go collapses
        telnet/websocket sessions into TransportSession +
        NewTelnetSession/TelnetOptions instead of a distinct type. Accepted
        structural difference, not a gap -- ConnectTelnet/NewTelnetSession
        cover the same capability.
    - name: WebSocketSession
      kind: type
      required: false
      note: "Same rationale as telnet_session above (NewWSSession/WSOptions)."
    - name: snapshot
      kind: function
      required: true
      note: "method on the session type"
    - name: ansi_screen
      kind: function
      required: true
    - name: send
      kind: function
      required: true
    - name: send_expect
      kind: function
      required: true
    - name: wait_for_update
      kind: function
      required: true
    - name: is_connected
      kind: function
      required: true
    - name: screen_change_seq
      kind: function
      required: true
    - name: update_seq
      kind: function
      required: true
      note: >-
        Alias for screen_change_seq, kept for cross-language parity (Python:
        "Alias used by some callers"; Go: TransportSession.UpdateSeq).
    - name: wait_for_screen_change
      kind: function
      required: true
      note: >-
        "Wait for any next update" is spelled since=None in Python and a
        negative since in Go -- an accepted, documented calling-convention
        difference (WaitForScreenChange is part of Go's shared
        session.Session interface with multiple implementers, so it stays a
        plain int rather than a pointer/optional type). Not a gap.
    - name: add_watch
      kind: function
      required: true
    - name: add_control_frame_watch
      kind: function
      required: true
    - name: close
      kind: function
      required: true
  # provide.uterm.client.hijack.HijackClient (Python) <->
  # packages/provide-uterm-go/client.HijackClient (Go).
  hijack_client:
    - name: HijackClient
      kind: type
      required: true
    - name: acquire
      kind: function
      required: true
    - name: heartbeat
      kind: function
      required: true
    - name: send
      kind: function
      required: true
    - name: step
      kind: function
      required: true
    - name: release
      kind: function
      required: true
    - name: snapshot
      kind: function
      required: true
    - name: events
      kind: function
      required: true
    - name: set_input_mode
      kind: function
      required: true
    - name: disconnect_worker
      kind: function
      required: true
    - name: health
      kind: function
      required: true
    - name: list_sessions
      kind: function
      required: true
    - name: get_session
      kind: function
      required: true
    - name: session_snapshot
      kind: function
      required: true
    - name: session_events
      kind: function
      required: true
    - name: watch_session_events
      kind: function
      required: true
    - name: set_session_mode
      kind: function
      required: true
    - name: connect_session
      kind: function
      required: true
    - name: disconnect_session
      kind: function
      required: true
    - name: quick_connect
      kind: function
      required: true
    - name: post
      kind: function
      required: true
  # provide.uterm.emulator.TerminalEmulator (Python) <->
  # packages/provide-uterm-go/emulator.TerminalEmulator (Go). The transport-
  # agnostic terminal state machine both sessions embed: feed it bytes, read
  # back a snapshot / ANSI screen. Public and parity-guaranteed in both.
  emulator:
    - name: TerminalEmulator
      kind: type
      required: true
      note: "transport-agnostic terminal state machine embedded by every session"
    - name: process
      kind: function
      required: true
      note: "feed raw bytes into the emulator (Python: process; Go: Process)"
    - name: get_snapshot
      kind: function
      required: true
      note: "structured screen snapshot (Python: get_snapshot; Go: GetSnapshot)"
    - name: ansi_screen
      kind: function
      required: true
      note: "ANSI-rendered screen text (Python: ansi_screen; Go: ANSIScreen)"
    - name: reset
      kind: function
      required: true
    - name: resize
      kind: function
      required: true
    - name: get_raw_tail
      kind: function
      required: false
      note: >-
        Both languages expose the raw-output tail, but the names diverge
        (Python: get_raw_tail; Go: RawTail, not GetRawTail), so this is an
        accepted naming difference rather than an enforced parity symbol.
  # provide.uterm.server.graphical_targets (Python) <->
  # packages/provide-uterm-go/graphical (Go) <->
  # Provide.Uterm/Server/GraphicalTargets.cs (C#). The tenant-scoped graphical-
  # console model + registry: a GraphicalTargetDefinition (memory/rfb) held in
  # an InMemoryGraphicalTargetRegistry that gates every read/write by a
  # GraphicalTargetScope derived from the authenticated principal's tenant. The
  # wire shape (snake_case JSON keys, error codes, endpoint parsing) is parity-
  # guaranteed across all three ports.
  graphical:
    - name: GraphicalTargetDefinition
      kind: type
      required: false
      note: >-
        The console-definition model. Python/C# name it
        GraphicalTargetDefinition; Go collapses it to graphical.Definition.
        Accepted naming difference -- the method surface (public_copy) is
        enforced below instead of the type name.
    - name: InMemoryGraphicalTargetRegistry
      kind: type
      required: false
      note: >-
        The tenant-scoped registry. Python/C# name it
        InMemoryGraphicalTargetRegistry; Go names it graphical.InMemoryRegistry.
        Accepted naming difference -- the CRUD method surface is enforced below.
    - name: GraphicalTargetScope
      kind: type
      required: false
      note: >-
        The tenant-isolation capability. Python/C# name it GraphicalTargetScope;
        Go names it graphical.Scope (and C# implements it as a readonly struct,
        which the class-only C# extractor does not scan). Accepted difference --
        permits is enforced below.
    - name: public_copy
      kind: function
      required: true
      note: >-
        Strip every secret from a definition before it crosses the REST
        boundary (Python: public_copy; Go/C#: PublicCopy).
    - name: parse_rfb_endpoint
      kind: function
      required: true
      note: >-
        Parse/normalize an rfb endpoint (host:port | rfb://host:port | dns:///
        prefix). Python module function; Go top-level func; C# static
        GraphicalTargetParsing.ParseRfbEndpoint.
    - name: permits
      kind: function
      required: true
      note: "scope check: does this tenant/system scope permit a target's tenant"
    - name: is_valid
      kind: function
      required: false
      note: >-
        Scope validity check (exactly one of system/tenant). A method in Go
        (Scope.IsValid) but a PROPERTY in Python (@property is_valid) and C#
        (bool IsValid => ...). The C# extractor matches methods only, so this is
        required: false rather than a false miss. The behavior is identical in
        all three.
    - name: get
      kind: function
      required: true
      note: "registry: fetch one tenant-permitted target (Python get; Go/C# Get)"
    - name: list
      kind: function
      required: true
      note: "registry: list tenant-permitted targets (Python list; Go/C# List)"
    - name: create
      kind: function
      required: true
    - name: update
      kind: function
      required: true
    - name: delete
      kind: function
      required: true
    - name: add_static
      kind: function
      required: true
      note: "seed an immutable system target (Python add_static; Go/C# AddStatic)"
  # provide.uterm.server.api_keys + bridge.identity (Python) <->
  # packages/provide-uterm-go/serverauth (Go) <-> Provide.Uterm/ServerAuth (C#).
  # The tenant-scoped API-key store methods + the resolved Principal. Note:
  # Principal.tenant_id / ApiKeyRecord.TenantId are DATA FIELDS and the tenant-
  # id validation regex is a CONSTANT -- neither is method-extractable, so their
  # cross-language parity is verified by the wire-contract grep audit, not this
  # method-level spec.
  tenant:
    - name: Principal
      kind: type
      required: true
      note: >-
        Resolved browser/API principal, named Principal in all three ports. Its
        tenant_id/TenantID field carries the multi-tenancy scope (verified via
        wire parity, not method extraction).
    - name: ApiKeyStore
      kind: type
      required: true
      note: "in-memory API-key registry, named ApiKeyStore in all three ports"
    - name: create_for_tenant
      kind: function
      required: true
      note: >-
        Mint an API key bound to a validated canonical tenant id (Python
        create_for_tenant; Go/C# CreateForTenant).
    - name: list_keys_for_tenant
      kind: function
      required: true
      note: "list a tenant's non-revoked keys (Python list_keys_for_tenant; Go/C# ListKeysForTenant)"
    - name: revoke_for_tenant
      kind: function
      required: true
      note: "revoke a key only if it belongs to the tenant (Python revoke_for_tenant; Go/C# RevokeForTenant)"
    - name: canonical_tenant_id
      kind: function
      required: false
      note: >-
        Trim/validate a tenant id against the shared regex, returning None for
        blank/invalid. A public module function in Python (api_keys) and a
        public top-level func in Go (serverauth.CanonicalTenantID), but only a
        PRIVATE per-file helper in C# (ApiKeys.cs / LocalIdentity.cs), so it is
        required: false rather than a false miss. Identical behavior in all
        three.
