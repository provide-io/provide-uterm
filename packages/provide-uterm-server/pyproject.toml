[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "provide-uterm-server"
dynamic = ["version"]
description = "Server, bridge, tunnel, and gateway for provide-uterm"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
dependencies = [
    "provide-uterm>=0.4.0",
    "provide-uterm-client>=0.4.0",
]

[project.optional-dependencies]
server = ["fastapi>=0.110", "uvicorn>=0.24", "pyjwt>=2.9", "websockets>=12.0"]
cli = ["fastapi>=0.110", "uvicorn>=0.24", "websockets>=12.0", "textual>=0.50", "httpx>=0.27"]
tunnel = ["httpx>=0.27", "uvicorn>=0.24", "websockets>=16.0", "fastapi>=0.110"]
gateway = ["asyncssh>=2.22.0", "websockets>=16.0"]
# Optional: PatternDetector + built-in rules + annotation models. Lives in the
# separate provide-uterm-annotation package so deployments that don't need
# pattern detection can ship a leaner wheel. The factory imports it lazily and
# raises a friendly RuntimeError if it isn't installed.
annotation = ["provide-uterm-annotation>=0.4.0"]
all = [
    "fastapi>=0.110", "uvicorn>=0.24", "pyjwt>=2.9", "websockets>=16.0",
    "textual>=0.50", "httpx>=0.27", "asyncssh>=2.22.0",
    "provide-uterm-annotation>=0.4.0",
    # core's emulator dep — declared here so `uv sync --extra all` installs it
    # from the lock instead of a side-channel `uv pip install pyte` that
    # escapes UV_FROZEN (unpinned, hash-unverified).
    "pyte>=0.8",
]
dev = [
    "pytest>=9.0",
    "pytest-asyncio>=1.3",
    "pytest-cov>=7.0",
    "pytest-timeout>=2.4.0",
    "pytest-randomly>=3.15.0",
    "pytest-textual-snapshot>=1.0.0",
    "mypy>=1.19",
    "ruff>=0.15",
    "fastapi>=0.110",
    "uvicorn>=0.24",
    "pyjwt>=2.9",
    "websockets>=16.0",
    "textual>=0.50",
    "httpx>=0.27",
    "asyncssh>=2.22.0",
    "Pillow>=10.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "provide-uterm-annotation>=0.4.0",
]

[project.scripts]
uterm = "provide.uterm.cli:main"

[tool.setuptools.dynamic]
version = {file = "VERSION"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"provide.uterm" = ["py.typed"]
"provide.uterm.server" = [
    "frontend/**",
    "frontend/**/*",
]

[tool.pytest.ini_options]
consider_namespace_packages = true
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = [
    "ignore:websockets\\.legacy is deprecated; see .*:DeprecationWarning:websockets\\.legacy",
    "ignore:websockets\\.server\\.serve is deprecated:DeprecationWarning",
    "ignore:websockets\\.server\\.WebSocketServerProtocol is deprecated:DeprecationWarning:uvicorn\\.protocols\\.websockets\\.websockets_impl",
    "ignore:remove second argument of ws_handler:DeprecationWarning:websockets\\.legacy\\.server",
    "ignore:This process \\(pid=.*\\) is multi-threaded, use of forkpty\\(\\) may lead to deadlocks in the child\\.:DeprecationWarning:pty",
]
markers = [
    "playwright: browser-based UI tests (deselected by default, run with -m playwright)",
    "slow: slow tests >10s (deselected by default)",
    "unit: fast unit-level tests",
    "mutant: mutation-testing harness tests (run by mutation gate only)",
]
addopts = [
    "--import-mode=importlib",
    "-v",
    "--strict-markers",
    "--strict-config",
    "--tb=short",
    "-ra",
    "-m",
    "not playwright and not slow",
    "--cov=provide.uterm.server.bridge",
    "--cov=provide.uterm.server",
    "--cov=provide.uterm.tunnel",
    "--cov=provide.uterm.gateway",
    "--cov-branch",
    "--cov-report=term-missing",
    "--cov-fail-under=100",
]

[tool.coverage.run]
source = [
    "provide.uterm.server.bridge",
    "provide.uterm.server",
    "provide.uterm.tunnel",
    "provide.uterm.gateway",
]
omit = ["tests/*"]
branch = true

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = false
partial_branches = [
    "pragma: no branch",
    "if not msg.get\\(\"more_body\"",
    "elif msg_type ==",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "C4", "SIM", "TCH", "PTH",
    "DTZ", "ICN", "ISC", "PERF", "PIE", "RET", "RSE", "TID", "S", "ARG", "RUF",
]
# Aligned with the workspace-root ruff config in ../../pyproject.toml so the
# subproject doesn't surface lint warnings the root deliberately ignores.
ignore = [
    "E501",  # line-too-long
    "S101",  # use-of-assert
    "S104",  # hardcoded-bind-all-interfaces
    "S108",  # hardcoded-temp-file
    "S110",  # try-except-pass
    "S112",  # try-except-continue
    "S311",  # suspicious-non-cryptographic-random
    "S603",  # subprocess-without-shell
    "S607",  # start-process-with-partial-path
    "S604",  # call-with-shell-equals-true
    "F811",  # redefined-while-unused
    "N806",  # non-lowercase-variable-in-function
    "N814",  # camelcase-imported-as-constant
    "B017",  # assert-raises-exception
    "SIM105",  # suppressible-exception
    "SIM117",  # multiple-with-statements
    "ARG001",  # unused-function-argument
    "ARG002",  # unused-method-argument — protocol interfaces
    "PTH108",  # os-unlink — stylistic
    "SIM108",  # ternary-operator — stylistic
    "PERF401",  # manual-list-comprehension
]

[tool.ruff.lint.isort]
known-first-party = ["provide"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "RUF022"]
"tests/**/*.py" = ["E402", "B905", "S101", "S105", "S106", "S110", "S603", "S607", "ARG", "TCH", "RUF003", "RUF012", "RUF015", "RUF043", "RUF059"]

[tool.mypy]
python_version = "3.11"
strict = true
namespace_packages = true
explicit_package_bases = true
mypy_path = ["src", "../provide-uterm-annotation/src"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true

[tool.uv.sources]
provide-uterm-annotation = { workspace = true }
