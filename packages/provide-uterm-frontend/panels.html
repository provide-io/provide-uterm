<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>provide-uterm · Panels</title>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@6.0.0/css/xterm.css" integrity="sha384-n2n7twoohnW+d3myBKaUgl7DSiwidw6MkQy9oesGzkPpMjejKRR3XlnD+5yCdtBD" crossorigin="anonymous">
  <link rel="stylesheet" href="static/panels.css">
</head>
<body>
  <div class="panels-shell">
    <header class="panels-topbar">
      <div class="brand-row">
        <div class="brand-mark" aria-hidden="true"></div>
        <div>
          <div class="eyebrow">provide-uterm</div>
          <h1>Nautilus panels</h1>
        </div>
      </div>
      <div class="topbar-actions">
        <span class="pane-count">panes <b id="panels-count">0</b></span>
        <button type="button" id="panels-nautilus" class="topbar-btn" title="Spiral a fresh VNC + terminal unit">
          ◈ split (nautilus)
        </button>
      </div>
    </header>
    <main id="panels-stage" class="panels-stage" aria-label="Tiled VNC and terminal panes"></main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@6.0.0/lib/xterm.js" integrity="sha384-f/1U6Z9wM4D71a5eRXEZnyOTMOvjqxr2XLwh+Go1OvIl3L3tOcvUrzudnhbECwl4" crossorigin="anonymous"></script>
