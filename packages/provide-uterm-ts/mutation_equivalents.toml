[[equivalent]]
file = "src/egress/egress.ts"
line = 191
column = 7
mutator = "ConditionalExpression"
reason = """\
isSharedAddressSpace: `if (address.version !== 4) { return false; }` -> \
`if (false) {}`. This function is only ever reached from \
classifyEgressAddress's `isPrivate(subject) || isLinkLocal(subject) || \
isMulticast(subject) || isUnspecified(subject) || isReserved(subject) || \
isSharedAddressSpace(subject)` chain, and only for a `subject` that failed \
every earlier predicate in that chain (`||` short-circuits). Removing the \
version guard only matters if a v6 address can reach the numeric CGNAT check \
(`address.packed[0] === 100 && ...`) and have that check answer differently \
from `false`. But `packed[0] === 100` (0x64) means the address's first byte's \
top 3 bits are exactly "011" (0110_0100), which is precisely the range CPython \
mirrors as the IANA-reserved `6000::/3` block (`V6_RESERVED` in \
pycompat/ipaddress.ts) -- so *any* v6 address with `packed[0] === 100` is \
already caught by `isReserved` earlier in the `||` chain and never reaches \
`isSharedAddressSpace` at runtime at all. There is therefore no v6 input for \
which removing this guard changes the function's return value: it is either \
short-circuited away before this function runs, or (packed[0] !== 100) the \
numeric check answers `false` regardless of the guard."""

