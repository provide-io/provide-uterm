[[equivalent]]
file = "src/egress/webhook-url.ts"
line = 394
column = 47
mutator = "StringLiteral"
reason = """\
withDeadline: `reject(new Error('resolving webhook host ... timed out'))` -> \
`reject(new Error(''))`. This Error is constructed only to make Promise.race \
settle when the deadline wins; its `.message` is never read anywhere. The \
sole caller, resolveWebhookHost, wraps the whole `await withDeadline(...)` in \
a bare `try { ... } catch { throw new WebhookUrlError(UNRESOLVED); }` -- every \
property of the caught error, including its message, is discarded \
unconditionally in favor of the fixed UNRESOLVED string. withDeadline is a \
private, unexported function with this one call site, so there is no path by \
which a test (or any caller) could ever observe this string's content."""

[[equivalent]]
file = "src/ratelimit/ratelimit.ts"
line = 175
column = 34
mutator = "ConditionalExpression"
reason = """\
RateLimiter#mint: `this.#now === undefined ? {} : { now: this.#now }` -> \
`false ? {} : { now: this.#now }` (always takes the `{ now: this.#now }` \
branch). When `this.#now` actually is undefined, this passes \
`{ now: undefined }` to `new TokenBucket(rate, options)` instead of `{}`. \
TokenBucket's constructor reads `this.#now = options.now ?? monotonicNow` -- \
`options.now` is `undefined` in both `{}` and `{ now: undefined }` (an \
explicit `undefined` value is indistinguishable from an absent key under \
`??`), so the resolved clock is identical either way. No test can observe a \
difference between the two option objects because only the resolved value of \
`options.now` is ever read, never the object's own shape."""

