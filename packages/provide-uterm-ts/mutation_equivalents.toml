[[equivalent]]
file = "src/serverconfig/validators.ts"
line = 68
column = 54
mutator = "Regex"
reason = """\
requireSecureUrl: `parsed.hostname.toLowerCase().replace(/^\\[|\\]$/g, "")` \
with either anchor dropped (`/\\[|\\]$/` or `/^\\[|\\]/`). `parsed.hostname` \
comes from the WHATWG `URL` constructor, which guarantees a hostname is \
either bracket-free entirely or exactly one literal IPv6 address wrapped in \
a single opening `[` at position 0 and a single closing `]` at the very end \
(any other bracket placement makes the URL invalid and throws before \
`requireSecureUrl` ever sees a hostname). Dropping either anchor only widens \
where that single, already-uniquely-positioned bracket may be matched -- \
since there is exactly one `[` (always at the start) and exactly one `]` \
(always at the end) in any string this line ever receives, matching "the \
first `[` anywhere" or "the last `]` anywhere" removes the identical \
character the anchored pattern would have removed. No hostname `URL` can \
produce ever distinguishes the anchored and unanchored forms here."""

[[equivalent]]
file = "src/serverconfig/schema.ts"
line = 189
column = 62
mutator = "MethodExpression"
reason = """\
coerceInt's success branch: `Number(value.trim())` -> `Number(value)` (the \
`.trim()` on the *argument to Number* is dropped; the regex test on the \
previous line, `/^[+-]?\\d+$/.test(value.trim())`, is untouched and still \
requires the trimmed content to be a bare signed integer with no interior \
whitespace). ECMAScript's `ToNumber` on a string uses the same StrWhiteSpace \
grammar to skip leading/trailing whitespace that `String.prototype.trim` \
uses to strip it, so `Number(value)` and `Number(value.trim())` parse to the \
identical number for any string whose only whitespace is leading/trailing \
(verified directly: `Number(' 5 ') === Number('5') === 5`, and equivalently \
for tabs/newlines). Since the regex already guarantees `value.trim()` has no \
*interior* whitespace, the only difference `value` vs `value.trim()` could \
ever carry into `Number()` is exactly the leading/trailing whitespace both \
coercions already strip identically."""

[[equivalent]]
file = "src/serverconfig/schema.ts"
line = 246
column = 7
mutator = "LogicalOperator"
reason = """\
messageFor: `if (spec.kind === "literal" && error === "literal_error")` -> \
`if (spec.kind === "literal" || error === "literal_error")`. messageFor is \
called from exactly one site, `checkFields`, as \
`messageFor(coerced.error, spec)` where `coerced` came from \
`coerceValue(spec, ...)` using that same `spec`. Inside coerceValue, the \
*only* branch that can produce `error: "literal_error"` is the \
`spec.kind === "literal"` case, and that branch's only possible non-value \
result is `{ error: "literal_error" }` -- no other `spec.kind` ever produces \
that error string, and the literal branch never produces any other error \
string. So at this call site, `spec.kind === "literal"` and \
`error === "literal_error"` are logically equivalent propositions (each \
implies the other); for two propositions A and B where A iff B, `A && B`, \
`A || B`, and `A` alone all agree on every input. Both the LogicalOperator \
mutant (`&&` -> `||`) and the two ConditionalExpression mutants at the same \
line (forcing one operand to `true`) collapse to this same tautology and \
cannot be distinguished by any test that only reaches messageFor through \
checkFields."""

