#
# Documented equivalent-mutant allowlist for the TypeScript mutation gate
# (StrykerJS, see stryker.config.mjs).
#
# It mirrors the Python-side `mutation_equivalents.toml` and the Go-side
# `packages/provide-uterm-go/mutation_equivalents.toml`: some mutants are
# *equivalent* -- the mutated code is behaviorally identical to the original
# for every input reachable through the public API, so no test can ever
# distinguish them. Such mutants survive forever and would pin an
# otherwise-perfect file below 100%.
#
# Each [[equivalent]] entry is keyed by CONTENT, not by coordinates:
#
#   file        perimeter file, as Stryker's report names it
#   mutator     Stryker's mutator name
#   code        the source line, stripped -- also what makes an entry reviewable
#   original    the exact span Stryker replaced
#   replacement what it replaced the span with
#   occurrence  1-based among mutants in that file identical in all of the above
#               (omitted when 1)
#
# It was file + line + column + mutator until 2026-08-12. That key was neither
# stable nor unique. Not stable: line numbers belong to everything ABOVE a
# mutant, so an unrelated insertion invalidated every entry below it, and since
# this file is a mutation support file, renumbering it forces a full-perimeter
# run. Not unique: five coordinates here were each covering more than one
# distinct mutant, so a single reason was excusing several -- and a NEW mutant
# arriving at those coordinates would have been excused without anyone writing
# a reason for it. Content keys are shift-invariant and one-per-mutant. Editing
# the mutated line DOES invalidate its entry, which is the point: the
# equivalence argument was about that code.
#
# Rules mirror the other two ports' gates:
#   - `reason` MUST justify WHY the mutation is behaviorally equivalent. "I
#     could not write a test" is NOT a reason -- that is a missing test, not
#     equivalence.
#   - A survivor is NEVER excused here just because it is inconvenient to
#     kill; every entry below was verified either by direct execution (e.g.
#     checking JS's own string/number coercion semantics in a REPL) or by a
#     structural proof about the surrounding code (documented in the reason).
#   - A stale entry (its mutant was killed, or its line was edited) is reported
#     as a WARNING by ci/mutation_gate.py -- never a failure, because a mutant
#     that stopped surviving is good news. Prune them when they appear.
#   - The two validators.ts Regex entries came from the collision unpacking
#     described above, where one reason had been standing in for both mutants.
#     Each now carries its own argument for its own replacement, confirmed by
#     execution on 2026-08-12 rather than by reading: the anchored and
#     unanchored forms DO differ on arbitrary strings, so a fuzz checked that
#     no hostname `URL` can construct is one of them.
#
# StrykerJS has its own first-class mutant-exclusion mechanism
# (`stryker.config.mjs`'s `mutate` ranges, or per-mutant `// Stryker disable`
# comments) but neither fits this repo's established pattern of a single,
# auditable, reasoned allowlist alongside the source it excuses -- this file
# uses that shape instead, exactly as the Go port does.

[[equivalent]]
file = "src/egress/egress.ts"
mutator = "ConditionalExpression"
code = "if (address.version !== 6) {"
original = "address.version !== 6"
replacement = "false"
reason = """\
decodeEmbeddedIPv4: `if (address.version !== 6) { return undefined; }` -> \
`if (false) {}`. Removing this guard only matters if a v4-version address \
can reach a *different* return value further down the function. It cannot: \
every downstream helper (`ipv4Mapped`, `sixToFour`, `networkContains` against \
NAT64_NETWORK) independently checks `address.version !== 6` (or the network's \
version against the address's) and returns undefined/false for a v4 input on \
its own. The final manual "compatible form" branch reads \
`address.packed.slice(0, 12)` and `address.packed.slice(12)` -- for a v4 \
address `packed` has exactly 4 bytes, so slice(0,12) returns those same 4 \
bytes (never spuriously "more zero bytes"), and slice(12) is always the empty \
array, so `lowValue` is always computed from `undefined` operands coerced to \
0 by JS's `<<`/`|` operators, making `lowValue !== 0` always false and the \
success branch permanently unreachable for any v4 input. So the function \
returns `undefined` for every v4-version address whether or not the guard \
runs. Verified in isolation: `ipAddress()`-produced v4 IpAddress objects \
always have exactly a 4-byte `packed` (confirmed via a scratch script reading \
actual `Uint8Array` lengths), so this holds for every real caller, not just \
the specific values covered by this file's tests."""

[[equivalent]]
file = "src/egress/egress.ts"
mutator = "BlockStatement"
code = "if (address.version !== 6) {"
original = "{\n    return undefined;\n  }"
replacement = "{}"
reason = """\
Same location as the ConditionalExpression entry immediately above (removing \
the `{ return undefined; }` block body has the identical effect to forcing \
the `if` to `false` -- both skip the early return). See that entry's \
reasoning."""

[[equivalent]]
file = "src/egress/egress.ts"
mutator = "ConditionalExpression"
code = "if (address.version !== 4) {"
original = "address.version !== 4"
replacement = "false"
reason = """\
isSharedAddressSpace: `if (address.version !== 4) { return false; }` -> \
`if (false) {}`. This function is only ever reached from \
classifyEgressAddress's `isPrivate(subject) || isLinkLocal(subject) || \
isMulticast(subject) || isUnspecified(subject) || isReserved(subject) || \
isSharedAddressSpace(subject)` chain, and only for a `subject` that failed \
every earlier predicate in that chain (`||` short-circuits). Removing the \
version guard only matters if a v6 address can reach the numeric CGNAT check \
(`address.packed[0] === 100 && ...`) and have that check answer differently \
from `false`. But `packed[0] === 100` (0x64) means the address's first byte's \
top 3 bits are exactly "011" (0110_0100), which is precisely the range CPython \
mirrors as the IANA-reserved `6000::/3` block (`V6_RESERVED` in \
pycompat/ipaddress.ts) -- so *any* v6 address with `packed[0] === 100` is \
already caught by `isReserved` earlier in the `||` chain and never reaches \
`isSharedAddressSpace` at runtime at all. There is therefore no v6 input for \
which removing this guard changes the function's return value: it is either \
short-circuited away before this function runs, or (packed[0] !== 100) the \
numeric check answers `false` regardless of the guard."""

[[equivalent]]
file = "src/egress/egress.ts"
mutator = "BlockStatement"
code = "if (address.version !== 4) {"
original = "{\n    return false;\n  }"
replacement = "{}"
reason = """\
Same location as the ConditionalExpression entry immediately above (removing \
the `{ return false; }` block body has the identical effect to forcing the \
`if` to `false`). See that entry's reasoning."""

[[equivalent]]
file = "src/egress/webhook-url.ts"
mutator = "StringLiteral"
code = "timer = setTimeout(() => reject(new Error(`resolving webhook host '${host}' timed out`)), timeoutS * 1000);"
original = "`resolving webhook host '${host}' timed out`"
replacement = "``"
reason = """\
withDeadline: `reject(new Error('resolving webhook host ... timed out'))` -> \
`reject(new Error(''))`. This Error is constructed only to make Promise.race \
settle when the deadline wins; its `.message` is never read anywhere. The \
sole caller, resolveWebhookHost, wraps the whole `await withDeadline(...)` in \
a bare `try { ... } catch { throw new WebhookUrlError(UNRESOLVED); }` -- every \
property of the caught error, including its message, is discarded \
unconditionally in favor of the fixed UNRESOLVED string. withDeadline is a \
private, unexported function with this one call site, so there is no path by \
which a test (or any caller) could ever observe this string's content."""

[[equivalent]]
file = "src/ratelimit/ratelimit.ts"
mutator = "ConditionalExpression"
code = "return new TokenBucket(rate, this.#now === undefined ? {} : { now: this.#now });"
original = "this.#now === undefined"
replacement = "false"
reason = """\
RateLimiter#mint: `this.#now === undefined ? {} : { now: this.#now }` -> \
`false ? {} : { now: this.#now }` (always takes the `{ now: this.#now }` \
branch). When `this.#now` actually is undefined, this passes \
`{ now: undefined }` to `new TokenBucket(rate, options)` instead of `{}`. \
TokenBucket's constructor reads `this.#now = options.now ?? monotonicNow` -- \
`options.now` is `undefined` in both `{}` and `{ now: undefined }` (an \
explicit `undefined` value is indistinguishable from an absent key under \
`??`), so the resolved clock is identical either way. No test can observe a \
difference between the two option objects because only the resolved value of \
`options.now` is ever read, never the object's own shape."""

[[equivalent]]
file = "src/serverconfig/posture.ts"
mutator = "StringLiteral"
code = "if (text(config.auth.webhook_idp_on_failure, \"deny\") === \"viewer\") {"
original = "\"deny\""
replacement = "\"\""
reason = """\
computeSecurityPosture: `text(config.auth.webhook_idp_on_failure, "deny")` -> \
`text(config.auth.webhook_idp_on_failure, "")`. The `fallback` parameter of \
`text()` only has an effect when `config.auth.webhook_idp_on_failure` is \
null/undefined (see `text`'s own `value ?? fallback`), and the resulting \
string is used *only* in `=== "viewer"`. Neither "deny" nor "" equals \
"viewer", so for every input where the fallback is actually consulted, the \
`if` this feeds evaluates to `false` under both the original and the mutant \
-- the fallback's specific text is never observable, only whether it happens \
to equal "viewer" (which it does not, either way)."""

[[equivalent]]
file = "src/serverconfig/posture.ts"
mutator = "StringLiteral"
code = "const identityProvider = text(config.auth.identity_provider, \"local\");"
original = "\"local\""
replacement = "\"\""
reason = """\
computeSecurityPosture: `text(config.auth.identity_provider, "local")` -> \
`text(config.auth.identity_provider, "")`. Same shape as the entry above: the \
resulting `identityProvider` value is compared only against `"webhook"` \
(twice, in the two `identityProvider === "webhook"` checks below) and is \
never otherwise exposed (it is not a field of the returned SecurityPosture). \
Neither "local" nor "" equals "webhook", so the fallback's specific text \
cannot be observed by any test that only exercises the public \
`computeSecurityPosture` return value."""

[[equivalent]]
file = "src/serverconfig/validators.ts"
mutator = "Regex"
code = "const host = parsed.hostname.toLowerCase().replace(/^\\[|\\]$/g, \"\");"
original = "/^\\[|\\]$/g"
replacement = "/\\[|\\]$/g"
reason = """\
requireSecureUrl, `^` anchor dropped: the pattern goes from "a `[` at the \
start" to "any `[` anywhere". Equivalent because a URL hostname contains at \
most ONE `[`, always at index 0, so "anywhere" and "at the start" select the \
same character. `parsed.hostname` comes from the WHATWG `URL` constructor, \
which guarantees a hostname is either bracket-free entirely or exactly one \
literal IPv6 address wrapped in a single opening `[` at position 0 and a \
single closing `]` at the very end; any other bracket placement makes the URL \
invalid and throws in the `new URL(url)` above, before this line runs. The \
equivalence rests ENTIRELY on that invariant — on arbitrary strings this \
mutant is genuinely different (`"a[b"` keeps its bracket under the anchored \
form and loses it here) — so it was checked by execution rather than by \
reading: a fuzz over a bracket-heavy alphabet built 300k candidate URLs, of \
which 76,119 parsed and 8 produced a bracketed hostname, with zero results \
differing from the anchored form. Verified 2026-08-12.\
"""

