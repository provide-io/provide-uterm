#
# Documented equivalent-mutant allowlist for the TypeScript mutation gate
# (StrykerJS, see stryker.config.mjs).
#
# It mirrors the Python-side `mutation_equivalents.toml` and the Go-side
# `packages/provide-uterm-go/mutation_equivalents.toml`: some mutants are
# *equivalent* -- the mutated code is behaviorally identical to the original
# for every input reachable through the public API, so no test can ever
# distinguish them. Such mutants survive forever and would pin an
# otherwise-perfect file below 100%.
#
# Each [[equivalent]] entry is keyed by file + line + column + mutator
# (exactly as Stryker reports them in its clear-text/HTML output). Rules
# mirror the other two ports' gates:
#   - `reason` MUST justify WHY the mutation is behaviorally equivalent. "I
#     could not write a test" is NOT a reason -- that is a missing test, not
#     equivalence.
#   - A survivor is NEVER excused here just because it is inconvenient to
#     kill; every entry below was verified either by direct execution (e.g.
#     checking JS's own string/number coercion semantics in a REPL) or by a
#     structural proof about the surrounding code (documented in the reason).
#   - A stale entry (its mutant was later killed, or moved by a source edit)
#     is not automatically detected -- there is no TS-side gate script wired
#     to cross-check this file yet (see the mutation-testing report for the
#     current status). Treat this file as a manually-curated record until
#     one exists.
#
# StrykerJS has its own first-class mutant-exclusion mechanism
# (`stryker.config.mjs`'s `mutate` ranges, or per-mutant `// Stryker disable`
# comments) but neither fits this repo's established pattern of a single,
# auditable, reasoned allowlist alongside the source it excuses -- this file
# uses that shape instead, exactly as the Go port does.

[[equivalent]]
file = "src/egress/egress.ts"
line = 104
column = 7
mutator = "ConditionalExpression"
reason = """\
decodeEmbeddedIPv4: `if (address.version !== 6) { return undefined; }` -> \
`if (false) {}`. Removing this guard only matters if a v4-version address \
can reach a *different* return value further down the function. It cannot: \
every downstream helper (`ipv4Mapped`, `sixToFour`, `networkContains` against \
NAT64_NETWORK) independently checks `address.version !== 6` (or the network's \
version against the address's) and returns undefined/false for a v4 input on \
its own. The final manual "compatible form" branch reads \
`address.packed.slice(0, 12)` and `address.packed.slice(12)` -- for a v4 \
address `packed` has exactly 4 bytes, so slice(0,12) returns those same 4 \
bytes (never spuriously "more zero bytes"), and slice(12) is always the empty \
array, so `lowValue` is always computed from `undefined` operands coerced to \
0 by JS's `<<`/`|` operators, making `lowValue !== 0` always false and the \
success branch permanently unreachable for any v4 input. So the function \
returns `undefined` for every v4-version address whether or not the guard \
runs. Verified in isolation: `ipAddress()`-produced v4 IpAddress objects \
always have exactly a 4-byte `packed` (confirmed via a scratch script reading \
actual `Uint8Array` lengths), so this holds for every real caller, not just \
the specific values covered by this file's tests."""

