[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "provide-terminal-cloudflare"
version = "0.3.0"
description = "Cloudflare Workers runtime for provide-terminal control plane"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "AGPL-3.0-or-later"}
authors = [
  {name = "MindTenet LLC"},
]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
  "Framework :: AsyncIO",
]
dependencies = [
  "pyjwt>=2.9",
]

[project.optional-dependencies]
ui = [
  "provide-terminal",
]
dev = [
  "pytest>=9.0",
  "pytest-asyncio>=1.3",
  "pytest-playwright>=0.5",
  "ruff>=0.15",
  "mypy>=1.19",
  "workers-py>=0.4.0",
  "websockets>=16.0",
]

[project.urls]
Homepage = "https://github.com/provide-io/provide-terminal"
Repository = "https://github.com/provide-io/provide-terminal"

[project.scripts]
uterm-cf = "provide_terminal_cloudflare.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/provide_terminal_cloudflare"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "e2e: end-to-end tests against a live pywrangler dev server (skipped by default; use -m e2e or E2E=1)",
    "real_cf: requires real Cloudflare deployment with live KV + full WS support (skipped unless REAL_CF=1)",
    "slow: slow tests (>10s); skipped unless SLOW=1 or REAL_CF=1",
    "playwright: Playwright browser UI tests",
]
