[[stryker_equivalent]]
file = "Server/EgressAddressPolicy.cs"
line = 142
column = 37
mutator = "Null coalescing mutation (remove left)"
reason = """\
IsLoopback: `IPAddress.IsLoopback(v4 ?? ip)`. .NET's own IPAddress.IsLoopback \
already special-cases an IPv4-mapped IPv6 address internally (it maps to IPv4 \
and asks IsLoopback of *that* before falling back to the ::1 comparison), so \
passing the raw wrapper form instead of the pre-mapped v4 form produces an \
identical answer for every address — confirmed by EgressAddressPolicyTests's \
`::ffff:127.0.0.1` case passing unchanged under the mutant. The `v4` extraction \
still matters to every other caller in this file (DecodeEmbeddedIPv4's own \
logic, IsBlockedPrivate's CIDR match), which is why it is not deleted — only \
this one call site's use of it is redundant."""

