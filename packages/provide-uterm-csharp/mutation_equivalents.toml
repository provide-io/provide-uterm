green. If a third call site to `Release()` is ever added outside this lock \
discipline, this entry should be revisited."""

[[stryker_equivalent]]
file = "ServerConfig/Load.cs"
line = 458
column = 100
mutator = "Null coalescing mutation (remove left)"
reason = """\
ApplyServer: `s.MaxSessions = ToInt(maxSessions, s.MaxSessions ?? 0)` — the \
fallback ToInt uses if the TOML value fails to parse as an int. `MaxSessions` \
is `int?` with no default set anywhere (`Config.cs:65` declares it bare, and \
`UtermServerConfig.Default()` never assigns it), and `ApplyServer` — `private \
static`, so unreachable from any test — is the only writer, called at most \
once per `Load()` (TOML forbids a second `[server]` table) on a config that \
`Load` has just built from `Default()`. So `s.MaxSessions` is provably `null` \
every time this line runs, making `s.MaxSessions ?? 0` always evaluate to \
`0`, identically to the mutant's hardcoded `0`. Confirmed empirically as well \
as analytically: hand-applying the mutant and running the whole Stryker \
test-case-filter perimeter (336 tests) leaves every test green. If \
`MaxSessions` ever gains a non-null default, or `ApplyServer` a second \
caller, this entry must be revisited — a test could then distinguish the two \
by writing an unparseable `max_sessions` and asserting the prior value \
survives."""

