[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "provide-uterm-cloudflare"
dynamic = ["version"]
description = "Cloudflare Workers runtime for provide-uterm control plane"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
authors = [
  {name = "provide.io llc"},
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
  "Framework :: AsyncIO",
]
dependencies = [
  "pyjwt>=2.9",
  "provide-uterm>=0.4.0",
  "provide-uterm-server>=0.4.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0",
  "pytest-asyncio>=1.3",
  "pytest-cov>=7.0",
  "pytest-playwright>=0.7.2",
  "ruff>=0.15",
  "mypy>=1.19",
  "workers-py>=0.4.0",
  "websockets>=16.0",
  "cryptography>=44.0",
]

[project.urls]
Homepage = "https://github.com/provide-io/provide-uterm"
Repository = "https://github.com/provide-io/provide-uterm"

[project.scripts]
uterm-cf = "provide.uterm.cloudflare.cli:main"

[tool.setuptools.dynamic]
version = {file = "VERSION"}

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.setuptools.package-data]
"provide.uterm.cloudflare" = ["py.typed"]

[tool.pytest.ini_options]
consider_namespace_packages = true
asyncio_mode = "auto"
pythonpath = ["src"]
markers = [
    "e2e: end-to-end tests against a live pywrangler dev server (skipped by default; use -m e2e or E2E=1)",
    "real_cf: requires real Cloudflare deployment with live KV + full WS support (skipped unless REAL_CF=1)",
    "slow: slow tests (>10s); skipped unless SLOW=1 or REAL_CF=1",
    "playwright: Playwright browser UI tests",
]
addopts = [
    "--cov=provide.uterm.cloudflare",
    "--cov-branch",
    "--cov-report=term-missing",
    "--cov-fail-under=100",
]

[tool.coverage.run]
source = ["provide.uterm.cloudflare"]
branch = true

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = false
[tool.mutmut]
source_paths = ["src/"]
also_copy = ["wrangler.toml"]
pytest_add_cli_args = ["-o", "addopts=", "--no-header", "-q"]
pytest_add_cli_args_test_selection = ["tests/"]
