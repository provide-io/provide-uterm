[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "provide-uterm-cloudflare"
dynamic = ["version"]
description = "Cloudflare Workers runtime for provide-uterm control plane"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
authors = [
  {name = "provide.io llc"},
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
  "Framework :: AsyncIO",
]
dependencies = [
  "pyjwt>=2.9",
  "provide-uterm>=0.5.0",
  "provide-uterm-server>=0.5.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0",
  "pytest-asyncio>=1.3",
  "pytest-cov>=7.0",
  "pytest-playwright>=0.7.2",
  "ruff>=0.15",
  "mypy>=1.19",
  "workers-py>=0.4.0",
  "websockets>=16.0",
  "cryptography>=44.0",
  # The cross-compat tests boot a real FastAPI server and compare it against
  # the Worker, and that server refuses to build without annotation support.
  # The Worker runtime itself does not need it, so it belongs here rather than
  # in this package's runtime dependencies.
  #
  # [server] as well as [annotation]: fastapi/uvicorn live under provide-uterm-
  # server's server/cli/tunnel extras, not [annotation], so app/factory_impl.py
  # raised ModuleNotFoundError: No module named 'fastapi' the moment the
  # isolated env stopped receiving it transitively — the same failure mode the
  # starlette note below describes.
  "provide-uterm-server[annotation,server]>=0.5.0",
  # tests/conftest.py imports starlette.testclient directly, and TestClient
  # needs httpx2 at import time. Neither is reachable through the line above:
  # provide-uterm-server declares fastapi under its server/cli/tunnel extras,
  # not under [annotation]. Both arrived transitively until 2026-08-06, when
  # the same commit that passed on 08-05 began failing CI's isolated
  # `uv run --package provide-uterm-cloudflare --extra dev` env with
  # ModuleNotFoundError: No module named 'starlette'. A test's direct import
  # belongs in its own package's dev extra rather than inherited by luck.
  "starlette>=0.40",
  "httpx2>=2.10",
]

[project.urls]
Homepage = "https://github.com/provide-io/provide-uterm"
Repository = "https://github.com/provide-io/provide-uterm"

[project.scripts]
uterm-cf = "provide.uterm.cloudflare.cli:main"

[tool.setuptools.dynamic]
version = {file = "VERSION"}

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.setuptools.package-data]
"provide.uterm.cloudflare" = ["py.typed"]

[tool.pytest.ini_options]
consider_namespace_packages = true
asyncio_mode = "auto"
pythonpath = ["src"]
markers = [
    "e2e: end-to-end tests against a live pywrangler dev server (skipped by default; use -m e2e or E2E=1)",
    "real_cf: requires real Cloudflare deployment with live KV + full WS support (skipped unless REAL_CF=1)",
    "slow: slow tests (>10s); skipped unless SLOW=1 or REAL_CF=1",
    "playwright: Playwright browser UI tests",
]
addopts = [
    "--cov=provide.uterm.cloudflare",
    "--cov-branch",
    "--cov-report=term-missing",
    "--cov-fail-under=100",
]

[tool.coverage.run]
source = ["provide.uterm.cloudflare"]
branch = true

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = false
[tool.mutmut]
source_paths = ["src/"]
also_copy = ["wrangler.toml"]
pytest_add_cli_args = ["-o", "addopts=", "--no-header", "-q"]
pytest_add_cli_args_test_selection = ["tests/"]
