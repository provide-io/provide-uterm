#
# Regenerate the vendored litevirt VNC stubs:
#   cd packages/provide-uterm-go/vnc/gen && buf generate
#
# Plugin versions are pinned to what upstream litevirt generated with, so the
# vendored output stays diff-comparable against upstream's gen/litevirt/v1.
version: v2
plugins:
  - local: protoc-gen-go
    out: .
    opt: paths=source_relative
  - local: protoc-gen-go-grpc
    out: .
    opt: paths=source_relative
