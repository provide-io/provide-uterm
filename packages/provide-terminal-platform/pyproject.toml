[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "provide-terminal-platform"
dynamic = ["version"]
description = "Platform-specific deployment targets (PTY, PAM, fleet manager) for provide-terminal"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
dependencies = ["provide-terminal>=0.4.0"]

[project.optional-dependencies]
pty = ["provide-terminal>=0.4.0"]
manager = ["fastapi>=0.110", "uvicorn>=0.24", "pydantic>=2.0", "pyyaml>=6.0"]
all = ["provide-terminal>=0.4.0", "fastapi>=0.110", "uvicorn>=0.24", "pydantic>=2.0", "pyyaml>=6.0"]
dev = [
    "pytest>=9.0",
    "pytest-asyncio>=1.3",
    "pytest-cov>=7.0",
    "pytest-timeout>=2.4.0",
    "mypy>=1.19",
    "ruff>=0.15",
    "bandit>=1.9",
    "provide-terminal>=0.4.0",
    "fastapi>=0.110",
    "uvicorn>=0.24",
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[project.scripts]
uterm-manager = "provide.terminal.manager.cli:main"

[tool.setuptools.dynamic]
version = {file = "VERSION"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"provide.terminal" = ["py.typed"]
"provide.terminal.pty" = ["py.typed", "_native/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = [
    "--import-mode=importlib",
    "-v",
    "--strict-markers",
    "--strict-config",
    "--tb=short",
    "-ra",
    "--cov=provide.terminal.pty",
    "--cov=provide.terminal.manager",
    "--cov-branch",
    "--cov-report=term-missing",
    "--cov-fail-under=100",
]
markers = [
    "requires_pam: requires /etc/pam.d/provide-terminal service config (skip in CI)",
    "requires_pam_auth: requires /etc/pam.d/provide-terminal with working unix_chkpwd (skipped in Docker)",
    "requires_root: requires root or CAP_SETUID to switch users",
]

[tool.coverage.report]
fail_under = 100
show_missing = true
partial_branches = [
    "if _libpam is not None:",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "C4", "SIM", "TCH", "PTH",
    "DTZ", "ICN", "ISC", "PERF", "PIE", "RET", "RSE", "TID", "S", "ARG", "RUF",
]
ignore = ["E501", "S104", "S112", "S311", "S603", "S604", "S108", "SIM105", "ARG002"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "RUF022"]
"tests/**/*.py" = ["E402", "B905", "S101", "S105", "S106", "S110", "ARG", "TCH", "RUF003", "RUF012", "RUF015", "RUF043", "RUF059"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.uv.sources]
provide-terminal = { workspace = true }
