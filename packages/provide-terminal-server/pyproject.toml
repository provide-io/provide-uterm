[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "provide-terminal>=0.4.0-server"
dynamic = ["version"]
description = "Server, bridge, tunnel, and gateway for provide-terminal"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
dependencies = [
    "provide-terminal>=0.4.0",
    "provide-terminal>=0.4.0-client>=0.4.0",
]

[project.optional-dependencies]
server = ["fastapi>=0.110", "uvicorn>=0.24", "pyjwt>=2.9", "websockets>=12.0"]
cli = ["fastapi>=0.110", "uvicorn>=0.24", "websockets>=12.0", "textual>=0.50", "httpx>=0.27"]
tunnel = ["httpx>=0.27", "uvicorn>=0.24", "websockets>=16.0", "fastapi>=0.110"]
gateway = ["asyncssh>=2.22.0", "websockets>=16.0"]
all = [
    "fastapi>=0.110", "uvicorn>=0.24", "pyjwt>=2.9", "websockets>=16.0",
    "textual>=0.50", "httpx>=0.27", "asyncssh>=2.22.0",
]
dev = [
    "pytest>=9.0",
    "pytest-asyncio>=1.3",
    "pytest-cov>=7.0",
    "pytest-timeout>=2.4.0",
    "pytest-randomly>=3.15.0",
    "pytest-textual-snapshot>=1.0.0",
    "mypy>=1.19",
    "ruff>=0.15",
    "fastapi>=0.110",
    "uvicorn>=0.24",
    "pyjwt>=2.9",
    "websockets>=16.0",
    "textual>=0.50",
    "httpx>=0.27",
    "asyncssh>=2.22.0",
    "Pillow>=10.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[project.scripts]
uterm = "provide.terminal.cli:main"
uterm-server = "provide.terminal.server.cli:main"

[tool.setuptools.dynamic]
version = {file = "VERSION"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"provide.terminal" = ["py.typed"]
"provide.terminal.server" = [
    "frontend/**",
    "frontend/**/*",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = [
    "ignore:websockets\\.legacy is deprecated; see .*:DeprecationWarning:websockets\\.legacy",
    "ignore:websockets\\.server\\.WebSocketServerProtocol is deprecated:DeprecationWarning:uvicorn\\.protocols\\.websockets\\.websockets_impl",
    "ignore:remove second argument of ws_handler:DeprecationWarning:websockets\\.legacy\\.server",
]
markers = [
    "playwright: browser-based UI tests (deselected by default, run with -m playwright)",
    "slow: slow tests >10s (deselected by default)",
    "mutant: mutation-testing harness tests (run by mutation gate only)",
]
addopts = [
    "--import-mode=importlib",
    "-v",
    "--strict-markers",
    "--strict-config",
    "--tb=short",
    "-ra",
    "-m",
    "not playwright and not slow",
    "--cov=provide.terminal.bridge",
    "--cov=provide.terminal.server",
    "--cov=provide.terminal.tunnel",
    "--cov=provide.terminal.gateway",
    "--cov-branch",
    "--cov-report=term-missing",
    "--cov-fail-under=100",
]

[tool.coverage.run]
source = [
    "provide.terminal.bridge",
    "provide.terminal.server",
    "provide.terminal.tunnel",
    "provide.terminal.gateway",
]
omit = ["tests/*"]
branch = true

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = false
partial_branches = [
    "pragma: no branch",
    "if not msg.get\\(\"more_body\"",
    "elif msg_type ==",
]

[tool.ruff]
target-version = "0.4.0"
line-length = 120

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "C4", "SIM", "TCH", "PTH",
    "DTZ", "ICN", "ISC", "PERF", "PIE", "RET", "RSE", "TID", "S", "ARG", "RUF",
]
ignore = ["E501", "S104", "S112", "S311"]

[tool.ruff.lint.isort]
known-first-party = ["provide"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "RUF022"]
"tests/**/*.py" = ["E402", "B905", "S101", "S105", "S106", "S110", "S603", "S607", "ARG", "TCH", "RUF003", "RUF012", "RUF015", "RUF043", "RUF059"]

[tool.mypy]
python_version = "0.4.0"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true