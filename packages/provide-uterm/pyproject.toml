[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "provide-uterm"
dynamic = ["version"]
description = "Shared terminal I/O primitives for the provide ecosystem"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
authors = [
  {name = "provide.io llc"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Networking",
    "Topic :: Terminals",
    "Framework :: FastAPI",
]
dependencies = ["provide-telemetry>=0.4.7", "aiosqlite>=0.22"]

[project.urls]
Homepage = "https://github.com/provide-io/provide-uterm"
Repository = "https://github.com/provide-io/provide-uterm"

[project.optional-dependencies]
emulator  = ["pyte>=0.8"]
ssh       = ["asyncssh>=2.14"]
client    = ["httpx>=0.27"]
all       = ["pyte>=0.8", "asyncssh>=2.14", "httpx>=0.27"]

[tool.setuptools.dynamic]
version = {file = "VERSION"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"provide.uterm" = [
    "py.typed",
]

[dependency-groups]
dev = [
    "asyncssh>=2.22.0",
    "bandit>=1.9",
    "codespell>=2.4.1",
    "detect-secrets>=1.5.0",
    "fastapi>=0.110",
    "httpx>=0.27",
    "hypothesis>=6.151.9",
    "memray>=1.0; sys_platform != 'win32'",
    "mutmut>=3.3.1",
    "mypy>=1.19",
    "pip-audit>=2.7.0",
    "pip-licenses>=5.5.0",
    "pre-commit>=4.0",
    "pydantic>=2.0",
    "pyjwt>=2.9",
    "pyte>=0.8.2",
    "pytest>=9.0",
    "pytest-asyncio>=1.3",
    "pytest-cov>=7.0",
    "pytest-playwright>=0.7.2",
    "pytest-randomly>=3.15.0",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.8",
    "reuse>=6.2.0",
    "ruff>=0.15",
    "ty>=0.0.17",
    "uv>=0.10.7",
    "uvicorn>=0.24",
    "vulture>=2.14",
    "websockets>=16.0",
    "pyyaml>=6.0",
    "xenon>=0.9.3",
    "fastmcp>=2.0",
]

[tool.pytest.ini_options]
consider_namespace_packages = true
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = [
    "ignore:websockets\\.legacy is deprecated; see .*:DeprecationWarning:websockets\\.legacy",
    "ignore:websockets\\.server\\.WebSocketServerProtocol is deprecated:DeprecationWarning:uvicorn\\.protocols\\.websockets\\.websockets_impl",
    "ignore:remove second argument of ws_handler:DeprecationWarning:websockets\\.legacy\\.server",
]
markers = [
    "playwright: browser-based UI tests (deselected by default, run with -m playwright)",
    "mutant: mutation-testing and mutmut-focused tests (deselected by default)",
    "memray: memory profiling and allocation stress tests (deselected by default, run with -m memray)",
    "slow: slow tests >10s (deselected by default)",
    "docker: Docker-based E2E tests requiring a running Docker daemon (deselected by default, run with -m docker)",
    "unit: fast unit tests with no I/O or external dependencies",
]
addopts = [
    "--import-mode=importlib",
    "-v",
    "--strict-markers",
    "--strict-config",
    "--tb=short",
    "-ra",
    "-m",
    "not playwright and not memray and not slow and not docker",
    # Coverage scoped to this package's source dir. An import name can't be used
    # (`provide.uterm` is a namespace shared by every package → would pull in
    # server/client/cloudflare/… and report ~69%). This package-relative path
    # only resolves when pytest's CWD is the package dir, so the gate MUST be run
    # from here — CI and scripts/run_all_tests.py invoke it via
    # `uv run --directory packages/provide-uterm pytest tests`. Waivers below.
    "--cov=src/provide/uterm",
    "--cov-branch",
    "--cov-report=term-missing",
    "--cov-fail-under=100",
]

[tool.coverage.run]
# Measure the whole package source, not an enumerated module allowlist. This
# keeps newly-added modules in the 100% gate by default. Genuinely
# out-of-scope modules are listed explicitly in ``omit`` below so the waiver
# is visible and grep-able (CORE-cov, 2026-05-28 remediation).
source = ["src/provide/uterm"]
omit = [
    "tests/*",
]
branch = true

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = false
# Only the standard explicit waiver remains. The previous broad
# ``elif msg_type ==`` / ``more_body`` regex escape-hatches were removed
# (CORE-cov): real branch tests now cover those dispatch fall-throughs, and
# any genuinely-unreachable branch carries a per-site ``# pragma: no cover``
# with an inline justification so the waiver is visible and grep-able.
partial_branches = [
    "pragma: no branch",
]

[tool.mutmut]
max_children = 6
paths_to_mutate = ["src/provide/uterm/"]
tests_dir = ["tests/", "tests_mutation/"]
also_copy = ["scripts/"]
do_not_mutate = [
    "src/provide/uterm/frontend/",
    "src/provide/uterm/transports/",
    "src/provide/uterm/gateway.py",
    "src/provide/uterm/server/connectors/",
]
pytest_add_cli_args = ["--no-cov", "--timeout=30"]
pytest_add_cli_args_test_selection = [
    "-m",
    "not playwright",
    "--ignore=tests/example/test_server_e2e.py",
    "--ignore=tests/bridge/test_hypothesis.py",
    "--ignore=tests/bridge/test_hypothesis_ordering.py",
    "--ignore=tests/e2e",
]
