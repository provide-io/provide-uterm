[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "provide-uterm"
dynamic = ["version"]
description = "Shared terminal I/O primitives for the provide ecosystem"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
authors = [
  {name = "provide.io llc"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Networking",
    "Topic :: Terminals",
    "Framework :: FastAPI",
]
dependencies = ["provide-telemetry>=0.3", "aiosqlite>=0.20"]

[project.urls]
Homepage = "https://github.com/provide-io/provide-uterm"
Repository = "https://github.com/provide-io/provide-uterm"

[project.optional-dependencies]
emulator  = ["pyte>=0.8"]
ssh       = ["asyncssh>=2.14"]
client    = ["httpx>=0.27"]
all       = ["pyte>=0.8", "asyncssh>=2.14", "httpx>=0.27"]

[tool.setuptools.dynamic]
version = {file = "VERSION"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"provide.uterm" = [
    "py.typed",
]

[dependency-groups]
dev = [
    "asyncssh>=2.22.0",
    "bandit>=1.9",
    "codespell>=2.4.1",
    "detect-secrets>=1.5.0",
    "fastapi>=0.110",
    "httpx>=0.27",
    "hypothesis>=6.151.9",
    "memray>=1.0; sys_platform != 'win32'",
    "mutmut>=3.3.1",
    "mypy>=1.19",
    "pip-audit>=2.7.0",
    "pip-licenses>=5.5.0",
    "pre-commit>=4.0",
    "pydantic>=2.0",
    "pyjwt>=2.9",
    "pyte>=0.8.2",
    "pytest>=9.0",
    "pytest-asyncio>=1.3",
    "pytest-cov>=7.0",
    "pytest-playwright>=0.7.2",
    "pytest-randomly>=3.15.0",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.8",
    "reuse>=6.2.0",
    "ruff>=0.15",
    "ty>=0.0.17",
    "uv>=0.10.7",
    "uvicorn>=0.24",
    "vulture>=2.14",
    "websockets>=16.0",
    "pyyaml>=6.0",
    "xenon>=0.9.3",
    "fastmcp>=2.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = [
    "ignore:websockets\\.legacy is deprecated; see .*:DeprecationWarning:websockets\\.legacy",
    "ignore:websockets\\.server\\.WebSocketServerProtocol is deprecated:DeprecationWarning:uvicorn\\.protocols\\.websockets\\.websockets_impl",
    "ignore:remove second argument of ws_handler:DeprecationWarning:websockets\\.legacy\\.server",
]
markers = [
    "playwright: browser-based UI tests (deselected by default, run with -m playwright)",
    "mutant: mutation-testing and mutmut-focused tests (deselected by default)",
    "memray: memory profiling and allocation stress tests (deselected by default, run with -m memray)",
    "slow: slow tests >10s (deselected by default)",
    "docker: Docker-based E2E tests requiring a running Docker daemon (deselected by default, run with -m docker)",
    "unit: fast unit tests with no I/O or external dependencies",
]
addopts = [
    "--import-mode=importlib",
    "-v",
    "--strict-markers",
    "--strict-config",
    "--tb=short",
    "-ra",
    "-m",
    "not playwright and not memray and not slow and not docker",
    "--cov=provide.uterm.__init__",
    "--cov=provide.uterm.ansi",
    "--cov=provide.uterm.bridge.coordinator",
    "--cov=provide.uterm.colors",
    "--cov=provide.uterm.control_channel",
    "--cov=provide.uterm.deckmux",
    "--cov=provide.uterm.defaults",
    "--cov=provide.uterm.detection",
    "--cov=provide.uterm.emulator",
    "--cov=provide.uterm.file_io",
    "--cov=provide.uterm.filters",
    "--cov=provide.uterm.io",
    "--cov=provide.uterm.line_editor",
    "--cov=provide.uterm.protocols",
    "--cov=provide.uterm.render",
    "--cov=provide.uterm.replay",
    "--cov=provide.uterm.screen",
    "--cov=provide.uterm.session_logger",
    "--cov=provide.uterm.shell",
    "--cov=provide.uterm.telnet_session",
    "--cov-branch",
    "--cov-report=term-missing",
    "--cov-fail-under=100",
]

[tool.coverage.run]
source = [
    "provide.uterm.__init__",
    "provide.uterm.ansi",
    "provide.uterm.bridge.coordinator",
    "provide.uterm.control_channel",
    "provide.uterm.deckmux",
    "provide.uterm.defaults",
    "provide.uterm.detection",
    "provide.uterm.emulator",
    "provide.uterm.file_io",
    "provide.uterm.filters",
    "provide.uterm.io",
    "provide.uterm.line_editor",
    "provide.uterm.protocols",
    "provide.uterm.render",
    "provide.uterm.replay",
    "provide.uterm.screen",
    "provide.uterm.session_logger",
    "provide.uterm.shell",
    "provide.uterm.telnet_session",
]
omit = ["tests/*"]
branch = true

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = false
# Loop-back branches in async receive loops — the True branch IS exercised
# but coverage can't track the loop continuation edge reliably.
partial_branches = [
    "pragma: no branch",
    "if not msg.get\\(\"more_body\"",
    "elif msg_type ==",
]

[tool.mutmut]
max_children = 6
paths_to_mutate = ["src/provide/uterm/"]
tests_dir = ["tests/", "tests_mutation/"]
also_copy = ["scripts/"]
do_not_mutate = [
    "src/provide/uterm/frontend/",
    "src/provide/uterm/transports/",
    "src/provide/uterm/gateway.py",
    "src/provide/uterm/server/connectors/",
]
pytest_add_cli_args = ["--no-cov", "--timeout=30"]
pytest_add_cli_args_test_selection = [
    "-m",
    "not playwright",
    "--ignore=tests/example/test_server_e2e.py",
    "--ignore=tests/bridge/test_hypothesis.py",
    "--ignore=tests/bridge/test_hypothesis_ordering.py",
    "--ignore=tests/e2e",
]
