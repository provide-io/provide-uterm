#
# One container per language server + Cloudflare worker.
#
# Usage:
#   docker compose -f docker/docker-compose.yml up --build
#   docker compose -f docker/docker-compose.yml up --build server-go
#
# Host ports (each language binds 27780 inside its container):
#   Python FastAPI:  http://localhost:27780  (service: server)
#   Go server:       http://localhost:27781  (service: server-go)
#   C# server:       http://localhost:27782  (service: server-csharp)
#   CF worker dev:   http://localhost:27788  (service: cf)
#
# Default image config is fail-closed (JWT placeholders under /etc/uterm/server.toml).
# For local multi-language smoke with dev_token, mount docker/dev-smoke.toml:
#   volumes:
#     - ./dev-smoke.toml:/etc/uterm/server.toml:ro
#

services:
  # Python reference server (historic service name `server`).
  server:
    build:
      context: ..
      dockerfile: docker/Dockerfile.server
    image: provide-uterm-server-python:local
    ports:
      - "27780:27780"
    volumes:
      - ./dev-smoke.toml:/etc/uterm/server.toml:ro

  server-go:
    build:
      context: ..
      dockerfile: docker/Dockerfile.go
    image: provide-uterm-server-go:local
    ports:
      - "27781:27780"
    volumes:
      - ./dev-smoke.toml:/etc/uterm/server.toml:ro

  server-csharp:
    build:
      context: ..
      dockerfile: docker/Dockerfile.csharp
    image: provide-uterm-server-csharp:local
    ports:
      - "27782:27780"
    volumes:
      - ./dev-smoke.toml:/etc/uterm/server.toml:ro

  cf:
    build:
      context: ..
      dockerfile: docker/Dockerfile.cf
    image: provide-uterm-cf:local
    ports:
      - "27788:27788"
    environment:
      AUTH_MODE: "dev"
