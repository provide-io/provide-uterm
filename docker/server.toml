#
# Default Docker config: production-shaped JWT auth with deliberate
# placeholders. The server rejects these values at startup so the image fails
# closed until a real /etc/uterm/server.toml is mounted.
#

[server]
host = "0.0.0.0"
port = 27780
public_base_url = "http://localhost:27780"
title = "provide-uterm (Docker)"

[auth]
# Replace this whole section for deployment. Do not expose dev/header auth
# without the guardrails documented in scripts/uterm-server.example.toml.
mode = "jwt"
require_jwt_in_production = true
jwt_issuer = "provide-uterm"
jwt_audience = "provide-uterm-server"
jwt_public_key_pem = """
-----BEGIN PUBLIC KEY-----
REPLACE_WITH_REAL_PUBLIC_KEY
-----END PUBLIC KEY-----
"""
jwt_algorithms = ["RS256"]
worker_bearer_token = "REPLACE_WITH_RUNTIME_WORKER_JWT"

[ui]
app_path = "/app"
assets_path = "/_terminal"

[recording]
enabled_by_default = false
directory = "/tmp/uterm-recordings"

[[sessions]]
session_id = "shell-demo"
display_name = "Interactive Shell"
connector_type = "shell"
input_mode = "open"
auto_start = true
visibility = "public"
tags = ["demo"]
