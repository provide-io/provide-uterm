# --- Top-level keys -----------------------------------------------------
# These sit at the top of the document, before the first [section]. TOML
# folds a bare key written after a table header into that table, so they
# must stay above [server].

# REST hijack rate limits (tokens/sec; burst = one second of the same rate).
# Each ceiling is enforced twice — once globally and once per calling client —
# so one client can never spend more than its own share of the global budget.
#
# rest_acquire_rate_limit_per_sec guards POST /hijack/acquire: the expensive,
#   state-changing lease grab. Protects against a client that hammers acquire
#   to steal or churn leases. Cost of lowering it: a legitimate operator or
#   agent that reconnects in a tight loop starts getting 429s.
# rest_send_rate_limit_per_sec is shared by the hijack send AND step
#   endpoints — both are cheap keystroke-rate calls, which is why the budget
#   is larger. Protects against an input flood driving the worker/PTY.
#   Cost of lowering it: fast typing or a scripted agent gets throttled
#   mid-session.
#
# Defaults are the hub's built-in values; leaving them unset changes nothing.
# The minimum is 1. Anything under it — 0, a negative, or a fraction like
# 0.5 — is REFUSED at startup rather than interpreted: a bucket's burst is
# one second of its rate, so a sub-1/s limit never accumulates a whole token
# and would refuse every call forever. Non-finite values (inf, nan) are
# refused too, since inf would silently mean "no limit at all". Fractions at
# or above 1 are fine (2.5 = five calls every two seconds). A rate limit that
# silently fails open — or silently bricks the endpoint — is worse than none.
# rest_acquire_rate_limit_per_sec = 5
# rest_send_rate_limit_per_sec = 20

[server]
host = "127.0.0.1"
port = 8780
public_base_url = "http://127.0.0.1:8780"
title = "provide-uterm-server"

[auth]
# Local/dev profile (header-compatible and no JWT requirements).
# Prefer mode = "dev_token" on current servers; legacy "dev" may be rejected.
mode = "dev_token"
principal_header = "x-uterm-principal"
role_header = "x-uterm-role"
# Production JWT / Cloudflare Access:
#   scripts/uterm-server.jwt.example.toml
#   scripts/uterm-server.cf-access.example.toml

# Optional external authz (Python/Go/C#). When secret is set, webhook responses
# must be HMAC-signed (X-Uterm-Timestamp + X-Uterm-Signature).
# [governance]
# authz_webhook_url = "https://policy.example.com/authz"
# authz_webhook_secret = "REPLACE_WITH_SHARED_HMAC_SECRET"  # pragma: allowlist secret
# authz_webhook_timeout_s = 2.0

[ui]
app_path = "/app"
assets_path = "/_terminal"

[recording]
enabled_by_default = false
directory = ".uterm-recordings"

# [control_plane]
# backend = "memory"            # "memory" (default) or "sqlite"
# database_url = "~/.uterm/control_plane.db"  # required when backend = "sqlite"

[[sessions]]
session_id = "provide-shell"
display_name = "Provide Shell"
connector_type = "shell"
input_mode = "open"
auto_start = true
tags = ["demo", "reference"]

[[sessions]]
session_id = "public-bbs"
display_name = "Public Telnet BBS"
connector_type = "telnet"
input_mode = "hijack"
auto_start = false
host = "bbs.example.com"
port = 23
tags = ["telnet", "public"]

[[sessions]]
session_id = "ops-shell"
display_name = "Operations SSH Shell"
connector_type = "ssh"
input_mode = "hijack"
auto_start = false
host = "shell.example.com"
port = 22
username = "operator"
# Choose one auth method:
# password = "replace-me"
# client_key_path = "/abs/path/to/id_ed25519"
# client_key_data = \"\"\"-----BEGIN OPENSSH PRIVATE KEY-----
# ...
# -----END OPENSSH PRIVATE KEY-----\"\"\"
# Set this to a known_hosts file path in production. Omit it to disable checks in local/dev use.
# known_hosts = "/abs/path/to/known_hosts"
tags = ["ssh", "ops"]
