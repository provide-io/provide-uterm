[server]
host = "127.0.0.1"
port = 8780
public_base_url = "http://127.0.0.1:8780"
title = "provide-uterm-server"

[auth]
# Local/dev profile (header-compatible and no JWT requirements).
mode = "dev"
principal_header = "x-uterm-principal"
role_header = "x-uterm-role"
# For production, prefer scripts/uterm-server.jwt.example.toml

[ui]
app_path = "/app"
assets_path = "/_terminal"

[recording]
enabled_by_default = false
directory = ".uterm-recordings"

[graphical]
# Raw/dynamic graphical endpoints are development-only and disabled by default.
allow_dynamic_targets = false

# Static graphical targets persist secret references only. Relative file:
# references resolve from this TOML file's directory when a connection opens.
# [[graphical_targets]]
# target_id = "prod-vnc"
# endpoint = "dns:///graphical.internal:443"
# tls_mode = "mtls"
# ca_secret_ref = "file:secrets/ca.pem"  # pragma: allowlist secret
# client_cert_secret_ref = "env:UTERM_GRAPHICAL_CLIENT_CERT"  # pragma: allowlist secret
# client_key_secret_ref = "file:secrets/client.key"  # pragma: allowlist secret
# expected_server_name = "graphical.internal"
# allowed_vm_patterns = ["prod-*"]
# minimum_role = "operator"
# connect_timeout_s = 10.0
# handshake_timeout_s = 10.0
# allowed_cidrs = ["10.0.0.0/8"]

# [control_plane]
# backend = "memory"            # "memory" (default) or "sqlite"
# database_url = "~/.uterm/control_plane.db"  # required when backend = "sqlite"

[[sessions]]
session_id = "provide-shell"
display_name = "Provide Shell"
connector_type = "shell"
input_mode = "open"
auto_start = true
tags = ["demo", "reference"]

[[sessions]]
session_id = "public-bbs"
display_name = "Public Telnet BBS"
connector_type = "telnet"
input_mode = "hijack"
auto_start = false
host = "bbs.example.com"
port = 23
tags = ["telnet", "public"]

[[sessions]]
session_id = "ops-shell"
display_name = "Operations SSH Shell"
connector_type = "ssh"
input_mode = "hijack"
auto_start = false
host = "shell.example.com"
port = 22
username = "operator"
# Choose one auth method:
# password = "replace-me"
# client_key_path = "/abs/path/to/id_ed25519"
# client_key_data = \"\"\"-----BEGIN OPENSSH PRIVATE KEY-----
# ...
# -----END OPENSSH PRIVATE KEY-----\"\"\"
# Set this to a known_hosts file path in production. Omit it to disable checks in local/dev use.
# known_hosts = "/abs/path/to/known_hosts"
tags = ["ssh", "ops"]
