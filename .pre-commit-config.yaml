# Pre-commit config for provide-uterm.
#
# Environmental + strict type hooks are staged as `manual` because:
#   - tsc/biome/vitest need a fresh `npm install` in packages/provide-uterm-frontend/
#     before they can run. Developers running those should invoke
#     `pre-commit run --hook-stage manual`.
#   - mypy/ty/mypy-platform currently surface accumulated drift from the
#     window when upstream had Actions disabled. They stay manual until the
#     drift is cleaned up (separate scope from parity sync).
#
# Everyday hooks (ruff, reuse, codespell, bandit) run on every commit and
# are expected to be green.

repos:
  - repo: local
    hooks:
      - id: tsc
        name: TypeScript typecheck
        entry: node_modules/.bin/tsc -p packages/provide-uterm-frontend/tsconfig.json --noEmit
        language: system
        pass_filenames: false
        always_run: false
        types_or: [ts, javascript]
        stages: [manual]

      - id: biome
        name: biome lint+format
        entry: node_modules/.bin/biome ci packages/provide-uterm-frontend/src/
        language: system
        pass_filenames: false
        always_run: false
        types_or: [ts, javascript]
        stages: [manual]

      - id: vitest
        name: vitest frontend tests
        entry: npm test --workspace=packages/provide-uterm-frontend
        language: system
        pass_filenames: false
        always_run: false
        types_or: [ts, javascript]
        stages: [manual]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.2
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/fsfe/reuse-tool
    rev: v6.2.0
    hooks:
      - id: reuse

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.1
    hooks:
      - id: codespell
        additional_dependencies: ["tomli"]
        exclude: "package-lock\\.json"

  - repo: local
    hooks:
      - id: mypy
        name: mypy strict
        entry: mypy packages/provide-uterm/src/ --exclude packages/provide-uterm/src/provide/terminal/mcp/
        language: python
        language_version: python3.11
        additional_dependencies:
          - mypy==1.19.1
          - fastapi>=0.110
          - httpx>=0.27
          - pydantic>=2.0
          - uvicorn>=0.24
          - websockets>=16.0
          - asyncssh>=2.22.0
          - pyte>=0.8.2
          - pyjwt>=2.9
          - fastmcp>=2.0
          - provide-telemetry>=0.3
          - structlog>=24.0
          - textual>=0.50
        pass_filenames: false
        always_run: true
        types: [python]
        stages: [manual]

      - id: ty
        name: ty check
        entry: ty check packages/provide-uterm/src/ packages/provide-uterm-platform/src/ --extra-search-path packages/provide-uterm-platform/src/
        language: python
        language_version: python3.11
        additional_dependencies:
          - ty==0.0.19
          - pamela>=1.2
          - fastapi>=0.110
          - httpx>=0.27
          - pydantic>=2.0
          - uvicorn>=0.24
          - websockets>=16.0
          - asyncssh>=2.22.0
          - pyte>=0.8.2
          - pyjwt>=2.9
          - fastmcp>=2.0
          - provide-telemetry>=0.3
          - textual>=0.50
          - structlog>=24.0
        pass_filenames: false
        always_run: true
        types: [python]
        stages: [manual]

      - id: mypy-platform
        name: mypy strict (provide-uterm-platform)
        entry: bash -c 'MYPYPATH=packages/provide-uterm/src:packages/provide-uterm-platform/src mypy packages/provide-uterm-platform/src/provide/'
        language: system
        pass_filenames: false
        always_run: false
        types: [python]
        stages: [manual]

      - id: bandit
        name: bandit
        entry: bandit -r packages/provide-uterm/src/ packages/provide-uterm-platform/src/ -ll
        language: python
        language_version: python3.11
        additional_dependencies:
          - bandit==1.9.4
        pass_filenames: false
        always_run: true
        types: [python]
